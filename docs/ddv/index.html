<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Di Động Việt — Kiểm kê hàng hóa</title>
<meta name="theme-color" content="#231f20">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kiểm kê DDV">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>window.XLSX || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js"></script>
<style>
:root{
  --ink:#231f20; --ink-2:#3d4348; --muted:#7b8288; --line:#e6e8ea; --line-2:#f2f4f5;
  --bg:#f5f6f7; --surface:#ffffff; --surface-2:#fafbfb;
  --brand:#d01c2a; --brand-ink:#a31220; --brand-soft:#fdecee; --brand-line:#f6c9ce;
  --dark:#231f20; --dark-2:#3a3536;
  --ok:#177245; --ok-soft:#e7f4ec; --ok-line:#bfe2ce;
  --over:#b4690e; --over-soft:#fdf2e2; --over-line:#f3d9ab;
  --under:#c81e2b; --under-soft:#fdeced; --under-line:#f5c6ca;
  --info:#12557a; --info-soft:#e6f2f9; --info-line:#bcdcee;
  --purple:#6b21a8; --purple-soft:#f5ecfd;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(35,31,32,.05),0 4px 16px rgba(35,31,32,.07);
  --shadow-lg:0 8px 30px rgba(35,31,32,.16);
  --tap:46px;
  --font:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--bg);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:inherit}
.hidden{display:none!important}
.ic{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Shell ---------- */
#app{min-height:100vh;min-height:100dvh}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--dark);
  border-bottom:3px solid var(--brand);
  padding:max(8px,env(safe-area-inset-top)) 14px 9px;
  display:flex;align-items:center;gap:10px;color:#fff;
}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.logo-d{
  width:32px;height:32px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  background:#fff;font-weight:800;font-size:19px;line-height:1;letter-spacing:-1px;
  color:var(--dark);position:relative;overflow:hidden;
}
.logo-d::after{content:'';position:absolute;right:0;top:0;bottom:0;width:50%;
  background:var(--brand);border-radius:0 8px 8px 0;
  -webkit-mask:radial-gradient(circle at 0% 50%,transparent 52%,#000 53%);
  mask:radial-gradient(circle at 0% 50%,transparent 52%,#000 53%);}
.brandname{font-weight:800;font-size:14.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.brandsub{font-size:11px;color:rgba(255,255,255,.62);line-height:1.2;margin-top:1px;white-space:nowrap}
.brandsub b{color:rgba(255,255,255,.85);font-weight:700}
@media(max-width:420px){.brandsub{overflow:hidden;text-overflow:ellipsis;max-width:46vw}}
.topbar .spacer{flex:1}
.topbar .iconbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;width:36px;height:36px}
.topbar .iconbtn:active{background:rgba(255,255,255,.2)}

.syncchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:11.5px;
  color:#fff;font-weight:600;cursor:pointer;white-space:nowrap;max-width:52vw;overflow:hidden}
.syncchip:active{background:rgba(255,255,255,.2)}
.syncchip.ok{background:rgba(23,114,69,.3);border-color:rgba(74,222,128,.4)}
.syncchip.err{background:rgba(200,30,43,.35);border-color:rgba(248,113,113,.5)}
.syncchip.busy{background:rgba(180,105,14,.3);border-color:rgba(251,191,36,.4)}
.sdot{width:7px;height:7px;border-radius:50%;background:#9ca3af;flex:0 0 auto}
.sdot.ok{background:#4ade80}.sdot.err{background:#f87171}.sdot.busy{background:#fbbf24;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.35}}

.layout{display:flex;max-width:1180px;margin:0 auto}
.sidenav{display:none}
.main{flex:1;min-width:0;padding:15px 14px 92px}

@media(min-width:880px){
  .sidenav{display:flex;flex-direction:column;gap:2px;width:214px;flex:0 0 214px;
    padding:18px 12px;position:sticky;top:60px;align-self:flex-start;height:calc(100dvh - 60px)}
  .main{padding:22px 26px 40px}
  .tabbar{display:none!important}
  .navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
    color:var(--ink-2);font-weight:600;font-size:14px;border:1px solid transparent;background:none;text-align:left}
  .navitem .ic{opacity:.75}
  .navitem:hover{background:var(--surface)}
  .navitem.active{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
  .navitem.active .ic{opacity:1;color:var(--brand)}
  .navspacer{flex:1}
}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:6px 4px max(6px,env(safe-area-inset-bottom))}
.tab{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:5px 2px;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:10px}
.tab .ic{width:22px;height:22px}
.tab.active{color:var(--brand)}
.tab:active{background:var(--line-2)}

/* ---------- Generic ---------- */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-h h1{font-size:20px}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:var(--tap);
  padding:0 16px;border-radius:11px;border:1px solid var(--brand);background:var(--brand);color:#fff;
  font-weight:650;font-size:14px;line-height:1}
.btn:active{transform:translateY(1px)}
.btn .ic{width:18px;height:18px}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:active{background:var(--line-2)}
.btn.dark{background:var(--dark);border-color:var(--dark)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:transparent}
.btn.ghost:active{background:var(--line-2)}
.btn.danger{background:var(--surface);color:var(--under);border-color:var(--under-line)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.xs{min-height:32px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto}
.iconbtn:active{background:var(--line-2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:5px}
.input,select.input,textarea.input{width:100%;min-height:var(--tap);padding:10px 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface);color:var(--ink);outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.input{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.muted{color:var(--muted)}
.tagline{font-size:12px;color:var(--muted);line-height:1.5}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--line-2);color:var(--ink-2)}
.pill.brand{background:var(--brand-soft);color:var(--brand-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.over{background:var(--over-soft);color:var(--over)}
.pill.under{background:var(--under-soft);color:var(--under)}
.pill.purple{background:var(--purple-soft);color:var(--purple)}
.divider{height:1px;background:var(--line);margin:14px 0}
.sec-title{font-size:13px;font-weight:700;color:var(--ink-2);margin:16px 0 8px;display:flex;align-items:center;gap:7px}
.sec-title .ic{width:16px;height:16px;color:var(--brand)}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .ic{width:34px;height:34px;margin-bottom:8px;opacity:.4;stroke-width:1.5}
.empty .t{font-weight:650;color:var(--ink-2);font-size:14px}
.empty .s{font-size:12.5px;margin-top:3px}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:12px 13px}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:600}
.stat .v{font-size:24px;font-weight:780;letter-spacing:-.02em;margin-top:2px;line-height:1.1}
.stat .v small{font-size:12px;font-weight:600;color:var(--muted)}
.stat.accent{background:linear-gradient(170deg,#fff5f6,#fff 66%);border-color:var(--brand-line)}
.stat.accent .k{color:var(--brand-ink);font-weight:700}
.stat.accent .v{color:var(--brand)}

/* progress */
.prog{height:8px;background:var(--line-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#ef4b57);border-radius:999px;transition:width .35s}
.prog.ok>i{background:linear-gradient(90deg,var(--ok),#22a05f)}

/* list rows */
.listcard{overflow:hidden}
.lrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-top:1px solid var(--line-2);background:none;width:100%;text-align:left;border-left:none;border-right:none;border-bottom:none}
.lrow:first-child{border-top:none}
.lrow:active{background:var(--surface-2)}
.lmain{min-width:0;flex:1}
.lmain .t{font-weight:650;font-size:13.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lmain .s{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:var(--surface-2);
  border:1px solid var(--line);padding:1px 5px;border-radius:5px;color:var(--ink-2)}
.bar-ok{border-left:3px solid var(--ok)}
.bar-over{border-left:3px solid var(--over)}
.bar-under{border-left:3px solid var(--under)}
.bar-none{border-left:3px solid var(--line)}
.bar-out{border-left:3px solid var(--purple)}
.qtycol{text-align:right;flex:0 0 auto;min-width:62px}
.qtycol .big{font-weight:780;font-size:16px;line-height:1.1}
.qtycol .sm{font-size:11px;color:var(--muted);margin-top:1px}
.dcol{flex:0 0 auto;min-width:44px;text-align:right;font-weight:760;font-size:14px}

/* toolbar / search */
.toolbar{display:flex;gap:8px;margin-bottom:11px;flex-wrap:wrap}
.search{flex:1;min-width:150px;position:relative}
.search input{width:100%;min-height:var(--tap);padding:10px 12px 10px 38px;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);outline:none}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);
  stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:1px 0 3px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:640;display:inline-flex;align-items:center;gap:5px}
.fchip .n{font-size:10.5px;font-weight:700;background:var(--line-2);padding:1px 5px;border-radius:999px;color:var(--ink-2)}
.fchip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.fchip.on .n{background:rgba(255,255,255,.22);color:#fff}

/* count row */
.count-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line-2)}
.count-row:first-child{border-top:none}
.count-row .info{min-width:0;flex:1}
.count-row .info .t{font-weight:650;font-size:13.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.count-row .info .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.sysq{font-size:10.5px;color:var(--muted);text-align:center;min-width:50px;line-height:1.2;flex:0 0 auto}
.sysq b{display:block;font-size:15px;color:var(--ink);font-weight:730}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface);flex:0 0 auto}
.stepper button{width:36px;height:42px;border:none;background:var(--surface-2);font-size:20px;color:var(--ink-2);font-weight:600}
.stepper button:active{background:var(--line)}
.stepper input{width:48px;height:42px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);
  text-align:center;font-size:16px;font-weight:730;outline:none;background:var(--surface);padding:0}
.diffbadge{min-width:40px;text-align:center;font-weight:760;font-size:13.5px;flex:0 0 auto}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(35,31,32,.5);z-index:120;display:flex;
  align-items:flex-end;justify-content:center;padding:0;opacity:0;transition:opacity .2s;backdrop-filter:blur(2px)}
.modal-back.show{opacity:1}
@media(min-width:640px){.modal-back{align-items:center;padding:20px}}
.modal{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto;
  transform:translateY(24px);transition:transform .24s cubic-bezier(.32,.72,0,1);-webkit-overflow-scrolling:touch}
.modal-back.show .modal{transform:translateY(0)}
@media(min-width:640px){.modal{border-radius:16px;padding-bottom:16px}}
.modal-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.modal-h h3{font-size:16.5px;flex:1}
.modal-h p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.modal-grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
@media(min-width:640px){.modal-grip{display:none}}
.modal-actions{display:flex;gap:9px;margin-top:14px}
.modal-actions>*{flex:1}

/* toast */
.toasts{position:fixed;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);
  z-index:200;display:flex;flex-direction:column;gap:7px;align-items:center;width:max-content;max-width:92vw;pointer-events:none}
.toast{background:var(--dark);color:#fff;padding:10px 15px;border-radius:11px;font-size:13px;font-weight:600;
  opacity:0;transform:translateY(-10px);transition:all .22s;box-shadow:var(--shadow-lg);
  pointer-events:auto;max-width:100%;text-align:center;line-height:1.4;display:flex;align-items:center;gap:8px}
.toast .ic{width:16px;height:16px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.hide{opacity:0;transform:translateY(-6px)}
.toast.ok{background:var(--ok)}.toast.err{background:var(--under)}.toast.warn{background:var(--over)}.toast.info{background:var(--info)}

/* undo bar */
.undobar{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--dark);color:#fff;border-radius:12px;padding:9px 9px 9px 15px;display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow-lg);z-index:110;opacity:0;pointer-events:none;transition:all .24s;max-width:93vw;width:max-content}
.undobar.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.undobar .t{font-size:12.5px;font-weight:600;line-height:1.35}
.undobar .u{border:none;background:var(--brand);color:#fff;font-weight:750;font-size:12px;
  padding:8px 13px;border-radius:9px;white-space:nowrap}
.undobar .x{border:none;background:transparent;color:rgba(255,255,255,.5);padding:5px 4px;display:grid;place-items:center}
@media(min-width:880px){.undobar{bottom:22px}}

/* loading */
.loading{position:fixed;inset:0;background:rgba(255,255,255,.9);z-index:180;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;backdrop-filter:blur(2px)}
.loading.show{display:flex}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading .lt{font-size:13.5px;font-weight:650;color:var(--ink-2)}

/* offline */
.offbar{position:fixed;top:0;left:0;right:0;z-index:300;background:var(--dark);color:#fff;text-align:center;
  font-size:12px;font-weight:650;padding:7px 12px;transform:translateY(-100%);transition:transform .25s}
.offbar.show{transform:translateY(0)}
.offbar.ok{background:var(--ok)}

/* scanner */
#scanview{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
#scanview.on{display:flex}
#reader{flex:1;min-height:0;width:100%;position:relative;overflow:hidden}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.focusring{position:fixed;width:64px;height:64px;margin:-32px 0 0 -32px;border:2px solid #ffd23f;border-radius:50%;
  z-index:11;pointer-events:none;opacity:0}
.focusring.on{animation:fring .9s ease-out}
@keyframes fring{0%{opacity:1;transform:scale(1.35)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.engtag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.82);
  background:rgba(0,0,0,.4);border-radius:999px;padding:5px 10px;white-space:nowrap}
.engtag b{font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.scan-top .sb.on{background:#ffd23f;color:#1b1b1b;border-color:#ffd23f}
.scan-frame .box.seen i{border-color:#3ddc84}
.scan-frame .box.seen::after{background:linear-gradient(90deg,transparent,#3ddc84 12%,#3ddc84 88%,transparent);box-shadow:0 0 8px rgba(61,220,132,.8)}
/* Thẻ kết quả của chế độ +1 — nằm trên cùng, không che khung ngắm và nút bấm */
.qcard{position:absolute;left:10px;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 50px);z-index:14;
  background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);padding:10px 12px;
  transform:translateY(-12px);opacity:0;pointer-events:none;transition:transform .18s,opacity .18s;max-width:560px;margin:0 auto}
.qcard.show{transform:none;opacity:1;pointer-events:auto}
.qc-row{display:flex;align-items:center;gap:10px}
.qc-main{flex:1;min-width:0}
.qc-t{font-size:13.5px;font-weight:700;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qc-s{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap}
.qc-n{text-align:right;flex:0 0 auto}
.qc-n b{display:block;font-size:30px;line-height:1;font-weight:800;color:var(--ok)}
.qc-n span{font-size:10.5px;color:var(--muted)}
.qc-act{margin-top:9px}
.qc-act .qc-cnt{flex:1;font-size:11.5px;color:var(--muted);text-align:right}
.qc-act button{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;min-height:36px;
  padding:0 13px;font-weight:700;font-size:13px;color:var(--ink)}
.qc-warn{margin-top:7px;font-size:11.5px;color:#7a4708;background:var(--over-soft);border-radius:8px;
  padding:6px 8px;display:flex;gap:6px;align-items:center}
.qc-warn .ic{width:15px;height:15px}
.scan-top{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;gap:8px;
  padding:max(10px,env(safe-area-inset-top)) 12px 10px;
  background:linear-gradient(180deg,rgba(0,0,0,.62),transparent)}
.scan-top .sb{border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.35);color:#fff;
  padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:650;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(6px)}
.scan-top .sb .ic{width:15px;height:15px}
.scan-top .spacer{flex:1}
.scan-frame{position:absolute;inset:0;z-index:8;pointer-events:none;display:grid;place-items:center}
/* Khung ngắm khớp với vùng đọc thật (cộng thêm một ít lề). Ngoài vùng này app vẫn quét
   cả khung hình xen kẽ, nên mã lệch khung hoặc mã QR to vẫn bắt được. */
.scan-frame .box{width:min(68vw,290px);aspect-ratio:1/1;height:auto;position:relative;transition:none;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.38);border-radius:14px}
.scan-frame .box::after{content:'';position:absolute;left:6px;right:6px;top:50%;height:2px;
  background:linear-gradient(90deg,transparent,var(--brand) 12%,var(--brand) 88%,transparent);
  box-shadow:0 0 8px rgba(208,28,42,.8);animation:scanline 2s ease-in-out infinite}
@keyframes scanline{0%,100%{transform:translateY(-70px);opacity:.55}50%{transform:translateY(70px);opacity:1}}
.scan-frame .box i{position:absolute;width:26px;height:26px;border:3px solid var(--brand)}
.scan-frame .box i:nth-child(1){top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.scan-frame .box i:nth-child(2){top:-1px;right:-1px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.scan-frame .box i:nth-child(3){bottom:-1px;left:-1px;border-right:0;border-top:0;border-radius:0 0 0 14px}
.scan-frame .box i:nth-child(4){bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.scan-bottom{position:absolute;bottom:0;left:0;right:0;z-index:12;padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(0,0,0,.72),transparent);display:flex;flex-direction:column;gap:9px;transition:opacity .2s}
.scan-hint{color:rgba(255,255,255,.9);font-size:12px;text-align:center;font-weight:550}
.scan-zoom{display:none;align-items:center;gap:9px;color:#fff;font-size:12px}
.scan-zoom input{flex:1;accent-color:var(--brand)}
/* Gợi ý khi gõ vài số cuối — mã đầy đủ dài 14 số, gõ hết rất mất thời gian */
.sugbox{display:none;max-height:40vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--surface);border-radius:12px;margin-bottom:7px;box-shadow:var(--shadow-lg)}
.sugbox.on{display:block}
.sugi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;
  background:none;padding:10px 12px;border-top:1px solid var(--line-2)}
.sugi:first-child{border-top:none}
.sugi:active{background:var(--line-2)}
.sugb{flex:1;min-width:0}
.sugb .t{font-size:13px;font-weight:650;color:var(--ink);line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sugb .s{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sugb .s em{font-style:normal;background:#fde68a;color:#78350f;border-radius:3px;padding:0 2px;font-weight:700}
.sugq{text-align:right;flex:0 0 auto}
.sugq .n{font-size:15px;font-weight:780;line-height:1}
.sugq .l{font-size:10px;color:var(--muted);margin-top:1px}
.sugmore{padding:8px 12px;font-size:11.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line-2)}
.scan-manual{display:flex;gap:7px}
.scan-manual input{flex:1;min-height:44px;border-radius:11px;border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.45);color:#fff;padding:0 13px;outline:none;font-size:15px;backdrop-filter:blur(6px)}
.scan-manual input::placeholder{color:rgba(255,255,255,.5)}
.scan-manual button{border:none;background:var(--brand);color:#fff;padding:0 17px;border-radius:11px;font-weight:700;font-size:14px}
.scan-still{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;
  padding:11px;border-radius:11px;font-weight:650;font-size:13px;backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;gap:7px}
.scan-still .ic{width:17px;height:17px}


/* ===== Tab Kiểm kê: thanh lọc dính trên đầu + dòng gọn ===== */
.main{--mx:14px}
@media(min-width:880px){ .main{--mx:26px} }
.cbar{position:sticky;top:var(--tbh,56px);z-index:20;background:var(--bg);
  margin:0 calc(-1 * var(--mx)) 10px;padding:6px var(--mx) 9px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 6px 10px -10px rgba(35,31,32,.35)}
.cbar .search{min-width:0}
.cbar .search input{padding-right:92px}
.search .sfind,.search .sx{position:absolute;top:50%;transform:translateY(-50%);border:none;background:none;
  display:grid;place-items:center;color:var(--ink-2);border-radius:9px}
.search .sfind{right:5px;width:40px;height:36px;background:var(--dark);color:#fff}
.search .sfind .ic{width:18px;height:18px}
.search .sx{right:48px;width:34px;height:34px;color:var(--muted)}
.search .sx .ic{width:16px;height:16px}
.seg{display:flex;background:var(--line-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-width:0;border:none;background:none;border-radius:9px;padding:6px 2px;font-size:12.5px;font-weight:650;
  color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.seg button .num{font-size:11.5px;color:var(--muted);font-weight:750}
.seg button.on{background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.seg button.on .num{color:var(--brand)}
.cbar2{display:flex;gap:7px;align-items:center;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cbar2::-webkit-scrollbar{display:none}
.grpbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--ink-2);max-width:64vw}
.grpbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grpbtn .ic{width:15px;height:15px}
.grpbtn i{font-style:normal;font-size:11px;opacity:.7}
.grpbtn.on{border-color:var(--dark);background:var(--dark);color:#fff}
.subchips{display:flex;gap:6px;flex:0 0 auto}
.subchips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.subchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.subchips .num{opacity:.7}
.crow{display:flex;align-items:center;gap:10px;padding:10px 11px;border-top:1px solid var(--line-2);
  border-left:3px solid var(--line);cursor:pointer;-webkit-user-select:none;user-select:none}
.crow:first-child{border-top:none}
.crow:active{background:var(--line-2)}
.crow .cm{flex:1;min-width:0}
.crow .t{font-weight:650;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crow .s{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:3px;font-size:11.5px;color:var(--muted);align-items:center}
.crow .cc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.crow .cc b{color:var(--ink);font-weight:800}
.crow .s b.num{color:var(--ink-2)}
.crow .who{color:var(--info);font-weight:600}
.cq{flex:0 0 auto;width:60px;height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--surface-2);border:1px dashed var(--line)}
.cq b{font-size:20px;font-weight:800;line-height:1;color:var(--ink)}
.cq span{font-size:10px;font-weight:700;margin-top:3px;color:var(--muted);white-space:nowrap}
.st-none .cq b{color:var(--muted);font-weight:500}
.st-ok{border-left-color:var(--ok)} .st-ok .cq{background:var(--ok-soft);border:1px solid var(--ok-line)} .st-ok .cq b,.st-ok .cq span{color:var(--ok)}
.st-under{border-left-color:var(--under)} .st-under .cq{background:var(--under-soft);border:1px solid var(--under-line)} .st-under .cq b,.st-under .cq span{color:var(--under)}
.st-over{border-left-color:var(--over)} .st-over .cq{background:var(--over-soft);border:1px solid var(--over-line)} .st-over .cq b,.st-over .cq span{color:var(--over)}
.st-out{border-left-color:var(--purple)} .st-out .cq{background:var(--purple-soft);border:1px solid #e3cdf7} .st-out .cq b,.st-out .cq span{color:var(--purple)}
.st-done{border-left-color:var(--info)} .st-done .cq{background:var(--info-soft);border:1px solid var(--info-line)} .st-done .cq b,.st-done .cq span{color:var(--info)}
.csent{text-align:center;font-size:11.5px;color:var(--muted);padding:12px 0 4px}
.grplist{max-height:58vh;overflow:auto}
.invqr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;width:min(64vw,250px);margin:4px auto 0}
.invqr svg{display:block;width:100%;height:auto}
.invsteps{margin:0;padding-left:19px;display:grid;gap:5px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.invstaff{display:flex;flex-wrap:wrap;gap:6px}
.invstaff small{color:var(--over);font-weight:600}
.eq-x{display:flex;gap:16px;margin-top:12px}
.eq-x button{border:none;background:none;padding:4px 0;font-size:12.5px;font-weight:650;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.eq-x button .ic{width:15px;height:15px}
.eq-x .dg{color:var(--under);margin-left:auto}
.grplist .lrow.on{background:var(--brand-soft)}
.grplist .lrow .ic{color:var(--brand)}

/* ===== Tab Nhóm hàng: thanh tổng + lưới ô ===== */
.ring{--c:var(--info);width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p) * 1%), var(--line-2) 0)}
.ring.ok{--c:var(--ok)}
.ring span{width:calc(100% - 9px);height:calc(100% - 9px);border-radius:50%;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--ink);line-height:1}
.ring small{font-size:.62em;font-weight:700;color:var(--muted)}
.gsum{display:flex;gap:14px;align-items:center;padding:14px}
.gsum .ring{width:68px;height:68px}
.gsum .ring span{font-size:17px;width:calc(100% - 12px);height:calc(100% - 12px)}
.gs-m{flex:1;min-width:0}
.gs-t{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.gs-t b{font-size:19px;color:var(--ink)}
.gs-s{font-size:12px;color:var(--muted);margin-top:2px}
.gs-l{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:11px}
@media(min-width:700px){ .gtiles{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media(min-width:1100px){ .gtiles{grid-template-columns:repeat(4,minmax(0,1fr))} }
.gtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:11px 11px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;transition:transform .12s}
.gtile:active{transform:scale(.97)}
.gtile.done{background:var(--surface-2);box-shadow:none}
.gtile.done .gt-n{color:var(--ink-2)}
.gtile.off{opacity:.55;box-shadow:none;background:var(--surface-2)}
.gt-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:7px}
.gt-av{display:flex;padding-left:6px}
.gt-av .av{width:24px;height:24px;font-size:10.5px;border:2px solid var(--surface);margin-left:-7px}
.gt-av .av.more{background:var(--ink-2)}
.gt-n{font-weight:700;font-size:13.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt-s{font-size:11.5px;color:var(--muted)}
.gt-b{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;min-height:2px}
.gt-b:empty{display:none}
.gt-edit{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px;padding-top:9px;
  border-top:1px solid var(--line-2);font-size:11.5px;color:var(--ink-2)}

/* ===== PHÂN CÔNG ===== */
.asgrow{padding:12px 13px;border-top:1px solid var(--line-2)}
.asgrow:first-child{border-top:none}
.asghead{display:flex;align-items:center;gap:10px}
.asghead .n{font-size:13.5px;font-weight:700}
.asghead .m{font-size:11.5px;color:var(--muted);margin-top:2px}
.asgtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.asgtag{font-size:11px;font-weight:650;background:var(--brand-soft);color:var(--brand-ink);
  border:1px solid var(--brand-line);border-radius:999px;padding:3px 9px}
.asgtag i{font-style:normal;opacity:.7;font-weight:600}

/* ===== LỊCH PHÂN CA ===== */
.brushbar{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.brushbar .bl{font-size:11.5px;color:var(--muted);font-weight:650;flex:0 0 auto}
.bchips{display:flex;gap:6px;overflow-x:auto;flex:1;padding:1px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bchips::-webkit-scrollbar{display:none}
.bch{flex:0 0 auto;border:2px solid transparent;border-radius:10px;padding:6px 12px;
  font-size:12.5px;font-weight:750;line-height:1.15;text-align:center;transition:transform .1s}
.bch i{display:block;font-style:normal;font-size:9.5px;opacity:.7;font-weight:600;margin-top:1px}
.bch.on{box-shadow:0 2px 8px rgba(0,0,0,.18)}
.bch:active{transform:scale(.94)}
.swatch{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  font-size:11px;font-weight:800;flex:0 0 auto}

.wkbar{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:7px 8px;margin-bottom:9px;box-shadow:var(--shadow);flex-wrap:wrap}
.wkb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
  font-size:19px;line-height:1;color:var(--ink-2);flex:0 0 auto}
.wkb:active{background:var(--line)}
.wkl{flex:1;text-align:center;min-width:96px}
.wkl b{display:block;font-size:13.5px}
.wkl span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.wkt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;
  font-size:11.5px;font-weight:650;color:var(--ink-2);flex:0 0 auto}
.wkt:active{background:var(--line-2)}

.alertbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow)}
.alerttop{display:flex;align-items:center;gap:8px;width:100%;border:none;background:var(--over-soft);
  padding:9px 12px;font-size:12.5px;color:var(--over);text-align:left}
.alerttop .ic{width:15px;height:15px;flex:0 0 auto}
.alerttop b{font-weight:700}
.alerttop .pill{flex:0 0 auto}
.alerttop .ac{margin-left:auto;font-size:11.5px;font-weight:650;opacity:.8;flex:0 0 auto}
.alertbody{max-height:210px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.alertrow{padding:7px 12px;font-size:11.5px;border-top:1px solid var(--line-2);color:var(--ink-2);line-height:1.4}
.alertrow.err{color:var(--under)}.alertrow.warn{color:var(--over)}.alertrow.info{color:var(--muted)}
.pill.under{background:var(--under-soft);color:var(--under)}

.shwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.shtab{border-collapse:collapse;width:100%;min-width:620px;font-size:12px}
.shtab th,.shtab td{border:1px solid var(--line)}
.shtab thead th{background:var(--dark);color:#fff;padding:6px 4px;text-align:center;
  font-size:11.5px;font-weight:700}
.shtab thead th span{display:block;font-size:10px;opacity:.6;font-weight:500;margin-top:1px}
.shtab thead th.td{background:var(--brand)}
.shtab th.cnr{background:var(--dark);text-align:left;padding-left:10px;min-width:120px;
  position:sticky;left:0;z-index:3}
.shtab th.rowh{text-align:left;padding:7px 9px;min-width:120px;position:sticky;left:0;z-index:2;cursor:pointer}
.shtab th.rowh b{display:block;font-size:12.5px;font-weight:750;line-height:1.2}
.shtab th.rowh span{display:block;font-size:10.5px;font-weight:600;margin-top:2px}
.shtab td.cell{padding:4px;min-width:78px;cursor:pointer;background:var(--surface);vertical-align:middle;
  -webkit-user-select:none;user-select:none;touch-action:pan-x pan-y}
.shtab td.cell:active{background:var(--line-2)}
.shpill{display:block;font-size:10.5px;font-weight:750;padding:3px 5px;border-radius:6px;
  margin-bottom:2px;text-align:center;line-height:1.25}
.shpill i{display:block;font-style:normal;font-size:9.5px;opacity:.72;font-weight:600}
.offtxt{display:block;text-align:center;color:var(--line);font-size:16px;font-weight:700;padding:6px 0;line-height:1}

.qp{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.qpi{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n k" "h k" "c k";
  gap:1px 10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);
  border-radius:11px;padding:10px 12px;margin-bottom:7px;align-items:center}
.qpi.on{border-color:var(--ok);background:var(--ok-soft)}
.qpn{grid-area:n;font-size:13.5px;font-weight:700;color:var(--ink)}
.qph{grid-area:h;font-size:11.5px;color:var(--muted)}
.qpc{grid-area:c;font-size:11px;color:var(--muted);font-weight:600}
.qpc.lack{color:var(--under)}
.qpk{grid-area:k;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--line-2);color:var(--muted);font-size:17px;font-weight:800}
.qpi.on .qpk{background:var(--ok);color:#fff}

.cpick{display:flex;gap:6px;flex-wrap:wrap}
.cbt{width:36px;height:36px;border-radius:10px;border:2px solid transparent;font-weight:800;font-size:14px}
.cbt.on{border-color:var(--ink)}

/* kỳ kiểm chéo */
.blindq{opacity:.32;color:var(--muted)}
.crossbar{background:linear-gradient(140deg,var(--purple),#8b3fc4);color:#fff;border-radius:var(--radius);
  padding:12px 13px;margin-bottom:11px;box-shadow:0 3px 14px rgba(107,33,168,.24)}
.cb-top{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:5px}
.cb-top .ic{width:17px;height:17px}
.cb-top b{letter-spacing:.4px;font-size:12.5px}
.cb-top .pill{background:rgba(255,255,255,.22);color:#fff;margin-left:auto;flex:0 0 auto}
.cb-top .pill.ok{background:#fff;color:var(--purple)}
.cb-txt{font-size:11.5px;opacity:.86;line-height:1.45}
.cb-act{margin-top:9px}
.cb-note{font-size:11px;opacity:.8;font-style:italic}
.pill.purple{background:var(--purple-soft);color:var(--purple)}

/* nháy màn hình khi quét — kênh báo hiệu duy nhất luôn hoạt động trên iPhone im lặng */
.scanflash{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0;
  background:rgba(23,114,69,.45);box-shadow:inset 0 0 0 7px var(--ok);transition:opacity .09s}
.scanflash.on{opacity:1;transition:opacity .05s}
.scanflash.bad{background:rgba(200,30,43,.42);box-shadow:inset 0 0 0 7px var(--under)}

/* scan result sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--surface);
  border-radius:18px 18px 0 0;transform:translateY(101%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:82dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 0 calc(14px + env(safe-area-inset-bottom))}
.sheet.show{transform:translateY(0)}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px}
.sheet .body{padding:8px 15px 0}
.sheet .pname{font-size:15px;font-weight:720;line-height:1.32}
.sheet .pmeta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.sheet .actions{display:flex;gap:8px;margin-top:13px}
.warnbox{display:flex;gap:8px;padding:9px 11px;border-radius:10px;font-size:12px;line-height:1.45;margin-bottom:11px}
.warnbox .ic{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
.warnbox.warn{background:var(--over-soft);border:1px solid var(--over-line);color:#7a4708}
.warnbox.info{background:var(--info-soft);border:1px solid var(--info-line);color:#0d4460}
.bigcount{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:11px 12px}
.bigcount .stepper button{width:44px;height:50px;font-size:23px}
.bigcount .stepper input{width:62px;height:50px;font-size:21px}
.bigcount .rt{text-align:right}
.bigcount .rt .d{font-size:20px;font-weight:800;line-height:1.1}
.bigcount .rt .l{font-size:11px;margin-top:2px}

/* team */
.tmrow{display:flex;align-items:center;gap:11px;padding:12px 13px;border-top:1px solid var(--line-2)}
.tmrow:first-child{border-top:none}
.av{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:14px}
.tmb{flex:1;min-width:0}
.tmb .n{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px}
.tmb .m{font-size:11.5px;color:var(--muted);margin-top:2px}
.odot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto;box-shadow:0 0 0 2px var(--ok-soft)}
.odot.idle{background:var(--over);box-shadow:0 0 0 2px var(--over-soft)}
.odot.off{background:var(--line);box-shadow:none}
.tmc{text-align:right;flex:0 0 auto}
.tmc .n{font-size:18px;font-weight:800;color:var(--brand);line-height:1}
.tmc .l{font-size:10px;color:var(--muted);margin-top:2px}

/* group cards */
.gcard{padding:12px 13px;border-top:1px solid var(--line-2)}
.gcard:first-child{border-top:none}
.gtop{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.gtop .gn{font-weight:680;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtop .gp{font-size:12.5px;font-weight:730;color:var(--brand)}
.gstat{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.switch{position:relative;width:40px;height:23px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;cursor:pointer}
.switch .sl:before{content:"";position:absolute;width:19px;height:19px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .sl{background:var(--ok)}
.switch input:checked + .sl:before{transform:translateX(17px)}

/* session cards */
.scur{background:linear-gradient(150deg,var(--dark),#3d3739);color:#fff;border-radius:var(--radius);padding:15px;position:relative;overflow:hidden}
.scur::after{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:rgba(208,28,42,.22)}
.scur .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;opacity:.6;font-weight:700}
.scur .nm{font-size:18px;font-weight:780;margin:3px 0 2px;position:relative}
.scur .mt{font-size:12px;opacity:.72}
.scur .acts{display:flex;gap:7px;margin-top:13px;position:relative;flex-wrap:wrap}
.scur .acts button{flex:1;min-width:92px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);
  color:#fff;padding:9px 6px;border-radius:10px;font-size:12px;font-weight:680;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.scur .acts button:active{background:rgba(255,255,255,.24)}
.scur .acts button.dg{background:rgba(208,28,42,.35);border-color:rgba(248,113,113,.4)}
.scur .acts .ic{width:14px;height:14px}
.srow{padding:12px 13px;border-top:1px solid var(--line-2)}
.srow:first-child{border-top:none}
.srow .st{font-weight:680;font-size:13.5px}
.srow .ss{font-size:11.5px;color:var(--muted);margin-top:2px}
.srow .sa{display:flex;gap:6px;margin-top:9px}

/* history */
.hrow{display:flex;align-items:center;gap:10px;padding:10px 13px;border-top:1px solid var(--line-2)}
.hrow:first-child{border-top:none}
.hic{width:32px;height:32px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:14px}
.hsep{padding:7px 13px 4px;font-size:10.5px;font-weight:750;color:var(--muted);background:var(--surface-2);
  text-transform:uppercase;letter-spacing:.4px;border-top:1px solid var(--line-2)}

/* radio option */
.opt{display:flex;align-items:flex-start;gap:9px;border:1.5px solid var(--line);border-radius:11px;
  padding:10px 11px;margin-bottom:7px;cursor:pointer;font-size:13px;font-weight:400;color:var(--ink-2)}
.opt input{margin-top:2px;flex:0 0 auto;accent-color:var(--brand)}
.opt small{color:var(--muted);font-size:11.5px;line-height:1.4;display:block;margin-top:2px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt b{color:var(--ink)}

/* quick actions */
.qacts{display:flex;gap:7px;overflow-x:auto;padding:1px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.qacts::-webkit-scrollbar{display:none}
.qbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:650;color:var(--ink-2);box-shadow:var(--shadow)}
.qbtn:active{background:var(--line-2)}
.qbtn .ic{width:16px;height:16px;color:var(--brand)}

/* hero scan */
.heroscan{display:flex;align-items:center;gap:13px;padding:15px;width:100%;text-align:left;
  background:linear-gradient(135deg,var(--brand),#e63946);color:#fff;border:none;border-radius:var(--radius);
  box-shadow:0 4px 16px rgba(208,28,42,.28);position:relative;overflow:hidden}
.heroscan::after{content:'';position:absolute;top:-26px;right:-26px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.11)}
.heroscan:active{transform:scale(.985)}
.heroscan .hic{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:0 0 auto}
.heroscan .hic .ic{width:24px;height:24px}
.heroscan .ht{font-size:15.5px;font-weight:780}
.heroscan .hs{font-size:11.5px;opacity:.86;margin-top:1px}

/* nav grid */
.ngrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(min-width:620px){.ngrid{grid-template-columns:repeat(4,1fr)}}
.ncard{padding:13px 11px;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.ncard:active{background:var(--surface-2)}
.ncard .nic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.ncard .nic .ic{width:18px;height:18px}
.ncard .nt{font-size:13px;font-weight:720;line-height:1.2}
.ncard .ns{font-size:11px;color:var(--muted);line-height:1.3}

/* login */
.loginwrap{position:fixed;inset:0;z-index:400;background:linear-gradient(160deg,var(--dark),#3a3436 70%);
  display:flex;align-items:center;justify-content:center;padding:20px}
.logincard{background:var(--surface);border-radius:18px;padding:22px 20px;width:100%;max-width:380px;
  box-shadow:0 20px 60px rgba(0,0,0,.4)}
.loginbrand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.loginbrand .lb1{font-size:17px;font-weight:800;letter-spacing:-.01em}
.loginbrand .lb2{font-size:12px;color:var(--muted);margin-top:1px}
.lgmsg{font-size:12.5px;color:var(--under);min-height:18px;margin:2px 0 6px;font-weight:600}
.lgfoot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:16px;padding-top:13px;border-top:1px solid var(--line-2)}
.lgfoot b{color:var(--ink-2)}

/* tên người kiểm nổi bật */
.who{color:var(--ok);font-weight:750}
.whochip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--ok);font-size:11.5px;font-weight:750}
.whochip .ic{width:12px;height:12px}

/* thẻ số liệu bấm được */
.stat.tap{cursor:pointer;transition:transform .12s,box-shadow .15s}
.stat.tap:active{transform:scale(.97)}
.stat.tap::after{content:'›';position:absolute;top:9px;right:11px;color:var(--muted);font-size:15px;opacity:.55}
.stat{position:relative}

/* khoá quyền */
.locked{opacity:.5;pointer-events:none}
.lockrow{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:7px}
.lockrow .ic{width:13px;height:13px}

/* info bar */
.infobar{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;font-size:12.5px;box-shadow:var(--shadow);flex-wrap:wrap}
.infobar .seg{display:flex;align-items:center;gap:6px;min-width:0}
.infobar .seg .ic{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
.infobar .seg b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.infobar .sp{width:1px;height:15px;background:var(--line)}
.infobar .ed{margin-left:auto;display:flex;gap:5px}
</style>

<script>
/* ==========================================================================
   Di Động Việt — Kiểm kê hàng hóa
   Kiến trúc: IndexedDB (nguồn dữ liệu chính) + JSONBin (đồng bộ nhiều máy)
   ========================================================================== */

const DB_NAME = 'ddv_kiemke';
const DB_VER = 7;
const SYNC_LS = 'ddv:sync:v2';

let db = null;
let S = {                 // toàn bộ trạng thái runtime
  view: 'home',
  shopName: 'Di Động Việt',
  shopCode: '',
  checker: '',
  sessionId: null,
  sessions: [],
  products: [],           // của kỳ hiện tại
  excluded: new Set(),
  presence: {},
  filter: 'all',
  group: 'all',
  q: '',
  page: 0,
  histQ: '',
  me: null,        // tài khoản đang đăng nhập
  users: [],
  assign: {},      // { 'tên nv': ['Nhóm A','Nhóm B'] }
  onlyMine: true,  // nhân viên mặc định chỉ xem phần việc được giao
  reveal: false    // kỳ chéo: tạm hiện tồn hệ thống (chỉ quản trị)
};

/* Kỳ "kiểm chéo": người kiểm KHÔNG nhìn thấy tồn hệ thống trong lúc đếm, để con số
   đếm được là khách quan. Đối chiếu chỉ mở ra sau khi đếm xong. */
function curSession(){ return S.sessions.find(x => x.id === S.sessionId) || null; }
function isCross(){ const s = curSession(); return !!(s && s.mode === 'cross'); }
function blind(){ return isCross() && !S.reveal; }
const PAGE = 40;

/* ---------- tiện ích ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => new Date().toISOString();
const svg = (n, cls) => '<svg class="' + (cls || 'ic') + '"><use href="#' + n + '"/></svg>';

function dstamp(){ const d=new Date(); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes()); }
function relTime(iso){
  if(!iso) return '';
  const m = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if(m < 1) return 'vừa xong';
  if(m < 60) return m + ' phút trước';
  if(m < 1440) return Math.round(m/60) + ' giờ trước';
  return new Date(iso).toLocaleDateString('vi-VN');
}
function hhmm(d){ d=d||new Date(); return d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}); }

/* ---------- IndexedDB ---------- */
function openDB(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('products')) d.createObjectStore('products', {keyPath:'key'});
      if(!d.objectStoreNames.contains('sessions')) d.createObjectStore('sessions', {keyPath:'id'});
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', {keyPath:'key'});
      if(!d.objectStoreNames.contains('history')) d.createObjectStore('history', {keyPath:'id', autoIncrement:true});
      if(!d.objectStoreNames.contains('users')) d.createObjectStore('users', {keyPath:'u'});
      if(!d.objectStoreNames.contains('shift')) d.createObjectStore('shift', {keyPath:'k'});
    };
    rq.onsuccess = e => { db = e.target.result; res(db); };
    rq.onerror = e => rej(e.target.error);
  });
}
const st = (n, m) => db.transaction(n, m || 'readonly').objectStore(n);
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function getMeta(k){ const r = await rq(st('meta').get(k)); return r ? r.value : null; }
async function setMeta(k, v){ return rq(st('meta','readwrite').put({key:k, value:v})); }
async function allProducts(){ return (await rq(st('products').getAll())) || []; }
async function allSessions(){ return (await rq(st('sessions').getAll())) || []; }
async function allHistory(){ return (await rq(st('history').getAll())) || []; }

async function bulkPut(store, list){
  if(!list || !list.length) return;
  if(store === 'products'){
    // Ghi lại một sản phẩm nghĩa là nó "sống lại" — phải gỡ bia mộ cũ, nếu không
    // lần đồng bộ kế tiếp sẽ lại chôn nó (gặp khi bấm Hoàn tác sau khi xoá).
    const t = (await getMeta('tombs')) || {};
    let changed = false;
    const at = now();
    list.forEach(x => {
      if(!x.mtime) x.mtime = at;
      if(t[x.key]){ delete t[x.key]; changed = true; }
    });
    if(changed) await setMeta('tombs', t);
  }
  const tx = db.transaction(store, 'readwrite');
  const s = tx.objectStore(store);
  list.forEach(x => s.put(x));
  return new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function bulkDel(store, keys){
  if(!keys || !keys.length) return;
  const tx = db.transaction(store, 'readwrite');
  const s = tx.objectStore(store);
  keys.forEach(k => s.delete(k));
  await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  if(store === 'products') await markDeleted(keys);
}

/* Xoá sản phẩm ở máy này thôi thì chưa đủ: bản trên Cloud vẫn còn và sẽ được đẩy
   ngược về ở lần đồng bộ kế tiếp. Phải ghi lại "bia mộ" (key + thời điểm xoá) rồi
   gửi kèm lên Cloud để mọi máy cùng bỏ sản phẩm đó đi. */
const TOMB_KEEP_MS = 7 * 24 * 3600 * 1000;
async function getTombs(){
  const t = (await getMeta('tombs')) || {};
  const lim = Date.now() - TOMB_KEEP_MS;
  let changed = false;
  Object.keys(t).forEach(k => { if(new Date(t[k]).getTime() < lim){ delete t[k]; changed = true; } });
  if(changed) await setMeta('tombs', t);
  return t;
}
async function markDeleted(keys){
  const t = (await getMeta('tombs')) || {};
  const at = now();
  keys.forEach(k => t[k] = at);
  await setMeta('tombs', t);
}
async function mergeTombs(remote){
  const t = (await getMeta('tombs')) || {};
  let changed = false;
  Object.keys(remote || {}).forEach(k => {
    if(!t[k] || remote[k] > t[k]){ t[k] = remote[k]; changed = true; }
  });
  if(changed) await setMeta('tombs', t);
  return t;
}
/* Sản phẩm bị coi là đã xoá nếu bia mộ được ghi SAU lần sửa cuối của nó */
function isBuried(p, tombs){
  const at = tombs[p.key];
  return !!(at && at >= mt(p));
}

function makeKey(p, sid){
  const s = sid || p.sessionId || S.sessionId || 'default';
  let base;
  if(p.barcode && String(p.barcode).trim()) base = 'B:' + String(p.barcode).trim();
  else if(p.maSP && String(p.maSP).trim()) base = 'M:' + String(p.maSP).trim();
  else if(p.id) base = 'I:' + p.id;
  else base = 'T:' + Date.now() + Math.random().toString(36).slice(2, 7);
  return s + '|' + base;
}
function calcStatus(ht, tt, isOut){
  if(isOut) return 'out';
  if(tt == null) return 'none';
  const h = Number(ht) || 0, t = Number(tt) || 0;
  return t === h ? 'ok' : (t < h ? 'under' : 'over');
}

/* Xét theo thứ tự từ trên xuống, khớp cái nào trước lấy cái đó.
   Nhóm "Máy / Thiết bị" phải đứng CUỐI và chỉ nhận khi tên không mang dấu hiệu
   phụ kiện — vì hầu hết phụ kiện đều có chữ IPHONE/SAMSUNG trong tên, để nhóm này
   lên trên sẽ nuốt hết (VD "KCL IPHONE 14" là kính cường lực, không phải máy). */
const GROUPS = [
  {k:'Dán / Cường lực', re:/\bkcl\b|\bppf\b|cường lực|cuong luc|kính cường|kinh cuong|miếng dán|mieng dan|\bdán\b|\bdan \b|mica|cddh|dán màn|dan man/i},
  {k:'Ốp lưng', re:/\bốp\b|\bop \b|\bcase\b|bao da|bao vệ|bao ve|ốp lưng/i},
  {k:'Cáp sạc', re:/\bcáp\b|\bcap \b|\bcable\b|dây sạc|day sac|type ?c to|lightning/i},
  {k:'Củ sạc', re:/củ sạc|cu sac|adapter|sạc nhanh|cốc sạc|coc sac|\bgan\b|sạc tường/i},
  {k:'Pin dự phòng', re:/pin dự phòng|sạc dự phòng|power ?bank|\bpdp\b|pin sạc/i},
  {k:'Tai nghe', re:/tai nghe|headphone|earbud|airpod|\bbuds\b|\btws\b/i},
  {k:'Loa', re:/\bloa\b|speaker|soundbar/i},
  {k:'Thẻ nhớ / USB', re:/thẻ nhớ|the nho|\busb\b|sd ?card|\botg\b|hub/i},
  {k:'Gậy / Giá đỡ', re:/\bgậy\b|gay chup|giá đỡ|gia do|tripod|\bstand\b|holder|\bkẹp\b|magsafe/i},
  {k:'Đồng hồ / Vòng', re:/đồng hồ|dong ho|\bwatch\b|\bband\b|dây đeo|day deo/i},
  {k:'Sim / Dịch vụ', re:/\bsim\b|gói cước|goi cuoc|dịch vụ|bảo hành mở rộng/i},
  {k:'Máy / Thiết bị', re:/^(iphone|ipad|samsung|xiaomi|oppo|macbook|laptop|máy)\b/i}
];
function detectGroup(ten, cha){
  const s = ((ten||'') + ' ' + (cha||'')).toLowerCase();
  for(const g of GROUPS) if(g.re.test(s)) return g.k;
  return 'Khác';
}
const isExcluded = p => S.excluded.has(p.group || 'Khác');
/* Nhân viên chỉ làm nhóm được giao. Ai chưa được giao thì thấy toàn bộ, và luôn có
   nút chuyển sang xem tất cả khi cần tra cứu SP ngoài phần việc của mình. */
function inMyScope(p){
  if(!S.onlyMine || isAdmin()) return true;
  const mine = myGroups();
  if(!mine.length) return true;
  return mine.indexOf(p.group || 'Khác') >= 0;
}
const activeProducts = list => (list || S.products).filter(p => !isExcluded(p) && inMyScope(p));

async function hashPw(pw){
  // Băm SHA-256 kèm muối cố định — không lưu mật khẩu dạng chữ thường
  const data = new TextEncoder().encode('ddv2026$' + pw);
  try{
    if(crypto && crypto.subtle){
      const h = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  // Dự phòng khi WebCrypto không dùng được (thường do chạy qua http)
  let h = 0; const s = 'ddv2026$' + pw;
  for(let i=0;i<s.length;i++) h = ((h<<5)-h+s.charCodeAt(i))|0;
  return 'f' + (h>>>0).toString(16);
}

}

}

  '</div></div>');
  const pw = document.getElementById('lgPw'), sel = document.getElementById('lgUser'), out = document.getElementById('lgMsg');

    const u = findUser(sel.value);

  toast(x.name + ' → ' + (x.role === 'admin' ? 'Quản trị' : 'Nhân viên'), 'ok'); pushSoon();
}

/**
 * Gọi API JSONBin với retry giãn cách.
 * LƯU Ý QUAN TRỌNG: KHÔNG dùng keepalive — trình duyệt giới hạn body của request
 * keepalive ở 64KB, chunk dữ liệu của app vượt mức đó nên Safari/iOS ném
 * "Load failed" mà không kèm mã lỗi HTTP nào. Đây chính là lỗi Cloud trước đây.
 */
async function jbFetch(url, opt, tries){
  tries = tries == null ? 3 : tries;
  let lastErr = null;
  for(let i = 0; i <= tries; i++){
    try{
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), 25000);
      let res;
      bumpReq();
      try{ res = await fetch(url, Object.assign({}, opt, {signal: ctl.signal, cache:'no-store'})); }
      finally{ clearTimeout(to); }

      if(res.status === 429 || res.status === 503){
        if(i < tries){ await sleep(900 * Math.pow(2, i) + Math.random()*400); continue; }
        throw new Error('Cloud quá tải, thử lại sau ít phút');
      }
      if(res.status === 401 || res.status === 403) throw new Error('Sai API Key — kiểm tra lại X-Master-Key');
      if(res.status === 404) throw new Error('Không tìm thấy Bin — kiểm tra lại Bin ID');
      if(!res.ok){
        let t = ''; try{ t = (await res.text()).slice(0, 120); }catch(e){}
        throw new Error('HTTP ' + res.status + (t ? ' · ' + t : ''));
      }
      return res;
    }catch(e){
      lastErr = e;
      const m = String(e && e.message || e);
      // Lỗi mạng chập chờn thì thử lại; lỗi cấu hình thì dừng ngay cho người dùng biết
      const retryable = /Load failed|Failed to fetch|NetworkError|aborted|timeout|network/i.test(m);
      if(i < tries && retryable){ await sleep(700 * (i + 1)); continue; }
      break;
    }
  }
  throw lastErr || new Error('Không gọi được Cloud');
}

async function binCreate(payload, name){
  const c = syncCfg();
  const r = await jbFetch('https://api.jsonbin.io/v3/b', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Master-Key':c.key.trim(),'X-Bin-Private':'true','X-Bin-Name':name||'DDV-KiemKe'},
    body: JSON.stringify(payload)
  });
  const j = await r.json();
  const id = j && j.metadata && j.metadata.id;
  if(!id) throw new Error('Cloud không trả về Bin ID');
  return id;
}
async function binPut(id, payload){
  const c = syncCfg();
  await jbFetch('https://api.jsonbin.io/v3/b/' + encodeURIComponent(id), {
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':c.key.trim()},
    body: JSON.stringify(payload)
  });
}
async function binGet(id){
  const c = syncCfg();
  const r = await jbFetch('https://api.jsonbin.io/v3/b/' + encodeURIComponent(id) + '/latest', {
    headers:{'X-Master-Key':c.key.trim(),'X-Bin-Meta':'false'}
  });
  const j = await r.json();
  return (j && j.record) ? j.record : j;
}
async function binDel(id){
  const c = syncCfg();
  try{ await jbFetch('https://api.jsonbin.io/v3/b/' + id, {method:'DELETE', headers:{'X-Master-Key':c.key.trim()}}, 0); }catch(e){}
}

/* Rút gọn sản phẩm trước khi gửi lên mây — bỏ các trường chỉ dùng cục bộ */
function slim(p){
  return {
    key:p.key, id:p.id||'', barcode:p.barcode||'', maSP:p.maSP||'', tenSP:p.tenSP||'',
    group:p.group||'', tonHT:p.tonHT==null?0:p.tonHT, tonTT:p.tonTT==null?null:p.tonTT,
    diff:p.diff==null?null:p.diff, status:p.status||'none', sessionId:p.sessionId||'',
    checker:p.checker||'', checkedAt:p.checkedAt||'',
    // mtime = lần sửa gần nhất, KHÁC với checkedAt (lần đếm gần nhất).
    // Reset số đếm cũng là một lần sửa, nên phải có mtime mới; nếu chỉ dựa vào
    // checkedAt thì bản trên Cloud (còn dấu thời gian cũ) sẽ thắng và đẩy số cũ về.
    mtime:p.mtime || p.checkedAt || '',
    isOut:!!p.isOut
  };
}
function chunkBySize(list, max){
  const out = []; let cur = []; let b = 2;
  const enc = new TextEncoder();
  for(const it of list){
    const n = enc.encode(JSON.stringify(it)).length + 1;
    if(cur.length && b + n > max){ out.push(cur); cur = []; b = 2; }
    cur.push(it); b += n;
  }
  if(cur.length) out.push(cur);
  return out;
}
/* Bản ghi nào sửa sau thì thắng. Dùng mtime chứ không dùng checkedAt, để thao tác
   "xoá số đã đếm" cũng được coi là một thay đổi mới và không bị số cũ ghi đè lại. */
const mt = p => (p && (p.mtime || p.checkedAt || '')) || '';
function newer(a, b){ return mt(a) >= mt(b); }

/* ---------- Gộp danh sách tài khoản giữa các máy ----------
   Trước đây máy nào đẩy lên sau thì ghi đè TOÀN BỘ danh sách tài khoản: máy mới cài
   (chỉ có tài khoản mặc định Thịnh / 123456) có thể ghi đè mật khẩu thật trên Cloud,
   hoặc tài khoản vừa tạo ở máy khác bị mất. Giờ gộp từng tài khoản: bản sửa sau thắng,
   tài khoản đã xoá được ghi nhận để máy khác xoá theo. */
const umt = u => (u && (u.mt || u.at)) || '';
async function mergeUsers(rUsers, rTombs){
  const tombs = Object.assign({}, (await getMeta('userTombs')) || {});
  Object.keys(rTombs || {}).forEach(k => { if(!tombs[k] || rTombs[k] > tombs[k]) tombs[k] = rTombs[k]; });
  const local = await allUsers();
  const map = {}, rmap = {};
  (Array.isArray(rUsers) ? rUsers : []).forEach(u => { if(u && u.u){ const k = normName(u.u); rmap[k] = u; if(!map[k] || umt(u) > umt(map[k])) map[k] = u; } });
  local.forEach(u => { if(u && u.u){ const k = normName(u.u); if(!map[k] || umt(u) > umt(map[k])) map[k] = u; } });
  Object.keys(map).forEach(k => { if(tombs[k] && tombs[k] >= umt(map[k]) && !isOwner(map[k].u)) delete map[k]; });
  const tx = db.transaction('users', 'readwrite'), os = tx.objectStore('users');
  local.forEach(u => { const m = map[normName(u.u)]; if(!m || m.u !== u.u) os.delete(u.u); });
  Object.values(map).forEach(u => os.put(u));
  await new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
  await setMeta('userTombs', tombs);
  S.users = await allUsers();
  if(S.me){ const f = findUser(S.me.u); if(f) S.me = f; }
  const users = Object.values(map);
  const changed = users.some(u => { const r = rmap[normName(u.u)]; return !r || umt(u) > umt(r); }) ||
                  Object.keys(rmap).some(k => !map[k]);
  return {users, tombs, changed};
}
