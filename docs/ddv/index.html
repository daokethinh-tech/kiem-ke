}
function buzz(pattern){
  try{
    if(navigator.vibrate) return navigator.vibrate(pattern || [45,28,72]);
  }catch(e){}
  return false;
}
function beep(bad){
  buzz(bad ? [90,60,90] : [45,28,72]);
  flashOK(bad);
  try{
    const C = window.AudioContext||window.webkitAudioContext; if(!C) return;
    window._ac = window._ac || new C();
    const a = window._ac; if(a.state==='suspended') a.resume();
    const mk = (f, t0, dur, vol) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, a.currentTime + t0);
      g.gain.exponentialRampToValueAtTime(vol, a.currentTime + t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t0 + dur);
      o.connect(g); g.connect(a.destination);
      o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + 0.01);
    };
    if(bad){ mk(420, 0, 0.13, 0.22); mk(300, 0.14, 0.17, 0.22); }
    else { mk(1180, 0, 0.075, 0.2); mk(1760, 0.075, 0.1, 0.23); }
  }catch(e){}
}

/* ---------- Khớp mã ----------
   Tem in tại quầy (VD 080300041811) và mã trong file kho (VD 33000000041811) chỉ trùng nhau
   ở phần đuôi. Trước đây app chỉ so 5 số cuối — dễ khớp nhầm sang SP khác có cùng 5 số đuôi.
   Giờ so từ dài tới ngắn (8 → 7 → 6 → 5 số), lấy mức dài nhất có kết quả, nên tem chuẩn
   (4 số đầu + 8 số cuối của barcode) luôn khớp đúng 1 SP. */
const APP_VER = '2026.11.06-7';
const TAIL_LENS = [8, 7, 6, 5];
const TAIL_LEN = 5;
const digits = s => String(s == null ? '' : s).replace(/\D/g, '');
const tailOf = s => { const d = digits(s); return d.length >= TAIL_LEN ? d.slice(-TAIL_LEN) : ''; };
let _tIdx = null, _tIdxSrc = null, _tIdxN = -1;
function tailIndex(){
  if(_tIdx && _tIdxSrc === S.products && _tIdxN === S.products.length) return _tIdx;
  const idx = {};
  TAIL_LENS.forEach(L => idx[L] = new Map());
  S.products.forEach(p => {
    const seen = new Set();
    [p.barcode, p.maSP, p.id].forEach(v => {
      const d = digits(v);
      TAIL_LENS.forEach(L => {
        if(d.length < L) return;
        const t = d.slice(-L), k = L + ':' + t;
        if(seen.has(k)) return;
        seen.add(k);
        if(!idx[L].has(t)) idx[L].set(t, []);
        idx[L].get(t).push(p);
      });
    });
  });
  _tIdx = idx; _tIdxSrc = S.products; _tIdxN = S.products.length;
  return idx;
}
function findByCode(code){
  const raw = String(code).trim().toLowerCase();
  const noZero = raw.replace(/^0+/, '');
  const d = digits(code);

  // 1. Khớp tuyệt đối — luôn ưu tiên, tránh nhận nhầm khi mã vốn đã đúng
  const exact = S.products.filter(p =>
    (p.barcode||'').toLowerCase() === raw ||
    (noZero && (p.barcode||'').toLowerCase().replace(/^0+/,'') === noZero) ||
    (d && digits(p.barcode) === d) ||
    (p.maSP||'').toLowerCase() === raw ||
    String(p.id||'').toLowerCase() === raw);
  if(exact.length) return exact;

  // 2. Khớp theo đuôi mã — đuôi càng dài càng chắc
  const idx = tailIndex();
  for(const L of TAIL_LENS){
    if(d.length < L) continue;
    const m = idx[L].get(d.slice(-L));
    if(m && m.length){ const r = m.slice(); r.tail = L; return r; }
  }
  return [];
}
/* QR trên tem có thể chứa link, hoặc mã kèm giá / tên ("050100006617|550000").
   Tách ra các "ứng viên" và thử lần lượt, cái nào ra sản phẩm thì lấy cái đó. */
function codeCandidates(text){
  const s = String(text || '').trim();
  const out = [];
  const add = x => { x = String(x || '').trim(); if(x && out.indexOf(x) < 0) out.push(x); };
  add(s);
  if(/[^0-9A-Za-z\-]/.test(s) || s.length > 24){
    try{
      const u = new URL(s);
      u.searchParams.forEach(v => add(v));
      u.pathname.split('/').forEach(x => { if(x.length >= 5) add(x); });
    }catch(e){}
    s.split(/[^0-9A-Za-z\-]+/).filter(x => x.length >= 5).forEach(add);
    (s.match(/\d{6,}/g) || []).forEach(add);
  }
  return out;
}
let _rcKey = '', _rcVal = null;
function resolveCode(text){
  if(text === _rcKey && _rcVal && _rcVal.src === S.products && _rcVal.n === S.products.length) return _rcVal;
  const c = codeCandidates(text);
  let out = null;
  for(const x of c){
    const m = findByCode(x);
    if(m.length){ out = {code:x, list:m}; break; }
  }
  if(!out){
    // Không khớp: lấy phần "giống mã nhất" (dài số nhất) để ghi nhận SP ngoài hệ thống
    const best = c.slice(1).sort((a, b) => digits(b).length - digits(a).length)[0];
    out = {code: best || c[0] || String(text || '').trim(), list:[]};
  }
  out.src = S.products; out.n = S.products.length;
  _rcKey = text; _rcVal = out;
  return out;
}
async function onScan(text){
  const code = String(text||'').trim();
  if(!code || paused) return;
  handleCode(code, true);
}

/* ---------- Gợi ý theo vài số cuối ----------
   Mã đầy đủ dài 14 số nên gõ hết rất mất thời gian. Gõ từ 3 ký tự là app dò theo
   phần đuôi và hiện danh sách để chạm chọn, thay vì phải gõ đúng cả mã. */
const SUG_MIN = 3, SUG_MAX = 8;

function suggestFor(q){
  const raw = String(q||'').trim().toLowerCase();
  if(raw.length < SUG_MIN) return [];
  const d = raw.replace(/\D/g,'');
  const pool = S.group !== 'all' ? S.products : activeProducts();
  const exact = [], tail = [], partial = [], byName = [];
  pool.forEach(p => {
    const bc = String(p.barcode||'').toLowerCase();
    const ma = String(p.maSP||'').toLowerCase();
    const bd = digits(p.barcode), md = digits(p.maSP);
    if(bc === raw || ma === raw){ exact.push(p); return; }
    // Ưu tiên khớp đúng phần ĐUÔI — đây là cách người dùng gõ nhanh hay dùng nhất
    if(d && d.length >= SUG_MIN && (bd.endsWith(d) || md.endsWith(d))){ tail.push(p); return; }
    if(d && d.length >= 4 && (bd.includes(d) || md.includes(d))){ partial.push(p); return; }
    if(raw.length >= 3 && String(p.tenSP||'').toLowerCase().includes(raw)){ byName.push(p); return; }
  });
  return exact.concat(tail, partial, byName).slice(0, SUG_MAX + 1);
}

function sugRowHTML(p, q){
  const d = String(q||'').replace(/\D/g,'');
  const bc = String(p.barcode || p.maSP || '—');
  // Tô đậm phần vừa gõ để mắt kiểm tra nhanh có đúng mã mình cần không
  let shown = esc(bc);
  if(d && digits(bc).endsWith(d)){
    const cut = bc.length - d.length;
    if(cut >= 0) shown = esc(bc.slice(0, cut)) + '<em>' + esc(bc.slice(cut)) + '</em>';
  }
  const done = p.tonTT != null;
  return '<button class="sugi" data-k="' + esc(p.key) + '">' +
    '<span class="sugb"><span class="t">' + esc(p.tenSP || 'Không tên') + '</span>' +
    '<span class="s"><span class="code">' + shown + '</span>' +
      '<span>' + esc(p.group || 'Khác') + '</span>' +
      (done ? '<span class="pill ok">đã đếm ' + p.tonTT + '</span>' : '') + '</span></span>' +
    (blind() ? '' : '<span class="sugq"><span class="n num">' + (p.tonHT == null ? 0 : p.tonHT) + '</span>' +
    '<span class="l">tồn HT</span></span>') + '</button>';
}

let sugTimer = null;
function onManualInput(){
  clearTimeout(sugTimer);
  sugTimer = setTimeout(renderSug, 120);
}
function renderSug(){
  const inp = $('manualCode'), box = $('sugBox');
  if(!inp || !box) return;
  const q = inp.value;
  const list = suggestFor(q);
  if(!list.length){
    box.classList.remove('on');
    box.innerHTML = '';
    return;
  }
  const shown = list.slice(0, SUG_MAX);
  box.innerHTML = shown.map(p => sugRowHTML(p, q)).join('') +
    (list.length > SUG_MAX ? '<div class="sugmore">Còn nữa — gõ thêm số để thu hẹp</div>' : '');
  box.classList.add('on');
  box.querySelectorAll('.sugi').forEach(el => el.onclick = () => {
    const p = S.products.find(x => x.key === el.dataset.k);
    if(!p) return;
    if(_findMode){ clearSug(); inp.value = ''; inp.blur(); findGo([p], p.barcode || p.maSP); return; }
    clearSug();
    inp.value = ''; inp.blur();
    beep();
    hideQuick();
    paused = true;
    showSheet(p);
  });
}
function clearSug(){
  const box = $('sugBox');
  if(box){ box.classList.remove('on'); box.innerHTML = ''; }
}
/* Đang gõ mã tay thì tạm dừng đọc camera — tránh camera tự bắt mã khác chen ngang */
function onManualFocus(){ paused = true; }
function onManualBlur(){
  setTimeout(() => {
    if(!$('scanSheet').classList.contains('show') && !$('mback')) paused = false;
  }, 250);
}

function submitManual(){
  const v = $('manualCode').value.trim();
  if(!v) return;
  if(_findMode){
    _findMode = false; clearSug(); $('manualCode').value = '';
    stopScan().then(() => { S.q = v; S.filter = 'all'; S.group = 'all'; S.page = 0; go('count'); });
    return;
  }
  // Gõ ngắn mà chỉ khớp đúng một SP thì vào thẳng, khỏi bắt chạm thêm một nhịp
  const sug = suggestFor(v);
  clearSug();
  $('manualCode').value = '';
  $('manualCode').blur();
  hideQuick();
  if(sug.length === 1){ beep(); paused = true; showSheet(sug[0]); return; }
  if(sug.length > 1){ beep(); paused = true; showPicker(v, sug.slice(0, 12)); return; }
  handleCode(v, false);
}
/* fromCam = mã do camera đọc. Ở chế độ "+1 liên tục" chỉ mã từ camera mới tự cộng;
   mã gõ tay vẫn mở bảng nhập số lượng vì gõ tay thường là để nhập cả số lượng. */
function handleCode(code, fromCam){
  const r = resolveCode(code);
  const m = r.list;
  if(_findMode){ findGo(m, r.code); return; }
  if(!m.length){ beep(true); hideQuick(); paused = true; showOutside(r.code); return; }
  beep();
  if(m.length === 1){
    const p = m[0];
    const same = digits(p.barcode) === digits(r.code) || String(p.barcode||'') === r.code;
    if(fromCam && scanMode === 'plus'){ quickAdd(p, same ? '' : r.code, m.tail); return; }
    hideQuick();
    paused = true;
    showSheet(p, same ? '' : r.code, m.tail);
    return;
  }
  hideQuick();
  paused = true;
  showPicker(r.code, m, fromCam);
}

/* ---------- Chế độ +1: thẻ kết quả nhỏ, không chặn màn hình ---------- */
let _quickStart = {};   // số đếm trước khi bắt đầu chuỗi +1 của từng SP, để −1 về đúng chỗ cũ
async function saveCount(p, tt){
  p.tonTT = tt;
  p.diff = tt == null ? null : tt - (Number(p.tonHT)||0);
  p.status = calcStatus(p.tonHT, tt, p.isOut);
  p.checker = tt == null ? '' : (S.checker || '');
  p.checkedAt = tt == null ? '' : now();
  p.mtime = now();
  await bulkPut('products', [p]);
  if(tt != null) addHistory(p);
  const i = S.products.findIndex(x => x.key === p.key);
  if(i >= 0) S.products[i] = p;
  pushSoon();
}
async function quickAdd(p, scanned, tail){
  const prev = p.tonTT == null ? null : Number(p.tonTT);
  const prevBy = p.checker || '';
  if(!(p.key in _quickStart)) _quickStart[p.key] = prev;
  await saveCount(p, (prev || 0) + 1);
  quickN++;
  showQuick(p, {prev, prevBy, scanned, tail});
}
function showQuick(p, info){
  info = info || {};
  const el = $('qcard'); if(!el) return;
  const bl = blind();
  const ht = Number(p.tonHT) || 0, tt = p.tonTT == null ? 0 : Number(p.tonTT);
  const d = tt - ht;
  const st = calcStatus(ht, tt, p.isOut);
  const other = info.prev != null && info.prevBy && info.prevBy !== S.checker;
  el.innerHTML =
    '<div class="qc-row">' +
      '<div class="qc-main"><div class="qc-t">' + esc(p.tenSP || 'Không tên') + '</div>' +
        '<div class="qc-s"><span class="code">' + esc(p.barcode || p.maSP || '') + '</span>' +
        (info.scanned ? '<span>tem ' + esc(info.scanned) + ' · khớp ' + (info.tail || 5) + ' số cuối</span>' : '') + '</div></div>' +
      '<div class="qc-n"><b class="num">' + tt + '</b>' +
        (bl ? '<span>đã đếm</span>' : '<span>tồn ' + ht + '</span>') + '</div>' +
    '</div>' +
    (other ? '<div class="qc-warn">' + svg('i-alert') + 'Đang cộng tiếp vào số <b>' + info.prev + '</b> do <b>' + esc(info.prevBy) + '</b> đếm trước đó</div>' : '') +
    '<div class="qc-row qc-act">' +
      (bl ? '<span class="pill purple">Kiểm chéo</span>'
          : '<span class="pill ' + (STATUS_CLS[st]||'') + '">' + STATUS_TXT[st] + (d ? ' ' + (d > 0 ? '+' : '') + d : '') + '</span>') +
      '<span class="qc-cnt">' + quickN + ' lượt</span>' +
      '<button onclick="quickMinus()">−1</button>' +
      '<button onclick="quickEdit()">Sửa SL</button>' +
    '</div>';
  window._quickP = p;
  el.classList.add('show');
}
async function quickMinus(){
  const p = window._quickP; if(!p) return;
  const cur = p.tonTT == null ? 0 : Number(p.tonTT);
  let v = Math.max(0, cur - 1);
  // Trừ về 0 mà trước chuỗi quét SP này chưa được đếm → trả về "chưa kiểm" thay vì "đếm được 0"
  if(v === 0 && _quickStart[p.key] == null) v = null;
  await saveCount(p, v);
  quickN = Math.max(0, quickN - 1);
  if(v == null){ hideQuick(); toast('Đã bỏ lượt quét — SP trở về chưa kiểm', 'info', 2000); return; }
  showQuick(p, {});
}
function quickEdit(){
  const p = window._quickP; if(!p) return;
  hideQuick();
  paused = true;
  showSheet(p, '', 0, true);
}
function hideQuick(){
  const el = $('qcard');
  if(el) el.classList.remove('show');
  window._quickP = null;
}

/* ---------- Chụp & đọc ảnh nét cao ----------
   Dành cho tem quá nhỏ, mờ hoặc QR in kém: lấy ảnh độ phân giải cao nhất có thể
   (Android chụp ảnh thật qua ImageCapture, iPhone lấy khung hình video) rồi thử
   nhiều cỡ ảnh, xoay, đảo màu, lọc nhiễu. */
async function scanStill(){
  if(stillBusy || !scanning) return;
  const v = $('camVideo');
  if(!v || !v.videoWidth){ toast('Camera chưa sẵn sàng — chờ hình hiện lên rồi bấm lại','warn'); return; }
  stillBusy = true; paused = true;
  const wasmOk = await prepWasm();
  const found = [];
  const tryCanvas = async (opts) => {
    const W = camCv.width, H = camCv.height;
    if(camEngine === 'native' && camDetector){
      try{ (await camDetector.detect(camCv)).forEach(b => found.push(b.rawValue)); }catch(e){}
    }
    if(!found.length && wasmOk){
      try{ (await wasmRead(camCx.getImageData(0, 0, W, H), opts)).forEach(r => found.push(r.text)); }catch(e){}
    }else if(!found.length && (zxJs || await setupZxJs())){
      zxJsRead(W, H, false).concat(zxJsRead(W, H, true)).forEach(r => found.push(r.text));
    }
  };
  try{
    // Android: chụp 1 ảnh thật độ phân giải cao trước
    if(window.ImageCapture && camTrack && !isIOS()){
      loading(true, 'Đang chụp ảnh nét cao...');
      try{
        const blob = await Promise.race([new ImageCapture(camTrack).takePhoto(), sleep(4000).then(() => null)]);
        if(blob){
          const bmp = await createImageBitmap(blob);
          for(const mw of [2000, 1100]){
            const sc = Math.min(1, mw / bmp.width);
            camCv.width = Math.round(bmp.width * sc); camCv.height = Math.round(bmp.height * sc);
            camCx.drawImage(bmp, 0, 0, camCv.width, camCv.height);
            await tryCanvas({tryRotate:true, tryInvert:true, tryDenoise:true, maxNumberOfSymbols:8});
            if(found.length) break;
          }
        }
      }catch(e){}
    }
    // Mọi máy: chụp liên tiếp 6 khung trong ~1,5 giây, mỗi khung thử một kiểu đọc
    const plans = [
      () => { grab(true, 1280);  return {tryRotate:true, maxNumberOfSymbols:8}; },
      () => { grab(false, 1600); return {tryDenoise:true}; },
      () => { grab(false, 700);  return {tryDownscale:false, tryDenoise:true}; },
      () => { grab(true, 900);   return {binarizer:'GlobalHistogram', tryInvert:true, tryRotate:true}; },
      () => { grab(false, 1100); return {binarizer:'GlobalHistogram', tryDenoise:true}; },
      () => { grab(true, 640);   return {tryDownscale:false, tryInvert:true}; }
    ];
    for(let i = 0; i < plans.length && !found.length; i++){
      loading(true, 'Giữ yên máy · đang đọc (' + (i + 1) + '/' + plans.length + ')');
      await sleep(i ? 220 : 60);
      await tryCanvas(plans[i]());
    }
    loading(false);
    const uniq = Array.from(new Set(found.map(x => String(x).trim()).filter(Boolean)));
    paused = false;
    if(!uniq.length){
      beep(true);
      toast('Chưa đọc được. Đưa xa hơn chút (20–25 cm), bật Đèn nếu tối, giữ yên rồi bấm lại — hoặc gõ vài số cuối.','warn', 5000);
      return;
    }
    const good = uniq.filter(t => resolveCode(t).list.length);
    lastCode = good[0] || uniq[0]; lastAt = performance.now();
    handleCode(good[0] || uniq[0], true);
  }catch(e){
    loading(false); paused = false;
    toast('Không đọc được mã — thử lại', 'warn');
  }finally{ stillBusy = false; }
}
function hideSheet(){
  clearSug();
  $('scanSheet').classList.remove('show');
  $('scanBottom').style.opacity = '1';
  // Giữ nguyên mã vừa quét: nếu mã còn nằm trong khung thì không tự bật lại bảng ngay
  paused = false; lastAt = performance.now();
}
/* Bảng nhập số khi quét:
   - Ô số lượng = SỐ CỦA LẦN QUÉT NÀY (mặc định 1). Lưu là cộng vào tổng đã đếm.
     Trước đây ô này hiện tổng cộng dồn (VD 3+1 = 4), dễ nhầm là app điền sẵn tồn hệ thống.
   - noAdd = mở để SỬA TỔNG (nút "Sửa SL" / "Nhập lại tổng"): ô số lượng là tổng, lưu là ghi đè. */
function showSheet(p, scannedCode, tail, noAdd){
  const ht = Number(p.tonHT)||0;
  const had = p.tonTT != null;
  const prev = had ? Number(p.tonTT) : 0;
  const add = !noAdd;
  window._sheetPrev = prev; window._sheetAdd = add;
  const bl = blind();
  let info = '';
  if(had){
    const other = p.checker && S.checker && p.checker !== S.checker;
    const wt = p.checkedAt ? relTime(p.checkedAt) : '';
    const who = other ? '<b>' + esc(p.checker) + '</b>' : 'bạn';
    info = '<div class="warnbox ' + (other ? 'warn' : 'info') + '">' + svg(other ? 'i-alert' : 'i-info') +
      '<div style="flex:1">Đã đếm trước <b>' + prev + '</b> (' + who + (wt ? ', ' + wt : '') + ').' +
      '<span id="shModeTxt">' + (add ? ' Lưu sẽ <b>cộng thêm</b> số bên dưới.' : ' Đang <b>sửa tổng</b>.') + '</span>' +
      '<button class="btn xs sec" id="shModeBtn" style="margin-top:6px;display:flex" onclick="sheetMode()">' +
        (add ? 'Nhập lại tổng' : 'Cộng thêm') + '</button></div></div>';
  }
  const tailNote = scannedCode
    ? '<div class="warnbox info">' + svg('i-check') + '<div>Khớp theo <b>' + (tail || TAIL_LEN) + ' số cuối</b>: tem <span class="code">' +
      esc(scannedCode) + '</span> ↔ file <span class="code">' + esc(p.barcode||'—') + '</span></div></div>'
    : '';
  $('scanSheetBody').innerHTML =
    info + tailNote +
    '<div class="pname">' + esc(p.tenSP || 'Không tên') + '</div>' +
    '<div class="pmeta">' +
      (p.barcode ? '<span class="code">' + esc(p.barcode) + '</span>' : '') +
      (p.maSP ? '<span class="pill">' + esc(p.maSP) + '</span>' : '') +
      '<span class="pill">' + esc(p.group||'Khác') + '</span>' +
      (p.isOut ? '<span class="pill purple">Ngoài HT</span>' : '') +
    '</div>' +
    '<div class="bigcount">' +
      (bl ? '<div><div class="tagline">Tồn hệ thống</div><b style="font-size:19px;opacity:.35">••</b></div>'
          : '<div><div class="tagline">Tồn hệ thống</div><b class="num" style="font-size:21px">' + ht + '</b></div>') +
      '<div style="text-align:center"><div class="stepper">' +
        '<button onclick="sheetStep(-1)">−</button>' +
        '<input class="num" id="shQty" type="number" inputmode="numeric" min="0" value="' + (add ? 1 : prev) + '" oninput="sheetCalc()">' +
        '<button onclick="sheetStep(1)">+</button>' +
      '</div><div class="tagline" id="shQtyLbl" style="margin-top:4px">' + (add ? 'SL lần quét này' : 'Tổng đã đếm') + '</div></div>' +
      '<div class="rt"><div class="tagline">Đã đếm</div><div class="d num" style="color:var(--ink)">' + (had ? prev : '—') + '</div>' +
        (bl ? '<div class="l"><span class="pill purple">Kiểm chéo</span></div>'
            : (had ? '<div class="l"><span class="pill ' + (STATUS_CLS[calcStatus(ht, prev, p.isOut)]||'') + '">' + STATUS_TXT[calcStatus(ht, prev, p.isOut)] +
                (prev - ht ? ' ' + (prev - ht > 0 ? '+' : '') + (prev - ht) : '') + '</span></div>' : '<div class="l"><span class="pill">Chưa đếm</span></div>')) + '</div>' +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn sec" onclick="hideSheet()">Bỏ qua</button>' +
      '<button class="btn ok" style="flex:2" onclick="sheetSave()">' + svg('i-check') + 'LƯU &amp; QUÉT TIẾP</button>' +
    '</div>' +
    '<button class="btn sec block" style="margin-top:8px" onclick="sheetSaveBack()">' +
      svg('i-list') + 'Lưu &amp; trở về danh sách</button>' +
    '<div class="tagline" style="text-align:center;margin:9px 0 4px">Người kiểm: <span class="whochip">' + esc(S.checker||'—') + '</span></div>';
  window._sheetP = p;
  sheetCalc();
  $('scanSheet').classList.add('show');
  $('scanBottom').style.opacity = '0';
  setTimeout(() => { const i = $('shQty'); if(i){ i.focus(); i.select(); } }, 300);
}
/* Đổi giữa "cộng thêm" và "nhập lại tổng" */
function sheetMode(){
  const add = window._sheetAdd = !window._sheetAdd;
  const i = $('shQty'); if(!i) return;
  i.value = add ? 1 : (window._sheetPrev || 0);
  $('shQtyLbl').textContent = add ? 'SL lần quét này' : 'Tổng đã đếm';
  $('shModeTxt').innerHTML = add ? ' Lưu sẽ <b>cộng thêm</b> số bên dưới.' : ' Đang <b>sửa tổng</b>.';
  $('shModeBtn').textContent = add ? 'Nhập lại tổng' : 'Cộng thêm';
  sheetCalc(); i.focus(); i.select();
}
function sheetTotal(){
  const q = Math.max(0, parseInt($('shQty').value)||0);
  return window._sheetAdd ? (window._sheetPrev || 0) + q : q;
}
function sheetStep(d){
  const i = $('shQty'); if(!i) return;
  i.value = Math.max(0, (parseInt(i.value)||0) + d);
  sheetCalc();
}
function sheetCalc(){ /* ô số lượng chỉ là số của lần này — "Đã đếm" bên cạnh giữ nguyên tới khi lưu */ }
async function sheetSaveBack(){
  const ok = await sheetSave(true);
  if(ok !== false) stopScan();
}
async function sheetSave(quiet){
  const p = window._sheetP; if(!p) return;
  const tt = sheetTotal();
  const q = Math.max(0, parseInt($('shQty').value)||0);
  await saveCount(p, tt);
  if(!quiet) toast(String(p.tenSP||'').slice(0,24) + ': ' + (window._sheetAdd && window._sheetPrev ? window._sheetPrev + ' + ' + q + ' = ' : '') + tt, 'ok', 1700);
  else toast('Đã lưu ' + String(p.tenSP||'').slice(0,22) + ' = ' + tt, 'ok', 2000);
  hideSheet();
  return true;
}
function showPicker(code, list, fromCam){
  const b = modal('<div class="modal-h"><div><h3>Chọn sản phẩm</h3>' +
    '<p>Mã <span class="code">' + esc(code) + '</span> khớp ' + list.length + ' SP</p></div></div>' +

/* ---------- Import tồn kho ---------- */
let pendingImport = null;
/* Dò cột theo điểm số thay vì "khớp cái nào trước lấy cái đó".
   File tồn kho có cả "Tên sản phẩm cha" lẫn "Tên sản phẩm"; cột "cha" đứng trước
   và thường trống hoàn toàn, nên cách cũ luôn vớ phải nó → mọi SP thành "Không tên". */
const COL_RULES = {
  barcode: [[/^barcode$/i, 100], [/barcode|mã vạch|ma vach|^ean$|^upc$/i, 60]],
  maSP:    [[/^mã sản phẩm$|^ma san pham$|^mã sp$|^sku$/i, 100],
            [/mã sp|ma sp|mã hàng|ma hang|mã sản phẩm|sku|item ?code/i, 60]],
  tenSP:   [[/^tên sản phẩm$|^ten san pham$|^tên sp$/i, 100],
            [/tên sp|ten sp|tên sản phẩm|ten san pham|tên hàng|product ?name|diễn giải/i, 60]],
  id:      [[/^id$/i, 100], [/mã id/i, 60]],
  tenCha:  [[/^tên sản phẩm cha$|^tên cha$/i, 100], [/tên cha|ten cha|nhóm|nhom|category|loại|danh mục/i, 60]]
};
/* Cột "cha" là danh mục, không phải tên/mã sản phẩm — trừ điểm nặng để không bị chọn nhầm */
const PARENT_RE = /\bcha\b|parent/i;

function guessCols(head, rows){
  const map = {};
  const filled = i => {
    if(!rows) return 1;
    let n = 0;
    for(let r = 1; r < rows.length && r < 200; r++){
      const v = rows[r] && rows[r][i];
      if(v !== '' && v != null) n++;
    }
    return n;
  };
  Object.keys(COL_RULES).forEach(k => {
    let best = -1, bestScore = 0;
    head.forEach((h, i) => {
      const s = String(h||'').trim();
      if(!s) return;
      let sc = 0;
      COL_RULES[k].forEach(([re, pts]) => { if(re.test(s)) sc = Math.max(sc, pts); });
      if(!sc) return;
      if(k !== 'tenCha' && PARENT_RE.test(s)) sc -= 55;      // "… cha" gần như chắc chắn không phải cột cần
      if(filled(i) === 0) sc -= 40;                           // cột rỗng thì đừng chọn
      if(sc > bestScore){ bestScore = sc; best = i; }
    });
    if(best >= 0 && bestScore > 0) map[k] = best;
  });
  return map;
}
const COL_LABELS = {barcode:'Barcode', maSP:'Mã sản phẩm', tenSP:'Tên sản phẩm', id:'ID', tenCha:'Nhóm / danh mục'};
function stockCandidates(head){
  const out = [];
  head.forEach((h, i) => {
    const s = String(h||'').trim();
    if(!s) return;
    if(/tồn|ton |sl |số lượng|so luong|qty|quantity|kho|stock/i.test(s)) out.push({i, name:s});
  });
  return out;
}
async function onStockFile(ev){
  const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
  if(!isAdmin()){ needAdmin(); return; }
  if(!f) return;
  loading(true, 'Đang đọc file Excel...');
  try{
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sh = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sh, {header:1, defval:''});
    if(rows.length < 2) throw new Error('File không có dữ liệu');
    const head = rows[0].map(x => String(x||''));
    const colMap = guessCols(head, rows);
    if(colMap.barcode === undefined && colMap.maSP === undefined && colMap.tenSP === undefined)
      throw new Error('Không tìm thấy cột Barcode / Mã SP / Tên SP');
    let cands = stockCandidates(head);
    if(!cands.length) cands = head.map((h,i) => ({i, name:h||('Cột '+(i+1))}));
    pendingImport = {rows, head, colMap};
    loading(false);
    showImportModal(cands, head, colMap);
  }catch(e){ loading(false); toast('Lỗi đọc file: ' + e.message, 'err'); }
}

    '<div class="field"><label>Cách xử lý số đã đếm</label>' +
      '<label class="opt on" id="optM"><input type="radio" name="im" value="merge" checked>' +
      '<span><b>Giữ số đã đếm</b> (khuyên dùng)<small>Chỉ cập nhật tồn hệ thống. Kết quả đang làm dở giữ nguyên.</small></span></label>' +

  b.querySelector('#iGo').onclick = () => {
    const pick = id => { const el = b.querySelector('#' + id); if(!el) return undefined;
      const v = parseInt(el.value); return (isNaN(v) || v < 0) ? undefined : v; };
    doImport(
      parseInt(b.querySelector('#iCol').value),
      b.querySelector('#iShop').value.trim() || 'Cửa hàng',
      b.querySelector('input[name=im]:checked').value !== 'replace',
      {tenSP:pick('iName'), barcode:pick('iBar'), maSP:pick('iMa')});
  };
}
async function doImport(stockCol, shopName, keep, override){
  if(!pendingImport) return;
  closeModal();
  loading(true, 'Đang import & gộp dữ liệu...');
  try{
    const {rows, head} = pendingImport;
    // Cột do người dùng chọn tay được ưu tiên hơn cột app tự đoán
    const colMap = Object.assign({}, pendingImport.colMap);
    if(override) Object.keys(override).forEach(k => {
      if(override[k] !== undefined) colMap[k] = override[k];
    });
    const before = (await allProducts()).filter(p => p.sessionId === S.sessionId);
    const oldMap = {}; before.forEach(p => oldMap[p.key] = p);
    const snap = before.map(p => Object.assign({}, p));
    const seen = {}, out = [];
    let added = 0, upd = 0, dup = 0;

    for(let i = 1; i < rows.length; i++){
      const r = rows[i];
      if(!r || r.every(c => c === '' || c == null)) continue;
      const barcode = colMap.barcode !== undefined ? String(r[colMap.barcode]||'').trim() : '';
      const maSP = colMap.maSP !== undefined ? String(r[colMap.maSP]||'').trim() : '';
      const tenSP = colMap.tenSP !== undefined ? String(r[colMap.tenSP]||'').trim() : '';
      const id = colMap.id !== undefined ? r[colMap.id] : '';
      const cha = colMap.tenCha !== undefined ? String(r[colMap.tenCha]||'') : '';
      if(!barcode && !maSP && !tenSP) continue;
      const raw = r[stockCol];
      const tonHT = (raw === '' || raw == null) ? 0 : (Number(String(raw).replace(/[^\d.-]/g,'')) || 0);
      const key = makeKey({barcode, maSP, id});
      if(seen[key]){ dup++; continue; }
      seen[key] = 1;
      const o = oldMap[key];
      const keepIt = keep && o && o.tonTT != null;
      const p = {
        key, id: id || (o?o.id:''), barcode: barcode || (o?o.barcode:''), maSP: maSP || (o?o.maSP:''),
        tenSP: tenSP || (o?o.tenSP:'Không tên'),
        group: detectGroup(tenSP || (o?o.tenSP:''), cha),
        tonHT, tonTT: keepIt ? o.tonTT : null,
        checker: keepIt ? (o.checker||'') : '', checkedAt: keepIt ? (o.checkedAt||'') : '',
        sessionId: S.sessionId, isOut: false
      };
      p.diff = p.tonTT == null ? null : p.tonTT - tonHT;
      p.status = calcStatus(tonHT, p.tonTT, false);
      p.mtime = now();
      out.push(p);
      if(o) upd++; else added++;
      delete oldMap[key];
    }

    // SP đã đếm nhưng không còn trong file mới → chuyển thành "ngoài hệ thống"
    const kept = [];
    if(keep) Object.keys(oldMap).forEach(k => {
      const o = oldMap[k];
      if(o.tonTT != null){
        o.isOut = true; o.status = 'out'; o.tonHT = 0; o.diff = Number(o.tonTT)||0;
        o.mtime = now();
        kept.push(o);
      }
    });

    await bulkDel('products', before.map(p => p.key));
    await bulkPut('products', out.concat(kept));
    S.shopName = shopName; await setMeta('shopName', shopName);
    await setMeta('stockCol', head[stockCol] || '');
    pendingImport = null;
    await reloadProducts();
    loading(false); render();

    const doneN = S.products.filter(p => p.tonTT != null).length;
    let msg = 'Import xong: ' + added + ' mới, ' + upd + ' cập nhật, tổng ' + (out.length + kept.length) + ' SP';
    if(dup) msg += ' · bỏ ' + dup + ' dòng trùng';
    toast(msg, 'ok', 4000);
    if(keep && doneN) toast('Giữ lại ' + doneN + ' SP đã đếm', 'info');

    if(snap.length) pushUndo('Đã import ' + out.length + ' SP', async () => {
      const cur = (await allProducts()).filter(p => p.sessionId === S.sessionId);
      await bulkDel('products', cur.map(p => p.key));
      await bulkPut('products', snap);
    });

    if(syncOn()){
      loading(true, 'Đang đồng bộ lên Cloud...');
      const ok = await pushNow();
      loading(false);
      toast(ok ? 'Đã đồng bộ Cloud' : 'CHƯA đồng bộ được — chạm trạng thái để thử lại', ok?'ok':'warn', 4000);
    }
  }catch(e){ loading(false); console.error(e); toast('Lỗi import: ' + e.message, 'err'); }
}

/* ---------- Import kết quả quét ngoài ----------
   Nhận file từ súng bắn / app quét khác (LoMag, tool Súng Bắn Kiểm Kê, file kiểm kê mẫu…).
   Gộp theo SẢN PHẨM chứ không theo mã: một SP có thể dán nhiều tem khác ngày
   (VD 080300041811 và 091500041811) — cách cũ ghi đè số của tem này bằng tem kia. */
const cellTxt = v => v == null ? '' : (typeof v === 'number'
  ? (Number.isInteger(v) ? v.toLocaleString('fullwide', {useGrouping:false}) : String(v))
  : String(v).trim());
function readScanWorkbook(wb){
  const tally = {};
  const add = (c, q) => { c = cellTxt(c); if(!c) return; tally[c] = (tally[c] || 0) + (q > 0 ? q : 1); };
  // 1. File kiểm kê mẫu: sheet "Kiểm kê", mỗi lượt bắn là một dòng ở cột A từ dòng 5
  const kk = wb.SheetNames.find(n => /^ki[eể]m k[eê]$/i.test(String(n).normalize('NFC').trim()));
  if(kk){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[kk], {header:1, defval:'', raw:true});
    for(let i = 4; i < rows.length; i++) add(rows[i] && rows[i][0], 1);
    if(Object.keys(tally).length) return {tally, how:'cột A sheet "' + kk + '"'};
  }
  // 2. Sheet đầu tiên: tìm dòng tiêu đề trong 10 dòng đầu
  const sn = wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:'', raw:true});
  const CODE_RE = /barcode|mã vạch|ma vach|\bcode\b|\bean\b|mã sp|ma sp|mã sản phẩm|imei|bắn/i;
  const QTY_RE = /^(sl|số lượng|so luong|qty|quantity|count|sl quét|sl kiểm|số lượng quét|tồn thực tế|ton thuc te)$/i;
  let hr = -1, cCode = 0, cQty = -1;
  for(let i = 0; i < Math.min(rows.length, 10); i++){
    const r = (rows[i] || []).map(x => cellTxt(x));
    const ci = r.findIndex(h => h && h.length < 40 && CODE_RE.test(h));
    if(ci >= 0){ hr = i; cCode = ci; cQty = r.findIndex(h => QTY_RE.test(h)); break; }
  }
  let start = hr + 1;
  if(hr < 0){
    // Không có tiêu đề: cột đầu là mã. Dòng đầu trông như chữ (có khoảng trắng) thì bỏ qua
    start = (rows[0] && /\s/.test(cellTxt(rows[0][0])) && /[a-zà-ỹ]/i.test(cellTxt(rows[0][0]))) ? 1 : 0;
  }
  for(let i = start; i < rows.length; i++){
    const r = rows[i]; if(!r) continue;
    const q = cQty >= 0 ? Number(String(r[cQty]).replace(/[^\d.-]/g, '')) : 1;
    add(r[cCode], cQty >= 0 ? (q || 0) : 1);
  }
  return {tally, how: hr >= 0 ? 'cột "' + cellTxt(rows[hr][cCode]) + '"' + (cQty >= 0 ? ' + số lượng "' + cellTxt(rows[hr][cQty]) + '"' : '') : 'cột đầu tiên'};
}
async function onScanResFile(ev){
  const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
  if(!f) return;
  if(!S.products.length){ toast('Import file tồn kho trước đã','warn'); return; }
  loading(true, 'Đang đọc file quét...');
  try{
    let tally = {}, how = '';
    if(/\.(csv|txt)$/i.test(f.name)){
      (await f.text()).split(/\r?\n/).forEach(l => {
        const c = l.split(/[,;\t]/)[0].replace(/^"|"$/g, '').trim();
        if(c && !/\s/.test(c)) tally[c] = (tally[c] || 0) + 1;
      });
      how = 'cột đầu tiên';
    }else{
      ({tally, how} = readScanWorkbook(XLSX.read(await f.arrayBuffer(), {type:'array'})));
    }
    const codes = Object.keys(tally);
    if(!codes.length) throw new Error('Không tìm thấy mã nào');
    const byP = new Map(), miss = [], amb = [];
    let units = 0;
    codes.forEach(code => {
      units += tally[code];
      const r = resolveCode(code);
      if(r.list.length === 1){
        const p = r.list[0];
        const e = byP.get(p.key) || {p, q:0, codes:[]};
        e.q += tally[code]; e.codes.push(code);
        byP.set(p.key, e);
      }else if(r.list.length > 1) amb.push({code, q:tally[code], n:r.list.length});
      else miss.push({code, q:tally[code]});
    });
    loading(false);
    showScanImport(f.name, how, units, byP, miss, amb);
  }catch(e){ loading(false); toast('Lỗi import quét: ' + e.message, 'err'); }
}

/* ---------- Xuất Excel ---------- */
function fitCols(rows, max){
  if(!rows.length) return [];
  max = max || 46;
  return Object.keys(rows[0]).map(k => {
    let w = String(k).length;
    rows.forEach(r => { const v = r[k]; const l = v == null ? 0 : String(v).length; if(l > w) w = l; });
    return {wch: Math.min(max, Math.max(8, w + 2))};
  });
}

    const sf = s => String(s).replace(/[\\\/:*?"<>|]/g,'').replace(/\s+/g,'_').slice(0,36);
    const pre = (cur && cur.mode === 'cross') ? 'KiemCheo_' : 'KiemKe_';
    XLSX.writeFile(wb, pre + sf(S.shopName) + '_' + sf(ses) + '_' + dstamp() + '.xlsx');
    loading(false);
    toast('Đã xuất Excel · ' + P.length + ' SP · ' + lech.length + ' lệch', 'ok');
  }catch(e){ loading(false); console.error(e); toast('Lỗi xuất Excel: ' + e.message, 'err'); }
}

/* ---------- Backup ---------- */
async function exportBackup(){
  loading(true, 'Đang tạo backup...');
  try{
    const data = {
      _f:'ddv-kiemke-backup', _v:2, at:now(),
      shopCode:S.shopCode, shopName:S.shopName, checker:S.checker,
      sessionId:S.sessionId, sessions: await allSessions(),
      products: await allProducts(), history: await allHistory(),
      excluded: Array.from(S.excluded),
      assign: S.assign || {},
      shift: SH
    };
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'backup-kiemke-' + (S.shopCode || S.shopName.replace(/\s+/g,'') || 'ddv') + '-' + dstamp() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    loading(false);
    toast('Đã tải backup · ' + data.products.length + ' SP', 'ok');
  }catch(e){ loading(false); toast('Lỗi backup: ' + e.message, 'err'); }
}
async function onRestoreFile(ev){
  const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
  if(!isAdmin()){ needAdmin(); return; }
  if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!d || d._f !== 'ddv-kiemke-backup' || !Array.isArray(d.products))
      throw new Error('File không đúng định dạng backup');
    const ok = await confirmBox('Khôi phục từ backup?',
      '<b>' + d.products.length + ' SP</b> · ' + (d.sessions||[]).length + ' kỳ · xuất ' +
      (d.at ? new Date(d.at).toLocaleString('vi-VN') : '—') +
      '<br><br>Dữ liệu hiện tại trên máy này sẽ bị <b>thay thế</b>. Có thể hoàn tác trong 12 giây.',
      'Khôi phục', true);
    if(!ok) return;
    loading(true, 'Đang khôi phục...');
    const before = {p: await allProducts(), s: await allSessions(), sid: S.sessionId, ex: Array.from(S.excluded)};
    await applyBackup(d);
    loading(false); render();
    pushUndo('Đã khôi phục backup', async () => {
      await applyBackup({products:before.p, sessions:before.s, sessionId:before.sid, excluded:before.ex});
    });
    await pushNow();
  }catch(e){ loading(false); toast('Lỗi khôi phục: ' + e.message, 'err'); }
}
async function applyBackup(d){
  const tx = db.transaction(['products','sessions'], 'readwrite');
  tx.objectStore('products').clear();
  tx.objectStore('sessions').clear();
  (d.products||[]).forEach(p => { if(p && p.key) tx.objectStore('products').put(p); });
  (d.sessions||[]).forEach(s => { if(s && s.id) tx.objectStore('sessions').put(s); });
  await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  if(Array.isArray(d.history)){
    const h = db.transaction('history','readwrite');
    h.objectStore('history').clear();
    d.history.forEach(x => { if(x){ const c = Object.assign({}, x); delete c.id; h.objectStore('history').add(c); } });
    await new Promise(res => { h.oncomplete = res; h.onerror = res; });
  }
  if(d.shopName){ S.shopName = d.shopName; await setMeta('shopName', d.shopName); }
  if(d.shopCode){ S.shopCode = d.shopCode; await setMeta('shopCode', d.shopCode); }
  if(d.checker){ S.checker = d.checker; await setMeta('checker', d.checker); }
  if(Array.isArray(d.excluded)){ S.excluded = new Set(d.excluded); await setMeta('excluded', d.excluded); }
  if(d.assign && typeof d.assign === 'object'){ S.assign = d.assign; await setMeta('assign', d.assign); }
  if(d.sessionId){ S.sessionId = d.sessionId; await setMeta('sessionId', d.sessionId); }
  if(d.shift && typeof d.shift === 'object'){ SH = Object.assign(SH, d.shift); await shSaveNow(); }
  await ensureSession();
  await reloadProducts();
  await loadHistory();
}

/* ==========================================================================
   PHÂN CÔNG NGÀNH HÀNG
   Cửa hàng chia việc theo nhóm hàng (mỗi người ôm một hoặc vài nhóm). Import vẫn
   do quản trị làm một lần trên file gộp — nhân viên tự import từng file riêng sẽ
   đè lên nhau vì import là thao tác thay thế toàn bộ danh sách.

/* Danh sách nhóm được giao cho một người. Lưu trong meta để đồng bộ theo Cloud. */
function assignMap(){ return S.assign || {}; }
function groupsOf(name){
  const a = assignMap();
  const k = normName(name);
  if(Array.isArray(a[k])) return a[k];
  // Bản ghi cũ có thể lưu theo tên gốc chưa chuẩn hoá ("PHÚC" thay vì "phúc") —
  // dò lại không phân biệt hoa thường để người đó không bị mất phần việc.
  const hit = Object.keys(a).find(x => normName(x) === k);
  return hit && Array.isArray(a[hit]) ? a[hit] : [];
}
function myGroups(){ return S.me ? groupsOf(S.checker || S.me.u) : []; }
/* Ai chưa được giao nhóm nào thì xem toàn bộ, tránh việc mở app ra thấy trống trơn */
function hasAssignment(){ return myGroups().length > 0; }

async function setAssign(name, groups){
  const a = Object.assign({}, assignMap());
  const k = normName(name);
  if(groups && groups.length) a[k] = groups.slice();
  else delete a[k];
  S.assign = a;
  await setMeta('assign', a);
  pushSoon();
}
function toggleOnlyMine(){
  S.onlyMine = !S.onlyMine;
  S.page = 0;
  render();
}

/* Danh sách nhóm hiện có, kèm số SP và tiến độ */
function groupStats(){
  const m = {};
  S.products.forEach(p => {
    const g = p.group || 'Khác';
    if(!m[g]) m[g] = {n:g, total:0, done:0};
    m[g].total++;
    if(p.tonTT != null) m[g].done++;
  });
  return Object.values(m).sort((a,b) => b.total - a.total);
}
const allGroupNames = () => groupStats().map(g => g.n);

    const done = mine.reduce((s,g) => { const x = gs.find(y => y.n===g); return s + (x?x.done:0); }, 0);

        '<div class="m">' + (mine.length ? mine.length + ' nhóm · ' + cnt + ' SP · đã kiểm ' + done + ' (' + pct + '%)'

      }).join('') + '</div>' : '') +
      (mine.length ? '<div class="prog" style="margin-top:7px"><i style="width:' + pct + '%"></i></div>' : '') +
    '</div>';
  }).join('') + '</div>' +

  '<div class="sec-title">' + svg('i-folder') + 'Toàn bộ nhóm hàng</div>' +
  '<div class="card listcard">' + gs.map(g => {
    const who = taken[g.n] || [];
    const pct = g.total ? Math.round(g.done/g.total*100) : 0;
    return '<div class="lrow" style="cursor:default">' +
      '<span class="lmain"><span class="t" style="display:block">' + esc(g.n) + '</span>' +
      '<span class="s" style="display:block">' + g.total + ' SP · đã kiểm ' + g.done + ' (' + pct + '%) · ' +
      (who.length ? '<b style="color:var(--ok)">' + who.map(esc).join(', ') + '</b>'

  );

function assignPick(name){
  const gs = groupStats();
  const cur = groupsOf(name);
  const b = modal('<div class="modal-h">' +
    '<span class="av" style="background:' + avColor(name) + '">' + esc((name.trim()[0]||'?').toUpperCase()) + '</span>' +
    '<div><h3>Giao việc cho ' + esc(name) + '</h3><p>Chọn nhóm hàng người này phụ trách</p></div></div>' +
    '<div class="qp" id="agList">' + gs.map(g => {
      const on = cur.indexOf(g.n) >= 0;
      // Cho biết nhóm đã có người khác nhận để không giao chồng chéo
      const others = S.users.map(u => u.name||u.u)
        .filter(n => normName(n) !== normName(name) && groupsOf(n).indexOf(g.n) >= 0);
      return '<button class="qpi' + (on?' on':'') + '" data-g="' + esc(g.n) + '">' +
        '<span class="qpn">' + esc(g.n) + '</span>' +
        '<span class="qph">' + g.total + ' SP · đã kiểm ' + g.done + '</span>' +
        '<span class="qpc">' + (others.length ? 'đang giao: ' + others.map(esc).join(', ') : 'chưa ai nhận') + '</span>' +
        '<span class="qpk">' + (on ? '✓' : '+') + '</span></button>';
    }).join('') + '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn sec" id="agNone">Bỏ hết</button>' +
      '<button class="btn" id="agOk">Lưu</button>' +
    '</div>', {sticky:true});
  const sel = new Set(cur);
  const paint = () => b.querySelectorAll('.qpi').forEach(el => {
    const on = sel.has(el.dataset.g);
    el.classList.toggle('on', on);
    el.querySelector('.qpk').textContent = on ? '✓' : '+';
  });
  b.querySelectorAll('.qpi').forEach(el => el.onclick = () => {
    const g = el.dataset.g;
    if(sel.has(g)) sel.delete(g); else sel.add(g);
    paint();
  });
  b.querySelector('#agNone').onclick = () => { sel.clear(); paint(); };
  b.querySelector('#agOk').onclick = async () => {
    await setAssign(name, Array.from(sel));
    closeModal(); render();
    toast(sel.size ? 'Đã giao ' + sel.size + ' nhóm cho ' + name : 'Đã bỏ phân công cho ' + name, 'ok');
  };
}

function grpMenu(g){

async function applyGroupChange(keys, newGroup){
  const list = S.products.filter(p => keys.indexOf(p.key) >= 0);
  const snap = list.map(p => ({key:p.key, group:p.group}));
  const t = now();
  list.forEach(p => { p.group = newGroup; p.mtime = t; });
  await bulkPut('products', list);
  await reloadProducts();
  render(); pushSoon();
  return snap;
}
async function grpRename(g){
  const v = await promptBox('Đổi tên nhóm', 'Tên mới', g);
  if(v == null) return;
  const nv = String(v).trim();
  if(!nv || nv === g) return;
  const keys = S.products.filter(p => (p.group||'Khác') === g).map(p => p.key);
  const snap = await applyGroupChange(keys, nv);
  // Giữ phân công theo tên nhóm — đổi tên mà không cập nhật thì người phụ trách mất việc
  const a = Object.assign({}, assignMap());
  let changed = false;
  Object.keys(a).forEach(k => {
    const i = a[k].indexOf(g);
    if(i >= 0){ a[k][i] = nv; changed = true; }
  });
  if(changed){ S.assign = a; await setMeta('assign', a); }
  toast('Đã đổi tên · ' + keys.length + ' SP', 'ok');
  pushUndo('Đã đổi tên nhóm', async () => {
    const back = S.products.filter(p => snap.some(s => s.key===p.key));
    back.forEach(p => { const s = snap.find(x => x.key===p.key); if(s) p.group = s.group; p.mtime = now(); });
    await bulkPut('products', back); await reloadProducts(); render();
  });
}
async function grpMerge(g){
  const others = allGroupNames().filter(x => x !== g);
  if(!others.length){ toast('Chưa có nhóm nào khác','warn'); return; }
  const b = modal('<div class="modal-h"><div><h3>Gộp nhóm</h3>' +

        '<span class="qpn">' + esc(x) + '</span><span class="qph">' + n + ' SP</span>' +

      const back = S.products.filter(p => snap.some(s => s.key===p.key));

      await bulkPut('products', back); await reloadProducts(); render();
    });

  {bg:'#ccfbf1', tx:'#115e59', dot:'#0d9488'},
  {bg:'#fee2e2', tx:'#991b1b', dot:'#dc2626'},
  {bg:'#ede9fe', tx:'#5b21b6', dot:'#7c3aed'}
];

/* Màu của CA tách riêng khỏi màu NHÂN VIÊN — trước đây ô ca lấy màu nhân viên nên
   cả hàng chỉ một màu, nhìn không phân biệt được ca nào với ca nào. */
const SHIFT_COLORS = [
  {bg:'#dbeafe', tx:'#1d4ed8', dot:'#2563eb', n:'Xanh dương'},
  {bg:'#ffedd5', tx:'#c2410c', dot:'#ea580c', n:'Cam'},
  {bg:'#dcfce7', tx:'#15803d', dot:'#16a34a', n:'Xanh lá'},
  {bg:'#f3e8ff', tx:'#7e22ce', dot:'#9333ea', n:'Tím'},
  {bg:'#fee2e2', tx:'#b91c1c', dot:'#dc2626', n:'Đỏ'},
  {bg:'#fef9c3', tx:'#a16207', dot:'#ca8a04', n:'Vàng'},
  {bg:'#ccfbf1', tx:'#0f766e', dot:'#14b8a6', n:'Ngọc'},
  {bg:'#fce7f3', tx:'#be185d', dot:'#ec4899', n:'Hồng'},
  {bg:'#e2e8f0', tx:'#334155', dot:'#64748b', n:'Xám'}
];
const isOff = s => !!(s && s.kind === 'off');
const shC = s => SHIFT_COLORS[(s && typeof s.ci==='number' ? s.ci : 0) % SHIFT_COLORS.length];

let SH = {
  storeName:'', maxShifts:6, maxHours:48,
  roles:['Quản lý','Trợ lý quản lý','Nhân viên bán hàng','Kỹ thuật'],
  employees:[], shifts:[], schedule:{}, weekOffset:0,
  alertOpen:false
};
let shLoaded = false, shSaveTimer = null;

async function shLoad(){
  try{ const r = await rq(st('shift').get('state')); if(r && r.v) SH = Object.assign(SH, r.v); }catch(e){}
  if(!SH.roles || !SH.roles.length) SH.roles = ['Quản lý','Trợ lý quản lý','Nhân viên bán hàng','Kỹ thuật'];
  if(!SH.employees) SH.employees = [];
  if(!SH.shifts || !SH.shifts.length) SH.shifts = [
    {id:'s1', name:'Ca sáng', start:'08:00', end:'14:00', min:2, ci:0},
    {id:'s2', name:'Ca chiều', start:'14:00', end:'21:30', min:2, ci:1}
  ];
  if(!SH.schedule) SH.schedule = {};
  if(!SH.storeName) SH.storeName = S.shopName || 'Cửa hàng';
  migrateWeekKeys();
  SH.employees.forEach((e,i) => { if(typeof e.ci !== 'number') e.ci = i % EMP_COLORS.length; });
  SH.shifts.forEach((s,i) => {
    if(typeof s.ci !== 'number') s.ci = i % SHIFT_COLORS.length;
    // Ca tạo từ bản trước chưa có "loại" — đoán theo tên để OFF/Nghỉ không còn dính giờ
    if(!s.kind) s.kind = /^(off|nghỉ|nghi|ngày nghỉ|day ?off)$/i.test(String(s.name||'').trim()) ? 'off' : 'work';
    if(s.kind === 'off'){ s.min = 0; s.start = ''; s.end = ''; }
  });
  shLoaded = true;
}
function shSaveNow(){ return rq(st('shift','readwrite').put({k:'state', v:JSON.parse(JSON.stringify(SH))})); }
function shSave(){ clearTimeout(shSaveTimer); shSaveTimer = setTimeout(() => shSaveNow().catch(()=>{}), 300); }

/* Khoá tuần = ngày thứ Hai (YYYY-MM-DD). Bản cũ tính số tuần ISO thủ công nên
   tuần vắt qua năm mới có thể sinh hai khoá khác nhau, làm lịch "biến mất". */
function mondayOf(off){
  const d = new Date(); d.setHours(12,0,0,0);
  d.setDate(d.getDate() + (off||0)*7);
  const dow = d.getDay() || 7;
  d.setDate(d.getDate() - dow + 1);
  return d;
}
const pad2 = n => String(n).padStart(2,'0');
function weekKey(off){ const d = mondayOf(off); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function weekDates(off){ const m = mondayOf(off); const o=[];
  for(let i=0;i<7;i++){ const x=new Date(m); x.setDate(m.getDate()+i); o.push(x); } return o; }
function migrateWeekKeys(){
  Object.keys(SH.schedule||{}).filter(k => /^\d{4}-W\d{1,2}$/.test(k)).forEach(k => {
    const m = k.match(/^(\d{4})-W(\d{1,2})$/), year=+m[1], wk=+m[2];
    const jan4 = new Date(year,0,4,12), dow = jan4.getDay()||7;
    const mon1 = new Date(jan4); mon1.setDate(jan4.getDate()-dow+1);
    const t = new Date(mon1); t.setDate(mon1.getDate()+(wk-1)*7);
    const nk = t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());
    if(!SH.schedule[nk]) SH.schedule[nk] = SH.schedule[k];
    delete SH.schedule[k];
  });
}
const dmy = d => pad2(d.getDate())+'/'+pad2(d.getMonth()+1);
const isTodayD = d => { const t=new Date();
  return d.getDate()===t.getDate() && d.getMonth()===t.getMonth() && d.getFullYear()===t.getFullYear(); };

function shiftHours(sh){
  if(!sh || sh.kind === 'off') return 0;   // ca nghỉ không tính vào giờ làm
  if(!sh.start || !sh.end) return 4;
  const [a,b]=sh.start.split(':').map(Number), [x,y]=sh.end.split(':').map(Number);
  let h=(x+y/60)-(a+b/60); if(h<0) h+=24;
  return Math.round(h*10)/10;
}
const shUid = () => 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function weekData(off){
  const k = weekKey(off==null ? SH.weekOffset : off);
  if(!SH.schedule[k]) SH.schedule[k] = {};
  return SH.schedule[k];
}
function dayMap(day){ const w=weekData(); if(!w[String(day)]) w[String(day)]={}; return w[String(day)]; }
const empById = id => SH.employees.find(e => e.id===id);
const empC = e => EMP_COLORS[(e && typeof e.ci==='number' ? e.ci : 0) % EMP_COLORS.length];
const activeEmps = () => SH.employees.filter(e => e.status !== 'off');
/* Các ca của 1 người trong 1 ngày */
function empShiftsOn(empId, day){
  const dd = dayMap(day);
  return SH.shifts.filter(sh => (dd[sh.id]||[]).indexOf(empId) >= 0);
}
function toggleAssign(empId, day, sid){
  const dd = dayMap(day);
  if(!dd[sid]) dd[sid] = [];
  const i = dd[sid].indexOf(empId);
  if(i >= 0) dd[sid].splice(i,1); else dd[sid].push(empId);
  shSave();
}

/* ---- Chức vụ: chuẩn hoá để không sinh bản trùng ---- */
function normRole(s){ return String(s||'').trim().replace(/\s+/g,' '); }
function roleKey(s){ return normRole(s).toLowerCase(); }
function findRole(s){ const k=roleKey(s); return (SH.roles||[]).find(r => roleKey(r)===k) || null; }
function addRole(s){
  const n = normRole(s); if(!n) return null;
  const e = findRole(n); if(e) return e;
  SH.roles.push(n); shSave(); return n;
}
function roleCount(r){ const k=roleKey(r); return SH.employees.filter(e => roleKey(e.role)===k).length; }
function roleColor(r){
  const k = roleKey(r); if(!k) return '#94a3b8';
  let h=0; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))>>>0;
  return EMP_COLORS[h % EMP_COLORS.length].dot;
}

/* ---------- Trang Lịch ca ----------
   Toàn bộ phần lịch nằm trong #shBox. Mọi thao tác xếp ca chỉ vẽ lại #shBox
   (hoặc chỉ một ô), KHÔNG gọi render() dựng lại cả trang — đây là nguyên nhân
   gây giật khi bấm liên tục ở bản trước. */
function vShift(){
  if(!isAdmin()) return '<div class="card pad"><b style="color:var(--under)">Không có quyền</b>' +
    '<div class="tagline" style="margin-top:6px">Chỉ quản trị viên mới sắp lịch ca.</div></div>';
  if(!shLoaded) return '<div class="card pad"><div class="tagline">Đang tải...</div></div>';
  return (
    '<div class="page-h"><div><h1>Lịch phân ca</h1><p>' + esc(SH.storeName) + ' · tự lưu</p></div>' +
    '<div style="display:flex;gap:6px">' +
      '<button class="btn sm sec" onclick="shExportPNG()">' + svg('i-download') + 'Ảnh</button>' +
      '<button class="btn sm sec" onclick="shCopyText()">' + svg('i-list') + 'Copy</button>' +
      '<button class="btn sm sec" onclick="shSetupMenu()">' + svg('i-edit') + '</button>' +
    '</div></div>' +
    '<div id="shBox">' + shBoxHTML() + '</div>'
  );
}
function shRepaint(){
  const b = $('shBox');
  if(b) b.innerHTML = shBoxHTML();
  else render();
}
/* Ca đang được chọn làm "cọ". Chạm ô là gán/bỏ ngay ca này — một chạm cho mỗi ô,
   không phải mở bảng chọn rồi bấm Xong như trước. */
let brushSid = null;
function shBoxHTML(){
  const dates = weekDates(SH.weekOffset);
  if(brushSid && !SH.shifts.some(s => s.id === brushSid)) brushSid = null;
  if(brushSid === null && SH.shifts.length) brushSid = SH.shifts[0].id;
  return shWeekBar(dates) + shBrushBar() + shAlerts() + shGrid(dates);
}

function shBrushBar(){
  if(!SH.shifts.length) return '';
  return '<div class="brushbar">' +
    '<span class="bl">Chạm ô để xếp:</span>' +
    '<div class="bchips">' +
      SH.shifts.map(s => {
        const c = shC(s), on = brushSid === s.id;
        return '<button class="bch' + (on?' on':'') + '" onclick="shSetBrush(\'' + s.id + '\')" ' +
          'style="background:' + (on ? c.dot : c.bg) + ';color:' + (on ? '#fff' : c.tx) +
          ';border-color:' + (on ? c.dot : 'transparent') + '">' +
          esc(shortShift(s.name)) + '<i>' + (isOff(s) ? 'nghỉ' : esc(s.start)) + '</i></button>';
      }).join('') +
      '<button class="bch' + (brushSid==='__ask' ? ' on' : '') + '" onclick="shSetBrush(\'__ask\')" ' +
        'style="background:' + (brushSid==='__ask' ? 'var(--dark)' : 'var(--line-2)') +
        ';color:' + (brushSid==='__ask' ? '#fff' : 'var(--ink-2)') + ';border-color:transparent">Chọn…<i>nhiều ca</i></button>' +
    '</div></div>';
}
function shSetBrush(sid){
  brushSid = sid;
  document.querySelectorAll('.brushbar .bch').forEach(b => b.classList.remove('on'));
  const bar = document.querySelector('.brushbar');
  if(bar) bar.outerHTML = shBrushBar();
}

/* Thanh chọn tuần đặt ngay sát bảng cho dễ với tay */
function shWeekBar(dates){
  const lb = SH.weekOffset === 0 ? 'Tuần này' : SH.weekOffset === -1 ? 'Tuần trước'
    : SH.weekOffset === 1 ? 'Tuần sau' : (SH.weekOffset>0?'+':'') + SH.weekOffset + ' tuần';
  return '<div class="wkbar">' +
    '<button class="wkb" onclick="shWeek(-1)">‹</button>' +
    '<div class="wkl"><b>' + lb + '</b><span>' + dmy(dates[0]) + ' – ' + dmy(dates[6]) + '</span></div>' +
    '<button class="wkb" onclick="shWeek(1)">›</button>' +
    (SH.weekOffset !== 0 ? '<button class="wkt" onclick="shToday()">Hôm nay</button>' : '') +
    '<button class="wkt" onclick="shCopyLastWeek()" title="Chép lịch tuần trước">Chép tuần trước</button>' +
  '</div>';
}

/* Cảnh báo mặc định thu gọn — chỉ hiện một dòng tóm tắt, bấm mới mở ra */
function shAlerts(){
  const list = shAlertList();
  if(!list.length) return '';
  const err = list.filter(a => a.t==='err').length;
  return '<div class="alertbox' + (SH.alertOpen ? ' open' : '') + '">' +
    '<button class="alerttop" onclick="shToggleAlert()">' + svg('i-alert') +
      '<b>' + list.length + ' cảnh báo</b>' +
      (err ? '<span class="pill under">' + err + ' thiếu người</span>' : '') +
      '<span class="ac">' + (SH.alertOpen ? 'Thu gọn' : 'Xem') + '</span></button>' +
    (SH.alertOpen ? '<div class="alertbody">' +
      list.slice(0,20).map(a => '<div class="alertrow ' + a.t + '">' + esc(a.m) + '</div>').join('') +
      (list.length>20 ? '<div class="alertrow">… và ' + (list.length-20) + ' cảnh báo khác</div>' : '') +
    '</div>' : '') +
  '</div>';
}
function shToggleAlert(){ SH.alertOpen = !SH.alertOpen; shSave(); shRepaint(); }
function shAlertList(){
  const w = weekData();
  const cnt = {}, hrs = {};
  SH.employees.forEach(e => { cnt[e.id]=0; hrs[e.id]=0; });
  let assigned = 0;
  for(let d=0;d<7;d++){
    const dd = w[String(d)] || {};
    SH.shifts.forEach(sh => (dd[sh.id]||[]).forEach(id => {
      assigned++;
      // Ngày nghỉ không phải một ca làm — không cộng vào số ca lẫn số giờ
      if(!isOff(sh)){ cnt[id]=(cnt[id]||0)+1; hrs[id]=(hrs[id]||0)+shiftHours(sh); }
    }));
  }
  // Tuần chưa xếp gì thì báo "thiếu người" ở cả 14 ô là vô nghĩa — chỉ nhắc một dòng
  if(!assigned) return [{t:'info', m:'Tuần này chưa xếp ca nào — chạm vào ô trong bảng để thêm người'}];

  const list = [];
  for(let d=0;d<7;d++){
    const dd = w[String(d)] || {};
    SH.shifts.forEach(sh => {
      if(isOff(sh)) return;
      const arr = dd[sh.id] || [];
      if(sh.min>0 && arr.length < sh.min)
        list.push({t:'err', m: DAYS_SHORT[d] + ' · ' + sh.name + ': cần ' + sh.min + ', có ' + arr.length});
    });
    // Vừa xếp ca làm vừa đánh dấu nghỉ trong cùng ngày là mâu thuẫn, cần báo riêng
    const workOf = {}, offOf = {};
    SH.shifts.forEach(sh => (dd[sh.id]||[]).forEach(id => {
      if(isOff(sh)) offOf[id] = 1; else workOf[id] = (workOf[id]||0) + 1;
    }));
    Object.keys(offOf).forEach(id => {
      if(workOf[id]){ const e=empById(id);
        list.push({t:'warn', m: DAYS_SHORT[d]+': '+(e?e.name:id)+' vừa OFF vừa có ca làm'}); }
    });
    Object.keys(workOf).forEach(id => {
      if(workOf[id] > 1){ const e=empById(id);
        list.push({t:'warn', m: DAYS_SHORT[d]+': '+(e?e.name:id)+' xếp '+workOf[id]+' ca cùng ngày'}); }
    });
  }
  activeEmps().forEach(e => {
    if(SH.maxShifts>0 && cnt[e.id]>SH.maxShifts) list.push({t:'warn', m:e.name+': '+cnt[e.id]+' ca (giới hạn '+SH.maxShifts+')'});
    if(SH.maxHours>0 && hrs[e.id]>SH.maxHours) list.push({t:'warn', m:e.name+': '+Math.round(hrs[e.id])+'h (giới hạn '+SH.maxHours+'h)'});
    if(!cnt[e.id]) list.push({t:'info', m:e.name+': chưa có ca nào tuần này'});
  });
  return list;
}

/* Bảng chính: hàng = nhân viên, cột = ngày. Chạm ô để bật/tắt ca ngay tại chỗ. */
function shGrid(dates){
  const emps = activeEmps();
  if(!emps.length) return '<div class="card"><div class="empty">' + svg('i-users','ic') +
    '<div class="t">Chưa có nhân viên</div><div class="s">Thêm ở nút ⚙ góc trên</div>' +
    '<button class="btn sm" style="margin-top:10px" onclick="shEmpModal()">' + svg('i-plus') + 'Thêm nhân viên</button></div></div>';
  if(!SH.shifts.length) return '<div class="card"><div class="empty">' + svg('i-clock','ic') +
    '<div class="t">Chưa có ca làm việc</div>' +
    '<button class="btn sm" style="margin-top:10px" onclick="shShiftModal()">' + svg('i-plus') + 'Thêm ca</button></div></div>';

  let h = '<div class="card shwrap" onpointerdown="shGridPointerDown(event)" onpointermove="shGridMove(event)" ' +
    'ontouchmove="shGridMove(event)" onpointerup="shGridUp()" onpointercancel="shGridUp()" ontouchend="shGridUp()">' +
    '<table class="shtab"><thead><tr><th class="cnr">Nhân viên</th>' +
    dates.map((d,i) => '<th' + (isTodayD(d)?' class="td"':'') + '>' + DAYS_SHORT[i] +
      '<span>' + dmy(d) + '</span></th>').join('') + '</tr></thead><tbody>';

  emps.forEach(e => {
    const c = empC(e);
    let total = 0, row = '';
    for(let d=0; d<7; d++){
      const mine = empShiftsOn(e.id, d);
      total += mine.filter(x => !isOff(x)).length;
      row += '<td class="cell" id="c_' + e.id + '_' + d + '" data-e="' + e.id + '" data-d="' + d +
        '" onclick="shCell(\'' + e.id + '\',' + d + ')">' + shCellHTML(e, mine) + '</td>';
    }
    h += '<tr><th class="rowh" style="background:' + c.bg + '" onclick="shEditEmp(\'' + e.id + '\')">' +
      '<b style="color:' + c.tx + '">' + esc(e.name) + '</b>' +
      '<span style="color:' + c.tx + ';opacity:.75">' + esc(e.role||'—') + ' · ' + total + ' ca</span></th>' + row + '</tr>';
  });
  return h + '</tbody></table></div>' +
    '<div class="tagline" style="text-align:center;margin-top:8px">' +
    'Chạm ô để xếp · <b>giữ &amp; kéo</b> qua nhiều ô để xếp hàng loạt · chạm tên để sửa nhân viên</div>';
}
function shCellHTML(e, mine){
  if(!mine.length) return '<span class="offtxt">+</span>';
  // Màu lấy theo CA — mỗi ca một màu nên nhìn bảng là thấy ngay ai vào ca nào
  return mine.map(sh => { const c = shC(sh);
    return '<span class="shpill" style="background:' + c.bg + ';color:' + c.tx + '">' +
      esc(shortShift(sh.name)) + (isOff(sh) ? '' : '<i>' + esc(sh.start) + '</i>') + '</span>'; }).join('');
}
function shortShift(n){ return String(n||'').replace(/^ca\s*/i,'').trim() || n; }

/* Chạm ô: nếu đang chọn một ca làm cọ thì gán/bỏ ngay; chọn "Chọn…" thì mở bảng nhiều ca */
function shCell(empId, day){
  const e = empById(empId); if(!e) return;
  if(brushSid && brushSid !== '__ask'){
    toggleAssign(empId, day, brushSid);
    shPaintCell(empId, day);
    return;
  }
  shQuickPick(empId, day);
}
/* Kéo ngón tay / chuột qua nhiều ô để xếp hàng loạt cho cả tuần */
let painting = false, paintOn = null, paintSeen = {};
function shGridPointerDown(ev){
  if(!brushSid || brushSid === '__ask') return;
  const td = ev.target.closest ? ev.target.closest('td.cell') : null;
  if(!td || !td.dataset.e) return;
  painting = true; paintSeen = {};
  const has = empShiftsOn(td.dataset.e, +td.dataset.d).some(s => s.id === brushSid);
  paintOn = !has;                       // kéo tiếp thì làm cùng một hành động
  shPaintAt(td);
}
function shPaintAt(td){
  const id = td.dataset.e, d = +td.dataset.d, k = id + '_' + d;
  if(paintSeen[k]) return;
  paintSeen[k] = 1;
  const has = empShiftsOn(id, d).some(s => s.id === brushSid);
  if(has !== paintOn){ toggleAssign(id, d, brushSid); shPaintCell(id, d); }
}
function shGridMove(ev){
  if(!painting) return;
  const t = ev.touches && ev.touches[0];
  const el = t ? document.elementFromPoint(t.clientX, t.clientY) : ev.target;
  const td = el && el.closest ? el.closest('td.cell') : null;
  if(td && td.dataset.e){ if(t) ev.preventDefault(); shPaintAt(td); }
}
function shGridUp(){ painting = false; paintSeen = {}; }
/* Chỉ vẽ lại đúng 1 ô + số ca của hàng đó — nhanh hơn nhiều so với dựng lại bảng */
function shPaintCell(empId, day){
  const e = empById(empId); if(!e) return;
  const td = $('c_' + empId + '_' + day);
  if(td) td.innerHTML = shCellHTML(e, empShiftsOn(empId, day));
  let total = 0;
  for(let d=0; d<7; d++) total += empShiftsOn(empId, d).filter(x => !isOff(x)).length;
  const th = td && td.parentNode ? td.parentNode.querySelector('.rowh span') : null;
  if(th) th.textContent = (e.role||'—') + ' · ' + total + ' ca';
  shMarkAlertsDirty();
}
let alertTimer = null;
function shMarkAlertsDirty(){
  clearTimeout(alertTimer);
  alertTimer = setTimeout(() => {
    const box = document.querySelector('#shBox .alertbox');
    const html = shAlerts();
    if(box){ if(html) box.outerHTML = html; else box.remove(); }
    else if(html){ const wb = document.querySelector('#shBox .wkbar'); if(wb) wb.insertAdjacentHTML('afterend', html); }
  }, 260);
}

/* Bảng chọn ca nhanh — thay cho việc mở modal danh sách dài như bản trước */
function shQuickPick(empId, day){
  const e = empById(empId); if(!e) return;
  const dates = weekDates(SH.weekOffset);
  const c = empC(e);
  const b = modal('<div class="modal-h">' +
    '<div class="av" style="background:' + c.dot + ';width:38px;height:38px;font-size:15px">' +
      esc((e.name.trim()[0]||'?').toUpperCase()) + '</div>' +
    '<div><h3>' + esc(e.name) + '</h3><p>' + DAYS_VN[day] + ' · ' + dmy(dates[day]) + '</p></div></div>' +
    '<div class="qp" id="qpList">' + SH.shifts.map(sh => {
      const on = (dayMap(day)[sh.id]||[]).indexOf(empId) >= 0;
      const cur = (dayMap(day)[sh.id]||[]).length;
      const lack = !isOff(sh) && sh.min>0 && cur < sh.min;
      return '<button class="qpi' + (on?' on':'') + '" data-s="' + sh.id + '">' +
        '<span class="qpn">' + esc(sh.name) + '</span>' +
        '<span class="qph">' + (isOff(sh) ? 'Ngày nghỉ · không tính giờ'
          : esc(sh.start) + '–' + esc(sh.end) + ' · ' + shiftHours(sh) + 'h') + '</span>' +
        '<span class="qpc' + (lack?' lack':'') + '">' + (isOff(sh) ? cur + ' người nghỉ'
          : cur + '/' + (sh.min||'–') + ' người') + '</span>' +
        '<span class="qpk">' + (on ? '✓' : '+') + '</span></button>';
    }).join('') + '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn sec" id="qpOff">Nghỉ cả ngày</button>' +
      '<button class="btn" onclick="closeModal()">Xong</button>' +
    '</div>');

  const refresh = () => {
    b.querySelectorAll('.qpi').forEach(btn => {
      const sid = btn.dataset.s;
      const arr = dayMap(day)[sid] || [];
      const on = arr.indexOf(empId) >= 0;
      const sh = SH.shifts.find(x => x.id===sid);
      btn.classList.toggle('on', on);
      btn.querySelector('.qpk').textContent = on ? '✓' : '+';
      const cc = btn.querySelector('.qpc');
      cc.textContent = isOff(sh) ? arr.length + ' người nghỉ' : arr.length + '/' + (sh.min||'–') + ' người';
      cc.classList.toggle('lack', !isOff(sh) && sh.min>0 && arr.length < sh.min);
    });
  };
  b.querySelectorAll('.qpi').forEach(btn => btn.onclick = () => {
    toggleAssign(empId, day, btn.dataset.s);
    refresh(); shPaintCell(empId, day);
  });
  b.querySelector('#qpOff').onclick = () => {
    SH.shifts.forEach(sh => {
      const arr = dayMap(day)[sh.id];
      if(arr){ const i = arr.indexOf(empId); if(i>=0) arr.splice(i,1); }
    });
    shSave(); refresh(); shPaintCell(empId, day);
  };
}

function shWeek(d){ SH.weekOffset += d; shRepaint(); }
function shToday(){ SH.weekOffset = 0; shRepaint(); }
function shCopyLastWeek(){
  const prev = SH.schedule[weekKey(SH.weekOffset-1)];
  if(!prev || !Object.keys(prev).length){ toast('Tuần trước chưa có lịch','warn'); return; }
  const k = weekKey(SH.weekOffset);
  const snap = JSON.parse(JSON.stringify(SH.schedule[k]||{}));
  SH.schedule[k] = JSON.parse(JSON.stringify(prev));
  shSave(); shRepaint();
  pushUndo('Đã chép lịch tuần trước', async () => { SH.schedule[k]=snap; await shSaveNow(); shRepaint(); });
}
async function shClearWeek(){
  const ok = await confirmBox('Xoá lịch tuần này?','Toàn bộ phân ca của tuần đang xem sẽ bị xoá.','Xoá', true);
  if(!ok) return;
  const k = weekKey(SH.weekOffset);
  const snap = JSON.parse(JSON.stringify(SH.schedule[k]||{}));
  SH.schedule[k] = {};
  shSave(); shRepaint();
  pushUndo('Đã xoá lịch tuần', async () => { SH.schedule[k]=snap; await shSaveNow(); shRepaint(); });
}

async function shDelEmp(id){

  const snapE = Object.assign({}, e), snapS = JSON.parse(JSON.stringify(SH.schedule));
  SH.employees = SH.employees.filter(x => x.id!==id);
  Object.keys(SH.schedule).forEach(wk => Object.keys(SH.schedule[wk]).forEach(d =>

      SH.schedule[wk][d][sid] = SH.schedule[wk][d][sid].filter(x => x!==id); })));

function shImportUsers(){
  let n = 0;
  S.users.forEach(u => {
    const nm = u.name || u.u;
    if(SH.employees.some(e => e.name.trim().toLowerCase()===nm.trim().toLowerCase())) return;
    SH.employees.push({id:shUid(), name:nm, role:(u.role==='admin'?'Quản lý':''), code:'',
      status:'active', ci:SH.employees.length % EMP_COLORS.length});
    n++;
  });
  if(!n){ toast('Tất cả tài khoản đã có','info'); return; }
  shSave(); shEmpModal(); toast('Đã thêm ' + n + ' người','ok');
}

    '<div class="row" style="margin-bottom:10px"><input class="input" id="rNew" placeholder="Tên chức vụ mới">' +
    '<button class="btn" style="flex:0 0 auto;padding:0 18px" id="rAdd">Thêm</button></div>' +
    (rows ? '<div class="card listcard">' + rows + '</div>' : '<div class="card"><div class="empty"><div class="s">Chưa có chức vụ</div></div></div>') +
    '<div class="modal-actions"><button class="btn sec" onclick="closeModal();shRepaint()">Đóng</button></div>', {sticky:true});
  b.querySelector('#rAdd').onclick = () => {
    const v = b.querySelector('#rNew').value;
    if(!normRole(v)){ toast('Nhập tên chức vụ','warn'); return; }
    if(findRole(v)){ toast('Chức vụ này đã có','warn'); return; }
    addRole(v); shRoleModal(); toast('Đã thêm','ok');
  };
  b.querySelector('#rNew').onkeydown = e => { if(e.key==='Enter') b.querySelector('#rAdd').click(); };
}
async function shRenameRole(old){
  const v = await promptBox('Đổi tên chức vụ','Tên mới', old);
  if(v == null) return;
  const nv = normRole(v);
  if(!nv || roleKey(nv)===roleKey(old)) return;
  const dup = findRole(nv);
  if(dup){
    const ok = await confirmBox('Gộp chức vụ?','Đã có <b>' + esc(dup) + '</b>. Gộp <b>' + esc(old) + '</b> vào đó?','Gộp');
    if(!ok) return;
  }
  const target = dup || nv;
  SH.employees.forEach(e => { if(roleKey(e.role)===roleKey(old)) e.role = target; });
  SH.roles = (SH.roles||[]).filter(r => roleKey(r)!==roleKey(old));
  if(!findRole(target)) SH.roles.push(target);
  shSave(); shRoleModal(); toast(dup?'Đã gộp':'Đã đổi tên','ok');
}
async function shDelRole(r){
  const n = roleCount(r);
  const ok = await confirmBox('Xoá chức vụ?', n
    ? '<b>' + n + ' nhân viên</b> đang giữ <b>' + esc(r) + '</b>. Xoá thì họ thành "chưa đặt chức vụ".'
    : 'Xoá <b>' + esc(r) + '</b> khỏi danh sách?', 'Xoá', true);
  if(!ok) return;
  const snapR = (SH.roles||[]).slice();
  const snapE = SH.employees.map(e => ({id:e.id, role:e.role}));
  SH.employees.forEach(e => { if(roleKey(e.role)===roleKey(r)) e.role=''; });
  SH.roles = (SH.roles||[]).filter(x => roleKey(x)!==roleKey(r));
  shSave(); shRoleModal();
  pushUndo('Đã xoá chức vụ ' + r, async () => {
    SH.roles = snapR;
    snapE.forEach(s => { const e = empById(s.id); if(e) e.role = s.role; });
    await shSaveNow(); shRepaint();
  });
}

    SH.storeName = b.querySelector('#cName').value.trim() || 'Cửa hàng';
    SH.maxShifts = Math.max(0, parseInt(b.querySelector('#cShifts').value)||0);
    SH.maxHours = Math.max(0, parseInt(b.querySelector('#cHours').value)||0);
    shSave(); closeModal(); render(); toast('Đã lưu','ok');
  };
}

/* ---------- Chia sẻ ---------- */
function shCopyText(){
  const dates = weekDates(SH.weekOffset);
  let t = '📅 LỊCH CA · ' + SH.storeName.toUpperCase() + '\n' + dmy(dates[0]) + ' – ' + dmy(dates[6]) + '/' + dates[6].getFullYear() + '\n';
  for(let d=0; d<7; d++){
    const dd = weekData()[String(d)] || {};
    const parts = SH.shifts.map(sh => {
      const arr = (dd[sh.id]||[]).map(id => { const e=empById(id); return e?e.name:''; }).filter(Boolean);
      if(!arr.length) return '';
      return isOff(sh) ? '  • ' + sh.name + ': ' + arr.join(', ')
                       : '  • ' + sh.name + ' (' + sh.start + '-' + sh.end + '): ' + arr.join(', ');
    }).filter(Boolean);
    t += '\n' + DAYS_VN[d] + ' ' + dmy(dates[d]) + '\n' + (parts.length ? parts.join('\n') : '  — nghỉ —') + '\n';
  }
  const off = activeEmps().filter(e => { for(let d=0;d<7;d++) if(empShiftsOn(e.id,d).length) return false; return true; });
  void off;
  if(off.length) t += '\nChưa xếp ca: ' + off.map(e=>e.name).join(', ') + '\n';
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(() => toast('Đã copy — dán vào nhóm','ok')).catch(() => shShowText(t));
  else shShowText(t);
}
function shShowText(t){
  modal('<div class="modal-h"><div><h3>Lịch ca dạng chữ</h3><p>Bôi đen rồi copy.</p></div></div>' +
    '<textarea class="input" style="min-height:230px;font-size:12px;font-family:ui-monospace,monospace" readonly>' + esc(t) + '</textarea>' +
    '<div class="modal-actions"><button class="btn sec" onclick="closeModal()">Đóng</button></div>');
}

/* Vẽ bảng ra ảnh PNG để gửi thẳng nhóm chat */
function shExportPNG(){
  try{
    const dates = weekDates(SH.weekOffset);
    const emps = activeEmps();
    if(!emps.length || !SH.shifts.length){ toast('Chưa có dữ liệu để xuất','warn'); return; }
    const sc = 2, colW = 118, rowH = 54, headH = 52, nameW = 150, pad = 16, titleH = 72;
    const W = nameW + colW*7 + pad*2;
    // Không còn dòng chân trang nên bỏ luôn khoảng trống dành cho nó
    const H = titleH + headH + rowH*emps.length + pad*2;
    const cv = document.createElement('canvas');
    cv.width = W*sc; cv.height = H*sc;
    const g = cv.getContext('2d'); g.scale(sc,sc);
    g.fillStyle = '#fff'; g.fillRect(0,0,W,H);
    g.fillStyle = '#231f20'; g.fillRect(0,0,W,titleH-12);
    g.fillStyle = '#d01c2a'; g.fillRect(0,titleH-12,W,4);
    g.fillStyle = '#fff'; g.font = '700 19px Montserrat, Arial, sans-serif';
    g.fillText('LỊCH PHÂN CA · ' + SH.storeName.toUpperCase(), pad, 29);
    g.font = '500 13px Montserrat, Arial, sans-serif'; g.fillStyle = 'rgba(255,255,255,.78)';
    g.fillText(dmy(dates[0]) + ' – ' + dmy(dates[6]) + '/' + dates[6].getFullYear(), pad, 49);

    const top = titleH + 4;
    g.fillStyle = '#231f20'; g.fillRect(pad, top, nameW + colW*7, headH);
    for(let i=0;i<7;i++){
      const x = pad + nameW + colW*i;
      if(isTodayD(dates[i])){ g.fillStyle = '#d01c2a'; g.fillRect(x, top, colW, headH); }
      g.fillStyle = '#fff'; g.font = '700 14px Montserrat, Arial, sans-serif'; g.textAlign = 'center';
      g.fillText(DAYS_SHORT[i], x + colW/2, top + 22);
      g.fillStyle = 'rgba(255,255,255,.7)'; g.font = '500 11.5px Montserrat, Arial, sans-serif';
      g.fillText(dmy(dates[i]), x + colW/2, top + 39);
      g.textAlign = 'left';
    }
    emps.forEach((e, r) => {
      const y = top + headH + rowH*r, c = empC(e);
      g.fillStyle = c.bg; g.fillRect(pad, y, nameW, rowH);
      g.fillStyle = c.tx; g.font = '700 13px Montserrat, Arial, sans-serif';
      let nm = e.name;
      while(g.measureText(nm).width > nameW - 20 && nm.length > 4) nm = nm.slice(0,-2);
      if(nm !== e.name) nm = nm.trim() + '…';
      g.fillText(nm, pad + 10, y + 23);
      g.font = '500 10.5px Montserrat, Arial, sans-serif'; g.globalAlpha = .72;
      g.fillText(e.role || '', pad + 10, y + 39); g.globalAlpha = 1;
      for(let d=0; d<7; d++){
        const x = pad + nameW + colW*d;
        const mine = empShiftsOn(e.id, d);
        if(r % 2){ g.fillStyle = '#fafbfb'; g.fillRect(x, y, colW, rowH); }
        g.textAlign = 'center';
        if(!mine.length){
          g.fillStyle = '#c8ccd0'; g.font = '500 11.5px Montserrat, Arial, sans-serif';
          g.fillText('Nghỉ', x + colW/2, y + rowH/2 + 4);
        }else{
          mine.slice(0,2).forEach((sh,k) => {
            const sc2 = shC(sh);   // ảnh xuất ra cũng dùng màu của ca cho khớp với app
            const by = y + (mine.length>1 ? 16 + k*20 : 24);
            g.fillStyle = sc2.bg; g.fillRect(x+8, by-11, colW-16, 17);
            g.fillStyle = sc2.tx; g.font = '700 11px Montserrat, Arial, sans-serif';
            g.fillText(shortShift(sh.name) + (isOff(sh) ? '' : ' ' + sh.start), x + colW/2, by + 2);
          });
        }
        g.textAlign = 'left';
      }
    });
    g.strokeStyle = '#e6e8ea'; g.lineWidth = 1; g.beginPath();
    for(let i=0;i<=7;i++){ const x = pad+nameW+colW*i; g.moveTo(x, top); g.lineTo(x, top+headH+rowH*emps.length); }
    for(let r=0;r<=emps.length;r++){ const y = top+headH+rowH*r; g.moveTo(pad, y); g.lineTo(pad+nameW+colW*7, y); }
    g.stroke();
    g.strokeRect(pad, top, nameW+colW*7, headH+rowH*emps.length);

    cv.toBlob(blob => {
      if(!blob){ toast('Không tạo được ảnh','err'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'LichCa_' + weekKey(SH.weekOffset) + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      toast('Đã tải ảnh — gửi thẳng vào nhóm','ok');
    }, 'image/png');
  }catch(e){ console.error(e); toast('Lỗi xuất ảnh: ' + e.message,'err'); }
}



/* ---------- PWA / offline ---------- */
function offBar(txt, ok){
  const b = $('offbar');
  b.textContent = txt;
  b.classList.toggle('ok', !!ok);
  b.classList.add('show');
  if(ok) setTimeout(() => b.classList.remove('show'), 2400);
}
function setupPWA(){
  if(!navigator.onLine) offBar('Đang offline — vẫn quét & lưu được, sẽ tự đồng bộ khi có mạng');
  window.addEventListener('offline', () => offBar('Mất mạng — dữ liệu vẫn được lưu trên máy'));
  window.addEventListener('online', () => {
    offBar('Đã có mạng — đang đồng bộ...', true);
    if(syncOn()){ if(dirty) pushNow(); else cloudPull({quiet:true}); }
  });
  document.addEventListener('visibilitychange', () => {
    if(!syncOn()) return;
    if(document.visibilityState === 'visible'){
      if(dirty) cloudPush({quiet:true}); else cloudPull({quiet:true});
    }else if(dirty){ clearTimeout(pushTimer); pushFirstAt = 0; cloudPush({quiet:true}); }
  });
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    navigator.serviceWorker.register('./sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') reg.update().catch(() => {}); });
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if(!w) return;
        w.addEventListener('statechange', () => {
          if(w.state === 'installed' && navigator.serviceWorker.controller){
            const t = document.createElement('div');
            t.className = 'toast info show';
            t.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:210;cursor:pointer';
            t.innerHTML = svg('i-refresh') + '<span>Có bản mới — chạm để tải lại</span>';
            t.onclick = () => location.reload();
            document.body.appendChild(t);
          }
        });
      });
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible'){ try{ reg.update(); }catch(e){} }
      });
    }).catch(() => {});
  }
}

/* ---------- Khởi động ---------- */
let _allP = [];
const _origRender = render;
render = function(){
  if(S.view === 'sessions'){
    renderNav();
    $('shopLabel').innerHTML = 'Phát triển bởi <b>Thinh Dao</b>';
    allProducts().then(a => { $('main').innerHTML = vSessionsSync(a); });
    return;
  }
  _origRender();
};

async function boot(){
  try{
    setupPWA();
    window.addEventListener('load', () => setTimeout(() => prepWasm(), 1500));
    await openDB();
    S.shopCode = (await getMeta('shopCode')) || '';
    S.shopName = (await getMeta('shopName')) || 'Di Động Việt';
    S.checker = (await getMeta('checker')) || '';
    const ex = await getMeta('excluded');
    if(Array.isArray(ex)) S.excluded = new Set(ex);
    const asg = await getMeta('assign');
    if(asg && typeof asg === 'object') S.assign = asg;
    await ensureSession();

    // Dữ liệu cũ chưa gắn kỳ → gán vào kỳ đầu tiên cho việc lọc/xoá luôn nhất quán
    const all = await allProducts();
    const orphan = all.filter(p => !p.sessionId);
    if(orphan.length){
      orphan.forEach(p => p.sessionId = S.sessionId);
      await bulkPut('products', orphan);
    }
    await reloadProducts();
    await loadHistory();
    await ensureUsers();
    await shLoad();
    await handleJoin();
    // Máy đã mở app từ trước: quét QR mời chỉ đổi phần sau dấu # nên Safari KHÔNG tải lại trang.
    // Bắt sự kiện đổi # để vẫn nhận lời mời rồi mở lại màn đăng nhập với danh sách tài khoản mới.
    window.addEventListener('hashchange', async () => {
      if(!/[#&]join=/.test(location.hash)) return;
      closeModal && closeModal();
      if(scanning) await stopScan();
      if(await handleJoin()){ S.view = 'home'; render(); loginScreen(''); }
    });

    // Khôi phục phiên đăng nhập trước đó nếu tài khoản vẫn còn
    const sess = readSession();
    const me = sess ? findUser(sess.u) : null;
    if(me){
      S.me = me;
      S.checker = me.name || me.u;
      await setMeta('checker', S.checker);
      render();
      afterLogin();
    }else{
      render();
      loginScreen('');
    }
  }catch(e){
    console.error(e);
    document.getElementById('main').innerHTML =
      '<div class="card pad"><b style="color:var(--under)">Lỗi khởi tạo</b>' +
      '<div class="tagline" style="margin-top:6px">' + esc(e.message||e) + '</div></div>';
  }
}
boot();
