/* Mở app bằng link mời: lưu cấu hình Cloud, tải dữ liệu + tài khoản về trước khi đăng nhập */
async function handleJoin(){
  const m = /[#&]join=([A-Za-z0-9_\-]+)/.exec(location.hash || '');
  if(!m) return false;
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){ location.hash = ''; }
  let p = null;
  try{ p = JSON.parse(unb64u(m[1])); }catch(e){}
  if(!p || !p.k || !p.b){ toast('Link mời bị lỗi — xin quản lý gửi lại', 'err', 5000); return false; }
  const old = syncCfg();
  // Luôn đăng xuất: máy này có thể đang đăng nhập sẵn (VD tài khoản mặc định Thịnh của máy mới,
  // hoặc tài khoản quản trị) — nhân viên phải đăng nhập bằng tên của chính mình
  clearSession(); S.me = null;
  setSyncCfg(Object.assign({}, old, {key:p.k, binId:p.b}));
  if(p.n){ S.shopName = p.n; await setMeta('shopName', p.n); }
  if(p.c){ S.shopCode = p.c; await setMeta('shopCode', p.c); }
  loading(true, 'Đang kết nối dữ liệu cửa hàng...');
  const ok = await cloudPull({force:true, quiet:true});
  loading(false);
  toast(ok ? 'Đã kết nối ' + (S.shopName || 'cửa hàng') + ' · chọn tên của bạn để đăng nhập'
           : 'Chưa tải được dữ liệu — kiểm tra mạng rồi mở lại link', ok ? 'ok' : 'err', 5000);
  return ok;
}

/* ---------- Tiết kiệm lượt gọi Cloud ----------
   Gói miễn phí JSONBin chỉ có 10.000 lượt gọi cho cả tài khoản, dùng một lần không reset.
   Bản trước mỗi lần lưu số đếm tải lại + ghi lại TOÀN BỘ dữ liệu (~12 lượt/lần), 4 máy quét
   liên tục có thể đốt hết quota trong vài giờ. Giờ:
   - SP được chia vào các "ngăn" cố định theo mã (hash của key), mỗi ngăn là một bin.
     Sửa 1 SP chỉ làm thay đổi đúng 1 ngăn → chỉ ghi lại ngăn đó.
   - Meta lưu dấu (hash) từng ngăn; máy nào đã có đúng bản đó thì không tải lại.
   - Gom nhiều lần lưu thành một lần đẩy (tối đa 30 giây một lần khi đang quét liên tục).
   Bin cũ (chia ngăn tuần tự) vẫn đọc được; lần đẩy đầu tiên sẽ tự chuyển sang cách mới. */
const REQ_LS = 'ddv:req:v1';
function reqStat(){ try{ return JSON.parse(localStorage.getItem(REQ_LS)) || {n:0, since:''}; }catch(e){ return {n:0, since:''}; } }
function bumpReq(){
  const r = reqStat(); r.n = (r.n || 0) + 1; if(!r.since) r.since = now();
  try{ localStorage.setItem(REQ_LS, JSON.stringify(r)); }catch(e){}
}
function reqText(){
  const r = reqStat();
  return 'Máy này đã gọi Cloud ' + (r.n || 0).toLocaleString('vi-VN') + ' lần' +
    (r.since ? ' (từ ' + new Date(r.since).toLocaleDateString('vi-VN') + ')' : '');
}
function h32(str){
  let h = 0x811c9dc5;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16);
}
const bucketOf = (key, nb) => parseInt(h32(String(key)), 16) % nb;
function planChunks(items, nbPrev){
  const enc = new TextEncoder();
  const total = enc.encode(JSON.stringify(items)).length;
  let nb = Math.max(nbPrev || 0, Math.ceil(total / (CHUNK_BYTES * 0.6)), 1);
  for(;;){
    const B = Array.from({length:nb}, () => []);
    items.forEach(it => B[bucketOf(it.key, nb)].push(it));
    B.forEach(b => b.sort((x, y) => x.key < y.key ? -1 : x.key > y.key ? 1 : 0));
    const js = B.map(b => JSON.stringify(b));
    // Ngăn lớn nhất vẫn phải dưới 100KB/bin của gói Free
    if(js.every(j => enc.encode(j).length <= CHUNK_BYTES * 1.45) || nb > 400) return {nb, B, js};
    nb = Math.ceil(nb * 1.5);
  }
}
/* Tải các ngăn còn thiếu. Ngăn nào lỗi thì báo lỗi luôn — hợp nhất trên dữ liệu thiếu rồi
   ghi đè lên mây sẽ làm mất số đếm của máy khác. */
async function fetchChunks(ids){
  const parts = await Promise.all(ids.map(id => binGet(id).catch(() => null)));
  const items = [], real = {};
  parts.forEach((p, i) => {
    if(!p || !Array.isArray(p.items)) throw new Error('Không tải được phần dữ liệu ' + ids[i].slice(-6) + ' — thử lại sau');
    items.push(...p.items);
    real[ids[i]] = h32(JSON.stringify(p.items));   // dấu của nội dung THẬT trong ngăn
  });
  return {items, real};
}
/* Hai máy đẩy cùng lúc có thể để lại một ngăn mang nội dung của máy này trong khi meta
   ghi dấu của máy kia (không có giao dịch nguyên khối giữa các bin). Nhận ra bằng cách so
   dấu nội dung thật với dấu trong meta; lệch thì đẩy lại để gộp đủ số của cả hai máy. */
function raced(L, real){
  if(!L.ch) return new Set();
  const bad = new Set();
  L.ids.forEach((id, i) => { if(id in real && real[id] !== L.ch[i]) bad.add(i); });
  return bad;
}
function remoteLayout(meta){
  const ids = (meta && Array.isArray(meta.chunks)) ? meta.chunks : [];
  const ch = (meta && Array.isArray(meta.ch) && meta.ch.length === ids.length && meta.nb === ids.length) ? meta.ch : null;
  return {ids, ch, nb: ch ? meta.nb : 0};
}

/**
 * Đẩy dữ liệu lên Cloud.
 * Luôn đọc meta trước rồi hợp nhất — nếu ghi đè thẳng, kết quả quét của máy khác
 * (mà máy này chưa kịp nhận) sẽ bị xoá sạch.
 */
async function cloudPush(opt){
  opt = opt || {};
  if(!syncOn()) return false;
  if(uploading){ dirty = true; return false; }
  uploading = true;
  dirty = false;                 // sửa đổi xảy ra TRONG lúc đang đẩy sẽ bật lại cờ này
  setSync('busy', 'Đang đồng bộ...');
  try{
    const c = syncCfg();

    // 1. Đọc meta trên mây, chỉ tải những ngăn máy này chưa có bản mới nhất
    let remoteMeta = null;
    try{ remoteMeta = await binGet(c.binId); }
    catch(e){
      if(!/Không tìm thấy|404|trống/i.test(String(e.message))) throw e;   // lỗi mạng thì dừng, đừng ghi đè
    }
    const L = remoteLayout(remoteMeta);
    const known = (await getMeta('chunkHashes')) || {};
    let remoteProds = [], bad = new Set();
    if(L.ids.length){
      const need = L.ch ? L.ids.filter((id, i) => known[id] !== L.ch[i]) : L.ids;
      if(need.length){ const f = await fetchChunks(need); remoteProds = f.items; bad = raced(L, f.real); }
    }else if(remoteMeta && Array.isArray(remoteMeta.products)){
      remoteProds = remoteMeta.products;   // tương thích định dạng rất cũ
    }

    // 2. Hợp nhất theo từng sản phẩm — bản sửa sau thắng
    const tombs = await mergeTombs(remoteMeta && remoteMeta.tombs);
    const localAll = await allProducts();
    const localMap = {}; localAll.forEach(p => localMap[p.key] = p);
    const pull = [], conflicts = [];
    remoteProds.forEach(r => {
      if(!r || !r.key || isBuried(r, tombs)) return;
      const l = localMap[r.key];
      if(!l || mt(r) > mt(l)){
        if(l && r.tonTT != null && l.tonTT != null && r.tonTT !== l.tonTT && r.checker && r.checker !== S.checker)
          conflicts.push({ten:r.tenSP||r.barcode, cua:l.tonTT, moi:r.tonTT, boi:r.checker});
        pull.push(fat(r));
      }
    });
    if(pull.length) await bulkPut('products', pull);
    // Bia mộ từ máy khác cũng phải áp xuống máy này
    const burySelf = localAll.filter(p => isBuried(p, tombs)).map(p => p.key);
    if(burySelf.length){
      const tx0 = db.transaction('products','readwrite');
      burySelf.forEach(k => tx0.objectStore('products').delete(k));
      await new Promise(r0 => { tx0.oncomplete = r0; tx0.onerror = r0; });
    }
    // Sau bước trên, máy này đã có đủ bản mới nhất của mọi SP → đó chính là dữ liệu cần đẩy
    const merged = (await allProducts()).filter(p => !isBuried(p, tombs)).map(slim);
    const mu = await mergeUsers(remoteMeta && remoteMeta.users, remoteMeta && remoteMeta.userTombs);

    // 3. Chia ngăn cố định, chỉ ghi lại ngăn có thay đổi
    const plan = planChunks(merged, L.nb);
    const hashes = plan.js.map(h32);
    const ids = [];
    let wrote = 0;
    for(let i = 0; i < plan.nb; i++){
      const old = L.ids[i];
      const same = L.ch && L.nb === plan.nb && old && L.ch[i] === hashes[i] && !bad.has(i);
      if(same){ ids.push(old); continue; }
      const body = {part:i, of:plan.nb, items:plan.B[i], at:now()};
      if(old){ await binPut(old, body); ids.push(old); }
      else ids.push(await binCreate(body, 'DDV-KiemKe-p' + i));
      wrote++;
    }
    for(let i = plan.nb; i < L.ids.length; i++) if(L.ids[i]) await binDel(L.ids[i]);
    await setMeta('chunkIds', ids);
    const newKnown = {}; ids.forEach((id, i) => newKnown[id] = hashes[i]);
    await setMeta('chunkHashes', newKnown);

    // 4. Danh sách người đang làm — giữ nguyên dòng của máy khác
    const pres = {};
    if(remoteMeta && remoteMeta.presence) Object.keys(remoteMeta.presence).forEach(k => {
      const v = remoteMeta.presence[k];
      if(v && v.at && Date.now() - new Date(v.at).getTime() < 6*3600*1000) pres[k] = v;
    });
    if(S.checker) pres[S.checker] = {at: now(), dev: deviceName()};
    S.presence = pres;

    // Tài khoản đi kèm meta để mọi máy dùng chung danh sách nhân viên và quyền hạn
    const meta = {
      v: 3, shopCode: S.shopCode, shopName: S.shopName,
      sessionId: S.sessionId, sessions: await allSessions(),
      excluded: Array.from(S.excluded),
      users: mu.users, userTombs: mu.tombs,
      assign: S.assign || {},
      tombs: tombs,
      chunks: ids, ch: hashes, nb: plan.nb,
      count: merged.length, presence: pres, at: now()
    };
    await binPut(c.binId, meta);

    lastRemoteAt = meta.at;
    pollMs = POLL_MIN; startPoll();
    const cfg2 = syncCfg(); cfg2.lastPush = now(); setSyncCfg(cfg2);
    setSync('ok', 'Đã đồng bộ ' + hhmm());
    if(pull.length || burySelf.length){ await reloadProducts(); if(!scanning) render(); }
    if(conflicts.length && !opt.quiet){
      const f = conflicts[0];
      toast(f.boi + ' đã đếm "' + String(f.ten).slice(0,20) + '" = ' + f.moi + ' (số ' + f.cua + ' của bạn bị thay)'
        + (conflicts.length>1 ? ' +' + (conflicts.length-1) + ' SP' : ''), 'warn');
    }
    if(dirty) pushSoon();        // có sửa đổi mới trong lúc đang đẩy
    return true;
  }catch(e){
    console.error('cloudPush', e);
    dirty = true;
    setSync('err', 'Lỗi — chạm để thử lại');
    if(!opt.quiet) toast('Không gửi được lên Cloud: ' + (e.message || e), 'err');
    return false;
  }finally{
    uploading = false;
  }
}

/* Khôi phục các trường phụ khi nhận bản rút gọn từ mây */
function fat(r){
  return {
    key:r.key, id:r.id||'', barcode:r.barcode||'', maSP:r.maSP||'', tenSP:r.tenSP||'',
    group:r.group || detectGroup(r.tenSP), tonHT:r.tonHT==null?0:r.tonHT,
    tonTT:r.tonTT==null?null:r.tonTT, diff:r.diff==null?null:r.diff,
    status:r.status||'none', sessionId:r.sessionId||S.sessionId,
    checker:r.checker||'', checkedAt:r.checkedAt||'',
    mtime:r.mtime || r.checkedAt || '', isOut:!!r.isOut
  };
}

async function cloudPull(opt){
  opt = opt || {};
  if(!syncOn()){ if(!opt.quiet) toast('Chưa cấu hình Cloud','warn'); return false; }
  if(uploading) return false;
  try{
    if(!opt.quiet) setSync('busy', 'Đang tải...');
    const c = syncCfg();
    const meta = await binGet(c.binId);
    if(!meta || typeof meta !== 'object') throw new Error('Bin trống');

    // Không có gì mới thì bỏ qua việc tải các ngăn (tiết kiệm lượt gọi API)
    if(!opt.force && meta.at && meta.at === lastRemoteAt){
      setSync('ok', 'Đã đồng bộ ' + hhmm());
      pollMs = Math.min(POLL_MAX, Math.round(pollMs * 1.5));
      startPoll();
      return true;
    }

    // Chỉ tải ngăn có thay đổi. Phải tải đủ khi: bin cũ chưa có dấu ngăn, bấm tải lại thủ công,
    // hoặc đổi kỳ (cần biết đủ danh sách SP trên mây để dọn SP thừa ở máy này)
    const L = remoteLayout(meta);
    const switching = !!(meta.sessionId && meta.sessionId !== S.sessionId);
    const full = !L.ch || opt.force || switching;
    const known = (await getMeta('chunkHashes')) || {};
    let prods = [], fetchedIdx = [], real = {}, bad = new Set();
    if(L.ids.length){
      fetchedIdx = L.ids.map((id, i) => i).filter(i => full || known[L.ids[i]] !== L.ch[i]);
      if(fetchedIdx.length){
        const f = await fetchChunks(fetchedIdx.map(i => L.ids[i]));
        prods = f.items; real = f.real; bad = raced(L, real);
      }
    }else if(Array.isArray(meta.products)) prods = meta.products;

    // Kỳ kiểm kê: thay thế trọn bộ, kỳ đã xoá ở máy khác cũng biến mất ở đây
    let liveSids = null;
    if(Array.isArray(meta.sessions)){
      liveSids = new Set(meta.sessions.map(s => s.id));
      const localS = await allSessions();
      const del = localS.filter(s => !liveSids.has(s.id)).map(s => s.id);
      if(del.length) await bulkDel('sessions', del);
      await bulkPut('sessions', meta.sessions.filter(s => s && s.id));
      // Xoá luôn SP thuộc kỳ đã bị xoá — nếu chỉ xoá bản ghi kỳ mà giữ lại SP thì
      // IndexedDB sẽ phình dần theo mỗi lần xoá kỳ, và những SP đó cũng không còn
      // đường nào truy cập được nữa.
      const localP = await allProducts();
      const junk = localP.filter(p => p.sessionId && !liveSids.has(p.sessionId)).map(p => p.key);
      if(junk.length) await bulkDel('products', junk);
    }

    // Mọi máy phải cùng một kỳ, nếu không khoá sản phẩm sẽ khác nhau và dữ liệu bị tách đôi
    if(switching){
      const localAll = await allProducts();
      const orphan = localAll.filter(p => p.sessionId === S.sessionId).map(p => p.key);
      const remoteKeys = new Set(prods.map(p => p.key));
      const toDrop = orphan.filter(k => !remoteKeys.has(k));
      if(toDrop.length) await bulkDel('products', toDrop);
      S.sessionId = meta.sessionId;
      await setMeta('sessionId', S.sessionId);
    }

    const tombs = await mergeTombs(meta.tombs);
    let needPush = bad.size > 0;
    {
      const localAll = await allProducts();
      const lm = {}; localAll.forEach(p => lm[p.key] = p);
      const put = [], seen = new Set();
      prods.forEach(r => {
        if(!r || !r.key) return;
        seen.add(r.key);
        if(isBuried(r, tombs)) return;
        const l = lm[r.key];
        if(!l){ put.push(fat(r)); return; }
        if(mt(r) > mt(l)) put.push(fat(r));
        else if(mt(l) > mt(r)) needPush = true;           // máy này có bản mới hơn mà mây chưa có
      });
      if(put.length) await bulkPut('products', put);
      // SP chỉ có ở máy này (thêm lúc mất mạng, hoặc bị máy khác ghi đè cùng lúc) → đẩy lại
      if(fetchedIdx.length){
        const fset = new Set(fetchedIdx);
        localAll.forEach(p => {
          if(needPush || seen.has(p.key) || isBuried(p, tombs)) return;
          if(full || (L.nb && fset.has(bucketOf(p.key, L.nb)))) needPush = true;
        });
      }
    }
    // Sản phẩm máy khác đã xoá thì máy này cũng bỏ theo
    const localNow = await allProducts();
    const bury = localNow.filter(p => isBuried(p, tombs)).map(p => p.key);
    if(bury.length){
      const txb = db.transaction('products','readwrite');
      bury.forEach(k => txb.objectStore('products').delete(k));
      await new Promise(r0 => { txb.oncomplete = r0; txb.onerror = r0; });
    }
    if(L.ch){ const nk = {}; L.ids.forEach((id, i) => nk[id] = (id in real) ? real[id] : L.ch[i]); await setMeta('chunkHashes', nk); }

    if(meta.shopName){ S.shopName = meta.shopName; await setMeta('shopName', S.shopName); }
    if(meta.shopCode){ S.shopCode = meta.shopCode; await setMeta('shopCode', S.shopCode); }
    if(Array.isArray(meta.excluded)){ S.excluded = new Set(meta.excluded); await setMeta('excluded', meta.excluded); }
    if(meta.assign && typeof meta.assign === 'object'){ S.assign = meta.assign; await setMeta('assign', meta.assign); }
    if(Array.isArray(meta.chunks)) await setMeta('chunkIds', meta.chunks);
    if(meta.presence) S.presence = meta.presence;
    {
      const mu = await mergeUsers(meta.users, meta.userTombs);
      if(mu.changed) needPush = true;        // máy này có thay đổi tài khoản mà Cloud chưa có
    }

    lastRemoteAt = meta.at || '';
    pollMs = POLL_MIN; startPoll();
    const cfg2 = syncCfg(); cfg2.lastPull = now(); setSyncCfg(cfg2);

    S.sessions = await allSessions();
    await reloadProducts();
    setSync('ok', 'Đã đồng bộ ' + hhmm());
    if(!scanning) render();
    if(!opt.quiet) toast('Đã tải ' + S.products.length + ' SP từ Cloud', 'ok');
    if(needPush) pushSoon();
    return true;
  }catch(e){
    console.error('cloudPull', e);
    setSync('err', 'Lỗi — chạm để thử lại');
    if(!opt.quiet) toast('Không tải được: ' + (e.message || e), 'err');
    return false;
  }
}

/* Gom nhiều lần lưu liên tiếp thành một lần đẩy: chờ 10 giây yên tĩnh,
   nhưng đang quét liên tục thì cứ tối đa 30 giây đẩy một lần */
let pushFirstAt = 0;
function pushSoon(){
  if(!syncOn()) return;
  dirty = true;
  if(!pushFirstAt) pushFirstAt = Date.now();
  clearTimeout(pushTimer);
  const wait = Math.max(400, Math.min(10000, 30000 - (Date.now() - pushFirstAt)));
  pushTimer = setTimeout(() => { pushFirstAt = 0; cloudPush({quiet:true}); }, wait);
}
async function pushNow(){
  if(!syncOn()) return false;
  clearTimeout(pushTimer); pushFirstAt = 0;
  return cloudPush();
}

function startPoll(){
  clearInterval(pollTimer);
  if(!syncOn()) return;
  pollTimer = setInterval(() => {
    if(document.visibilityState === 'visible' && !uploading && navigator.onLine) cloudPull({quiet:true});
  }, pollMs);
}
function onSyncChip(){
  if(!syncOn()){ openSyncModal(); return; }
  if(syncState === 'err' || dirty) pushNow();
  else cloudPull({force:true});
}
function deviceName(){
  const u = navigator.userAgent || '';
  if(/iPhone/i.test(u)) return 'iPhone';
  if(/iPad/i.test(u)) return 'iPad';
  if(/Android/i.test(u)) return 'Android';
  if(/Macintosh/i.test(u)) return 'Mac';
  if(/Windows/i.test(u)) return 'Windows';
  return 'Khác';
}
/* ---------- UI kit ---------- */
function toast(msg, type, ms){
  const host = $('toasts'); if(!host) return;
  const same = Array.prototype.find.call(host.children, e => e.dataset.m === msg && !e.classList.contains('hide'));
  if(same){ clearTimeout(+same.dataset.t); same.dataset.t = setTimeout(() => killToast(same), ms || 2800); return; }
  const ic = type === 'ok' ? 'i-check' : type === 'err' ? 'i-alert' : type === 'warn' ? 'i-alert' : 'i-info';
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.dataset.m = msg;
  el.innerHTML = svg(ic) + '<span>' + esc(msg) + '</span>';
  el.onclick = () => killToast(el);
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  el.dataset.t = setTimeout(() => killToast(el), ms || (type === 'err' ? 4600 : type === 'warn' ? 3900 : 2800));
  // Chỉ đếm thông báo còn hiện. Bản cũ đếm cả thông báo đang mờ dần (chưa kịp xoá khỏi trang):
  // killToast bỏ qua chúng nên vòng lặp chạy mãi → treo cứng app khi bấm lưu nhanh liên tục.
  const live = () => Array.prototype.filter.call(host.children, e => !e.classList.contains('hide'));
  for(let l = live(); l.length > 3; l = live()) killToast(l[0]);
}
function killToast(el){
  if(!el || el.classList.contains('hide')) return;
  clearTimeout(+el.dataset.t);
  el.classList.add('hide'); el.classList.remove('show');
  setTimeout(() => el.remove(), 240);
}
function loading(on, txt){
  const l = $('loading'); if(!l) return;
  if(txt) $('loadingText').textContent = txt;
  l.classList.toggle('show', !!on);
}

let undoItem = null, undoTimer = null;
function pushUndo(label, fn){
  clearTimeout(undoTimer);
  undoItem = {label, fn};
  const b = $('undobar');
  b.innerHTML = '<span class="t">' + esc(label) + '</span>' +
    '<button class="u" onclick="doUndo()">' + svg('i-undo','ic') + ' HOÀN TÁC</button>' +
    '<button class="x" onclick="hideUndo()">' + svg('i-x','ic') + '</button>';
  b.querySelector('.u').style.cssText += ';display:inline-flex;align-items:center;gap:5px';
  requestAnimationFrame(() => b.classList.add('show'));
  undoTimer = setTimeout(() => { undoItem = null; hideUndo(); }, 12000);
}
function hideUndo(){ $('undobar').classList.remove('show'); }
async function doUndo(){
  if(!undoItem){ hideUndo(); return; }
  const it = undoItem; undoItem = null; clearTimeout(undoTimer); hideUndo();
  loading(true, 'Đang hoàn tác...');
  try{
    await it.fn();
    S.sessions = await allSessions();
    await reloadProducts();
    loading(false);
    toast('Đã hoàn tác: ' + it.label, 'ok');
    render();
    pushSoon();
  }catch(e){ loading(false); toast('Hoàn tác lỗi: ' + e.message, 'err'); }
}

function modal(html, opt){
  opt = opt || {};
  closeModal();
  const back = document.createElement('div');
  back.className = 'modal-back'; back.id = 'mback';
  back.innerHTML = '<div class="modal"><div class="modal-grip"></div>' + html + '</div>';
  back.onclick = e => { if(e.target === back && !opt.sticky) closeModal(); };
  $('modalHost').appendChild(back);
  requestAnimationFrame(() => back.classList.add('show'));
  return back;
}
function closeModal(){
  const b = $('mback'); if(!b) return;
  b.classList.remove('show');
  setTimeout(() => b.remove(), 220);
}
function confirmBox(title, body, okText, danger){
  return new Promise(res => {
    const b = modal(
      '<div class="modal-h"><div><h3>' + esc(title) + '</h3><p>' + body + '</p></div></div>' +
      '<div class="modal-actions">' +
        '<button class="btn sec" id="cno">Hủy</button>' +
        '<button class="btn ' + (danger ? 'danger' : '') + '" id="cyes">' + esc(okText || 'Đồng ý') + '</button>' +
      '</div>', {sticky:true});
    b.querySelector('#cno').onclick = () => { closeModal(); res(false); };
    b.querySelector('#cyes').onclick = () => { closeModal(); res(true); };
  });
}
function promptBox(title, label, val, ph){
  return new Promise(res => {
    const b = modal(
      '<div class="modal-h"><div><h3>' + esc(title) + '</h3></div></div>' +
      '<div class="field"><label>' + esc(label) + '</label>' +
      '<input class="input" id="pv" value="' + esc(val || '') + '" placeholder="' + esc(ph || '') + '"></div>' +
      '<div class="modal-actions"><button class="btn sec" id="pno">Hủy</button>' +
      '<button class="btn" id="pok">Lưu</button></div>', {sticky:true});
    const inp = b.querySelector('#pv');
    setTimeout(() => { inp.focus(); inp.select(); }, 260);
    inp.onkeydown = e => { if(e.key === 'Enter'){ closeModal(); res(inp.value.trim()); } };
    b.querySelector('#pno').onclick = () => { closeModal(); res(null); };
    b.querySelector('#pok').onclick = () => { closeModal(); res(inp.value.trim()); };
  });
}

/* ---------- Navigation ---------- */
function navItems(){
  const base = [
    {k:'home',   t:'Trang chủ', i:'i-home'},
    {k:'count',  t:'Kiểm kê',   i:'i-list'},
    {k:'groups', t:'Nhóm hàng', i:'i-folder'},
    {k:'report', t:'Báo cáo',   i:'i-chart'}
  ];
  // Lịch ca là công cụ sắp xếp của quản lý — nhân viên không thấy tab này
  if(isAdmin()) base.push({k:'shift', t:'Lịch ca', i:'i-clock'});
  base.push({k:'more', t:'Thêm', i:'i-layers'});
  return base;
}
function go(k){
  S.view = k; S.page = 0;
  window.scrollTo(0, 0);
  render();
}
let _navSig = '';
function renderNav(){
  const NAV = navItems();
  const sig = NAV.map(n => n.k).join(',');
  // Dựng lại thanh điều hướng chỉ khi danh sách tab thay đổi. Trước đây mỗi lần
  // render đều xoá và tạo lại toàn bộ nút + icon SVG, gây giật khi thao tác liên tục.
  if(sig !== _navSig){
    _navSig = sig;
    $('sidenav').innerHTML = NAV.map(n =>
      '<button class="navitem" data-k="' + n.k + '" onclick="go(\'' + n.k + '\')">' +
      svg(n.i) + n.t + '</button>').join('') +
      '<div class="navspacer"></div>' +
      '<button class="navitem" onclick="startScan()">' + svg('i-scan') + 'Quét mã</button>';
    $('tabbar').innerHTML = NAV.map(n =>
      '<button class="tab" data-k="' + n.k + '" onclick="go(\'' + n.k + '\')">' +
      svg(n.i) + n.t + '</button>').join('');
  }
  document.querySelectorAll('#sidenav .navitem[data-k], #tabbar .tab[data-k]').forEach(el => {
    el.classList.toggle('active', el.dataset.k === S.view);
  });
}
/* ---------- Thống kê ---------- */
function stats(){
  const act = activeProducts();
  const all = S.products;
  const done = act.filter(p => p.tonTT != null);
  const lech = act.filter(p => p.tonTT != null && p.diff !== 0 && p.diff != null);
  return {
    total: all.length,
    active: act.length,
    done: done.length,
    left: act.length - done.length,
    lech: lech.length,
    pct: act.length ? Math.round(done.length / act.length * 100) : 0,
    ok: act.filter(p => p.status === 'ok').length,
    under: act.filter(p => p.status === 'under').length,
    over: act.filter(p => p.status === 'over').length,
    out: all.filter(p => p.isOut).length,
    qUnder: act.filter(p => p.status==='under').reduce((s,p)=>s+Math.abs(p.diff||0),0),
    qOver: act.filter(p => p.status==='over').reduce((s,p)=>s+Math.abs(p.diff||0),0)
  };
}

function render(){
  // Đang gõ trong ô tìm kiếm (VD máy vừa nhận dữ liệu từ Cloud) thì KHÔNG vẽ lại cả trang:
  // thay ô nhập sẽ làm iPhone đóng / đổi bàn phím giữa chừng. Chỉ làm mới phần danh sách.
  const ae = document.activeElement;
  if(S.view === 'count' && ae && ae.id === 'q' && $('clistWrap')){ refreshList(); return; }
  renderNav();

/* ---------- Kiểm kê (danh sách + đếm) ----------
   Mỗi dòng: tên đủ 2 dòng, mã (đậm 5 số cuối — phần trùng với tem), tồn HT, người đếm;
   bên phải là ô số đếm to tô màu theo trạng thái. Chạm dòng để nhập / sửa số.
   Bộ lọc gọn 1 hàng, nhóm hàng chọn qua nút "Nhóm ▾", cuộn tới đâu tải tới đó. */
function filtered(){
  // Chọn riêng 1 nhóm thì xem trọn nhóm đó; còn lại chỉ hiện nhóm đang bật,
  // để danh sách luôn khớp với các con số thống kê.
  let l = S.group !== 'all' ? S.products.filter(inMyScope) : activeProducts();
  const f = S.filter;
  if(f === 'left') l = l.filter(p => p.tonTT == null);
  else if(f === 'done') l = l.filter(p => p.tonTT != null);
  else if(f === 'ok') l = l.filter(p => p.status === 'ok');
  else if(f === 'under') l = l.filter(p => p.status === 'under');
  else if(f === 'over') l = l.filter(p => p.status === 'over');
  else if(f === 'out') l = l.filter(p => p.isOut);
  else if(f === 'lech') l = l.filter(p => p.tonTT != null && p.diff != null && p.diff !== 0);
  if(S.group !== 'all') l = l.filter(p => (p.group || 'Khác') === S.group);
  const q = S.q.toLowerCase().trim();
  if(q){
    // Gõ vài số cuối của mã cũng tìm ra, vì mã trên tem và mã trong file
    // thường chỉ trùng nhau ở phần đuôi
    const qd = digits(q);
    l = l.filter(p =>
      (p.barcode||'').toLowerCase().includes(q) ||
      (p.maSP||'').toLowerCase().includes(q) ||
      (p.tenSP||'').toLowerCase().includes(q) ||
      (qd.length >= 3 && (digits(p.barcode).endsWith(qd) || digits(p.maSP).endsWith(qd))));
  }
  return l.slice().sort((a,b) => {
    const ad = a.tonTT != null ? 1 : 0, bd = b.tonTT != null ? 1 : 0;
    if(ad !== bd) return ad - bd;             // chưa kiểm lên trước cho dễ làm
    // Đang xem lệch thì lệch nhiều lên đầu
    if(S.filter === 'lech' || S.filter === 'under' || S.filter === 'over'){
      const dd = Math.abs(b.diff || 0) - Math.abs(a.diff || 0); if(dd) return dd;
    }
    return (a.tenSP||'').localeCompare(b.tenSP||'','vi');
  });
}
const primaryOf = f => ['lech','under','over'].indexOf(f) >= 0 ? 'lech' : ['done','ok','out'].indexOf(f) >= 0 ? 'done' : f;
let _cl = [];          // danh sách đang hiện, dùng để nạp thêm khi cuộn
let _cObs = null;
function vCount(){
  const s = stats();
  const bl = blind();
  // Đếm trên chip phải khớp với con số tiến độ phía trên: cùng loại bỏ những nhóm đang tắt
  const base = S.group !== 'all' ? S.products.filter(inMyScope).filter(p => (p.group||'Khác') === S.group) : activeProducts();
  const c = {all: base.length, left:0, done:0, ok:0, under:0, over:0, out:0, lech:0};
  base.forEach(p => {
    if(p.tonTT == null) c.left++; else c.done++;
    if(p.status === 'ok') c.ok++; else if(p.status === 'under') c.under++; else if(p.status === 'over') c.over++;
    if(p.isOut) c.out++;
    if(p.tonTT != null && p.diff != null && p.diff !== 0) c.lech++;
  });
  const P = bl ? [['left','Chưa đếm'],['done','Đã đếm'],['all','Tất cả']]
               : [['left','Chưa kiểm'],['lech','Lệch'],['done','Đã kiểm'],['all','Tất cả']];
  const pf = primaryOf(S.filter);
  let sub = [];
  if(pf === 'lech' && !bl) sub = [['lech','Tất cả lệch'],['under','Thiếu'],['over','Thừa']];
  if(pf === 'done'){ sub = [['done','Tất cả']]; if(!bl) sub.push(['ok','Khớp']); if(c.out) sub.push(['out','Ngoài HT']); }
  const gName = S.group === 'all' ? 'Tất cả' : S.group;

  return (
  '<div class="page-h"><div><h1>Kiểm kê' + (isCross() ? ' <span class="pill purple">CHÉO</span>' : '') + '</h1>' +
  '<p>' + s.done + '/' + s.active + ' đã đếm · còn ' + s.left + ' SP</p></div>' +
  '<button class="btn sm" onclick="startScan()">' + svg('i-scan') + 'Quét</button></div>' +
  (isCross() ? crossBanner() : '') +

  '<div class="cbar">' +
    '<div class="search">' + svg('i-search','si') +
      '<input id="q" placeholder="Tìm tên, mã, vài số cuối…" value="' + esc(S.q) + '" autocomplete="off" enterkeyhint="search">' +
      '<button class="sx' + (S.q ? '' : ' hidden') + '" id="qx" onmousedown="event.preventDefault()" aria-label="Xoá tìm kiếm">' + svg('i-x') + '</button>' +
      '<button class="sfind" onclick="startFind()" aria-label="Quét mã để tìm">' + svg('i-scan') + '</button>' +
    '</div>' +
    '<div class="seg">' + P.map(([k,t]) =>
      '<button class="' + (pf === k ? 'on' : '') + '" onclick="setFilter(\'' + k + '\')">' + t +
      '<span class="num">' + c[k] + '</span></button>').join('') + '</div>' +
    '<div class="cbar2">' +
      '<button class="grpbtn' + (S.group !== 'all' ? ' on' : '') + '" onclick="pickGroup()">' + svg('i-folder') +
        '<span>Nhóm: <b>' + esc(gName) + '</b></span><i>▾</i></button>' +
      (sub.length ? '<div class="subchips">' + sub.map(([k,t]) =>
        '<button class="' + (S.filter === k ? 'on' : '') + '" onclick="setFilter(\'' + k + '\')">' + t + ' <span class="num">' + c[k] + '</span></button>').join('') + '</div>' : '') +
    '</div>' +
  '</div>' +

  '<div id="clistWrap">' + listAreaHTML() + '</div>'
  );
}
function listAreaHTML(){
  const list = _cl = filtered();
  const shown = list.slice(0, (S.page + 1) * PAGE);
  if(!list.length) return emptyBox('i-box', S.q ? 'Không tìm thấy' : 'Không có sản phẩm',
      S.q ? 'Không có SP khớp "' + esc(S.q) + '" trong mục đang lọc' : (S.filter === 'left' ? 'Đã đếm hết mục này 🎉' : 'Thử đổi bộ lọc hoặc import file tồn kho'));

/* Chỉ thay phần danh sách — ô tìm kiếm giữ nguyên để bàn phím không bị đóng / đổi kiểu */

/* Mã hiển thị: đậm 5 số cuối — phần dùng để đối chiếu với tem dán */
function codeHTML(c){
  c = String(c || '');
  if(c.length <= 6) return '<b>' + esc(c) + '</b>';
  return esc(c.slice(0, -5)) + '<b>' + esc(c.slice(-5)) + '</b>';
}
function countRow(p){
  const bl = blind();
  const st = p.tonTT == null ? 'none' : bl ? 'done' : (p.status || 'none');
  const d = p.diff;
  const sub = p.tonTT == null ? 'chưa đếm' : bl ? 'đã đếm' : p.isOut ? 'ngoài HT' : d === 0 ? 'khớp' : (d > 0 ? '+' + d : String(d));
  return '<div class="crow st-' + st + '" data-k="' + esc(p.key) + '">' +
    '<div class="cm"><div class="t">' + esc(p.tenSP || '—') + '</div>' +
      '<div class="s"><span class="cc">' + codeHTML(p.barcode || p.maSP) + '</span>' +
      (bl ? '' : '<span>HT <b class="num">' + (p.tonHT == null ? 0 : p.tonHT) + '</b></span>') +
      (p.checker ? '<span class="who">' + esc(p.checker) + '</span>' : '') + '</div></div>' +
    '<div class="cq"><b class="num">' + (p.tonTT == null ? '—' : p.tonTT) + '</b><span>' + sub + '</span></div>' +
  '</div>';
}
function bindCount(){
  const tb = document.querySelector('.topbar');
  if(tb) document.documentElement.style.setProperty('--tbh', tb.offsetHeight + 'px');
  const q = $('q');
  if(q){
    let t = null, composing = false;
    const x = $('qx');
    const run = () => { clearTimeout(t); t = setTimeout(() => {
      if(S.q === q.value) return;
      S.q = q.value; S.page = 0; refreshList();
    }, 220); };
    q.addEventListener('compositionstart', () => { composing = true; });
    q.addEventListener('compositionend', () => { composing = false; run(); });
    q.oninput = () => { if(x) x.classList.toggle('hidden', !q.value); if(!composing) run(); };
    q.onkeydown = e => { if(e.key === 'Enter') q.blur(); };
    if(x){
      const clr = e => { if(e) e.preventDefault(); q.value = ''; x.classList.add('hidden'); clearTimeout(t); S.q = ''; S.page = 0; refreshList(); q.focus(); };
      x.onclick = clr;
      x.addEventListener('touchend', clr, {passive:false});
    }
  }
  bindList();
}
function bindList(){
  const box = $('clist');
  if(box) box.onclick = e => { const r = e.target.closest('.crow'); if(r) editQty(r.dataset.k); };
  // Cuộn gần tới cuối thì nạp thêm, khỏi phải bấm "Xem thêm"
  if(_cObs){ _cObs.disconnect(); _cObs = null; }
  const sent = $('csent');
  if(sent && box && 'IntersectionObserver' in window){
    _cObs = new IntersectionObserver(ents => {
      if(!ents.some(x => x.isIntersecting)) return;
      const have = box.children.length;
      if(have >= _cl.length) return;
      S.page++;
      box.insertAdjacentHTML('beforeend', _cl.slice(have, (S.page + 1) * PAGE).map(countRow).join(''));
      sent.textContent = box.children.length < _cl.length ? 'Đang tải thêm…' : 'Hết danh sách · ' + _cl.length + ' SP';
    }, {rootMargin:'700px 0px'});
    _cObs.observe(sent);
  }
}

        '<input class="num" id="eqQty" type="number" inputmode="numeric" min="0" value="' + (had ? p.tonTT : '') + '" placeholder="?">' +
        '<button data-d="1">+</button></div>' +
      (bl ? '<div class="rt"><span class="pill purple">Kiểm chéo</span></div>'
          : '<div class="rt"><div class="d num" id="eqDiff"></div><div class="l"><span class="pill" id="eqSt"></span></div></div>') +
    '</div>' +
    '<div class="eq-x">' +
      '<button id="eqInfo">' + svg('i-info') + 'Chi tiết SP</button>' +
      (had ? '<button id="eqClr" class="dg">' + svg('i-trash') + 'Xoá số đếm</button>' : '') +
    '</div>' +
    '<div class="modal-actions">' +
      '<button class="btn sec" onclick="closeModal()">Hủy</button>' +
      '<button class="btn ok" style="flex:2" id="eqGo">' + svg('i-check') + 'Lưu</button>' +
    '</div>', {sticky:true});
  const inp = b.querySelector('#eqQty');
  const calc = () => {
    if(bl) return;
    const el = b.querySelector('#eqDiff'), pl = b.querySelector('#eqSt');
    if(inp.value === ''){ el.textContent = ''; pl.className = 'pill'; pl.textContent = 'Chưa kiểm'; return; }
    const tt = Math.max(0, parseInt(inp.value) || 0), d = tt - ht, s = calcStatus(ht, tt, p.isOut);
    el.textContent = (d > 0 ? '+' : '') + d;
    el.style.color = d === 0 ? 'var(--ok)' : d < 0 ? 'var(--under)' : 'var(--over)';
    pl.className = 'pill ' + (STATUS_CLS[s] || ''); pl.textContent = STATUS_TXT[s];
  };
  b.querySelectorAll('[data-d]').forEach(x => x.onclick = () => {
    inp.value = Math.max(0, (parseInt(inp.value) || 0) + Number(x.dataset.d)); calc();
  });
  inp.oninput = calc;
  const save = async () => {
    if(inp.value === ''){ inp.focus(); toast('Nhập số đã đếm', 'warn'); return; }
    const v = Math.max(0, parseInt(inp.value) || 0);
    closeModal();
    await saveCount(p, v);
    toast(String(p.tenSP || '').slice(0, 30) + ' = ' + v, 'ok', 1500);
    render();
  };
  inp.onkeydown = e => { if(e.key === 'Enter') save(); };
  b.querySelector('#eqGo').onclick = save;
  b.querySelector('#eqInfo').onclick = () => { closeModal(); setTimeout(() => openDetail(p.key), 230); };
  const clr = b.querySelector('#eqClr');
  if(clr) clr.onclick = async () => {
    const snap = Object.assign({}, p);
    closeModal();
    await saveCount(p, null);
    render();
    pushUndo('Đã xoá số đếm: ' + String(p.tenSP || '').slice(0, 22), async () => {
      await bulkPut('products', [Object.assign({}, snap, {mtime: now()})]);
    });
  };
  calc();
  setTimeout(() => { inp.focus(); inp.select(); }, 260);
}

let _findMode = false;
function startFind(){ _findMode = true; startScan(); }
async function findGo(list, code){
  _findMode = false;
  beep(!list.length);
  await stopScan();
  S.filter = 'all'; S.group = 'all'; S.page = 0;
  const p = list.length === 1 ? list[0] : null;
  S.q = p ? String(p.barcode || p.maSP || code) : list.length ? digits(code).slice(-(list.tail || 5)) : String(code);
  go('count');
  if(p) setTimeout(() => editQty(p.key), 300);
  else if(list.length) toast('Mã khớp ' + list.length + ' SP — chọn trong danh sách', 'info');
  else toast('Không có SP nào khớp mã ' + code, 'warn');
}

/* ---------- Nhóm hàng ----------
   Thanh tổng ở đầu trang, lưới 2 cột (mỗi nhóm một ô có vòng tiến độ), người được giao,
   nhóm còn nhiều việc lên trước. Bật/tắt và đổi tên nhóm nằm trong chế độ "Sửa"
   để không lỡ tay tắt mất nhóm. */
function groupOwners(){
  const a = assignMap(), out = {};
  Object.keys(a).forEach(k => {
    const u = findUser(k);
    const nm = u ? (u.name || u.u) : k;
    (a[k] || []).forEach(g => { (out[g] = out[g] || []).push(nm); });
  });
  return out;
}
function ring(pct, done){
  return '<div class="ring' + (done ? ' ok' : '') + '" style="--p:' + pct + '"><span class="num">' + pct + '<small>%</small></span></div>';
}
function vGroups(){
  const bl = blind();
  const adm = isAdmin();
  const m = {};
  S.products.forEach(p => {
    const g = p.group || 'Khác';
    if(!m[g]) m[g] = {n:g, total:0, done:0, lech:0, qU:0, qO:0};
    const x = m[g]; x.total++;
    if(p.tonTT != null){
      x.done++;
      if(p.diff){ x.lech++; if(p.diff < 0) x.qU += -p.diff; else x.qO += p.diff; }
    }
  });
  const all = Object.values(m);
  const order = (a, b) => {
    const ra = a.total - a.done, rb = b.total - b.done;
    if((ra === 0) !== (rb === 0)) return ra === 0 ? 1 : -1;      // nhóm xong xuống cuối
    return rb - ra || a.n.localeCompare(b.n, 'vi');
  };
  const on = all.filter(g => !S.excluded.has(g.n)).sort(order);
  const off = all.filter(g => S.excluded.has(g.n)).sort(order);
  const own = groupOwners();
  const s = stats();

  const tile = (g, isOn) => {
    const pct = g.total ? Math.round(g.done / g.total * 100) : 0;
    const left = g.total - g.done, done = left === 0;
    const who = own[g.n] || [];
    const arg = JSON.stringify(g.n).replace(/"/g, '&quot;');
    return '<div class="gtile' + (done ? ' done' : '') + (isOn ? '' : ' off') + '" role="button" tabindex="0" ' +
      'onclick="' + (S.grpEdit ? 'grpMenu(' + arg + ')' : 'openGroup(' + arg + ')') + '">' +
      '<div class="gt-top">' + ring(pct, done) +
        (who.length ? '<div class="gt-av">' + who.slice(0, 3).map(n =>
          '<span class="av" title="' + esc(n) + '" style="background:' + avColor(n) + '">' + esc((n.trim()[0] || '?').toUpperCase()) + '</span>').join('') +
          (who.length > 3 ? '<span class="av more">+' + (who.length - 3) + '</span>' : '') + '</div>' : '') +
      '</div>' +
      '<div class="gt-n">' + esc(g.n) + '</div>' +
      '<div class="gt-s num">' + g.done + '/' + g.total + (done ? '' : ' · còn ' + left) + '</div>' +
      '<div class="gt-b">' +
        (done ? '<span class="pill ok">Xong</span>' : '') +
        (!bl && g.lech ? '<span class="pill under">' + g.lech + ' lệch</span>' : '') +
        (!isOn ? '<span class="pill">Đang tắt</span>' : '') +
      '</div>' +
      (S.grpEdit ? '<div class="gt-edit" onclick="event.stopPropagation()">' +
        '<span>Tính vào tiến độ</span>' +
        '<label class="switch"><input type="checkbox"' + (isOn ? ' checked' : '') +
        ' onchange="toggleGroup(' + arg + ',this.checked)"><span class="sl"></span></label></div>' : '') +
    '</div>';
  };

  return (
  '<div class="page-h"><div><h1>Nhóm hàng</h1><p>' + (S.grpEdit ? 'Chạm nhóm để đổi tên / gộp · gạt công tắc để tính hoặc bỏ khỏi tiến độ'

  (adm ? '<div style="display:flex;gap:6px">' +
    (S.grpEdit ? '' : '<button class="btn sm sec" onclick="go(\'assign\')">' + svg('i-users') + 'Phân công</button>') +
    '<button class="btn sm' + (S.grpEdit ? '' : ' sec') + '" onclick="S.grpEdit=!S.grpEdit;render()">' +
      (S.grpEdit ? svg('i-check') + 'Xong' : svg('i-edit') + 'Sửa') + '</button></div>' : '') + '</div>' +

  (all.length ? '<div class="card gsum">' + ring(s.pct, s.pct === 100) +
    '<div class="gs-m"><div class="gs-t"><b class="num">' + s.done + '</b> / ' + s.active + ' SP đã kiểm</div>' +
      '<div class="gs-s">Còn <b class="num">' + s.left + '</b> SP' + (s.total !== s.active ? ' · đã loại ' + (s.total - s.active) + ' SP nhóm tắt' : '') + '</div>' +
      (bl ? '<div class="gs-s">Số lệch sẽ hiện sau khi mở đối chiếu</div>'
          : '<div class="gs-l"><span class="pill under">Thiếu ' + s.under + ' SP · ' + s.qUnder + ' cái</span>' +
            '<span class="pill over">Thừa ' + s.over + ' SP · ' + s.qOver + ' cái</span></div>') +
    '</div></div>' : '') +

  (myGroups().length ? '<div class="card pad" style="margin-top:11px;border-color:var(--brand-line);background:var(--brand-soft)">' +

  '<div class="gtiles">' + on.map(g => tile(g, true)).join('') + '</div>' +

    '<div class="gtiles">' + off.map(g => tile(g, false)).join('') + '</div>' : ''))
  );
}
function openGroup(g){
  const left = S.products.some(p => (p.group || 'Khác') === g && p.tonTT == null);

  S.filter = left ? 'left' : 'all';

async function toggleGroup(g, on){
  if(on) S.excluded.delete(g); else S.excluded.add(g);

}

function avColor(n){
  const pal = ['#d01c2a','#177245','#b4690e','#6b21a8','#12557a','#be123c','#4338ca'];

  return pal[h % pal.length];
}

function vTeam(){
  const map = {};
  S.products.forEach(p => {
    if(p.tonTT == null) return;
    const w = p.checker || '(không rõ)';
    if(!map[w]) map[w] = {n:0, lech:0, last:''};
    map[w].n++;
    if(p.diff !== 0 && p.diff != null) map[w].lech++;
    if(p.checkedAt && p.checkedAt > map[w].last) map[w].last = p.checkedAt;
  });
  Object.keys(S.presence||{}).forEach(w => { if(!map[w]) map[w] = {n:0, lech:0, last:''}; });
  if(S.checker && !map[S.checker]) map[S.checker] = {n:0, lech:0, last:''};
  const names = Object.keys(map).sort((a,b) => map[b].n - map[a].n);
  const total = names.reduce((s,w) => s + map[w].n, 0);

  return (
  '<div class="page-h"><div><h1>Nhân viên kiểm kê</h1><p>Ai đang online và đã đếm bao nhiêu</p></div>' +
  '<button class="btn sm sec" onclick="cloudPull({force:true})">' + svg('i-refresh') + '</button></div>' +
  (!names.length ? emptyBox('i-users','Chưa có ai kiểm','Đặt tên nhân viên rồi bắt đầu quét') :
  '<div class="card listcard">' + names.map(w => {
    const x = map[w], pr = (S.presence||{})[w];
    const seen = (pr && pr.at && pr.at > x.last) ? pr.at : x.last;
    const mins = seen ? (Date.now() - new Date(seen).getTime())/60000 : 1e9;
    const cls = mins < 3 ? '' : mins < 30 ? 'idle' : 'off';
    const stx = mins < 3 ? 'Đang online' : mins < 30 ? 'Vừa hoạt động' : 'Không hoạt động';
    return '<div class="tmrow">' +
      '<div class="av" style="background:' + avColor(w) + '">' + esc((w.trim()[0]||'?').toUpperCase()) + '</div>' +
      '<div class="tmb"><div class="n">' + esc(w) + (w===S.checker?'<span class="pill brand">bạn</span>':'') +
        '<span class="odot ' + cls + '"></span></div>' +
        '<div class="m">' + stx + (seen ? ' · ' + relTime(seen) : '') + (pr && pr.dev ? ' · ' + esc(pr.dev) : '') +
        (x.lech ? ' · ' + x.lech + ' SP lệch' : '') + '</div></div>' +
      '<div class="tmc"><div class="n num">' + x.n + '</div><div class="l">SP · ' + (total?Math.round(x.n/total*100):0) + '%</div></div>' +
    '</div>';
  }).join('') + '</div>')
  );
}

/* ---------- Quét mã ----------
   Bộ quét tự viết, thay cho html5-qrcode (thư viện đó đọc QR bằng JavaScript thuần, rất yếu
   trên iPhone và đã ngừng cập nhật từ 2023). Thứ tự bộ giải mã:
     1. BarcodeDetector có sẵn của máy (Android / Chrome) — nhanh nhất
     2. ZXing C++ chạy WebAssembly — dùng cho iPhone, và làm lượt "khó" xen kẽ trên Android
     3. ZXing JavaScript — chỉ khi 2 bộ trên không tải được
   Mỗi khung hình thử một cách đọc khác nhau (vùng khung ngắm / cả khung hình / ảnh mờ),
   nên mã nằm lệch khung, mã QR to, hay mã hơi nhoè đều có cơ hội được bắt. */
let scanning = false, paused = false, torch = false;
let lastCode = '', lastAt = 0, stillBusy = false;
let camStream = null, camTrack = null, camEngine = null, camDetector = null, zxJs = null;
let camBusy = false, camLastTick = 0, camFrame = 0, camDecAvg = 40, camRate = 0, camRateT = 0;
let camWatch = null, camFrozenN = 0, camLastT = -1, camRestarting = false, camWake = null;
let seenCode = '', seenAt = 0, pendCode = '', pendAt = 0;
const camCv = document.createElement('canvas');
const camCx = camCv.getContext('2d', {willReadFrequently:true});

const WASM_URL = 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/reader/zxing_reader.wasm';
const ZXJS_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const WASM_FMT = ['QRCode','Code128','EAN13','EAN8','UPCA','UPCE','Code39','Code93','ITF','DataMatrix'];
const NATIVE_FMT = ['qr_code','code_128','ean_13','ean_8','upc_a','upc_e','code_39','code_93','itf','data_matrix'];
/* Loại mã có số kiểm tra (checksum) — đọc trúng 1 lần là chắc chắn đúng.
   Code39 / ITF / Codabar không có checksum bắt buộc nên phải đọc trùng 2 lần mới nhận. */
const STRONG_FMT = /^(qrcode|code128|eanupc|ean13|ean8|upca|upce|code93|datamatrix|microqrcode)/;
const normFmt = f => String(f || '').toLowerCase().replace(/[^a-z0-9]/g, '');

let wasmReady = null;
function prepWasm(){
  if(wasmReady) return wasmReady;
  if(!window.ZXingWASM) return Promise.resolve(false);      // thư viện chưa tải xong — lần sau thử lại
  wasmReady = Promise.race([
    Promise.resolve(ZXingWASM.prepareZXingModule({
      overrides:{locateFile:(p, pre) => p.endsWith('.wasm') ? WASM_URL : pre + p},
      fireImmediately:true
    })).then(() => true),
    new Promise(r => setTimeout(() => r(false), 15000))
  ]).catch(() => false);
  wasmReady.then(ok => { if(!ok) wasmReady = null; });
  return wasmReady;
}
async function wasmRead(img, opt){
  const res = await ZXingWASM.readBarcodes(img, Object.assign({
    formats:WASM_FMT, tryHarder:true, tryInvert:false, tryDownscale:true,
    maxNumberOfSymbols:4, textMode:'Plain'
  }, opt || {}));
  return res.filter(r => r.isValid && r.text).map(r => {
    const p = r.position;
    return {text:r.text, format:r.symbology || r.format,
      cx:(p.topLeft.x + p.topRight.x + p.bottomLeft.x + p.bottomRight.x) / 4,
      cy:(p.topLeft.y + p.topRight.y + p.bottomLeft.y + p.bottomRight.y) / 4};
  });
}
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function setupZxJs(){
  if(!window.ZXing){ try{ await loadScript(ZXJS_URL); }catch(e){ return false; } }
  if(!window.ZXing) return false;
  const Z = window.ZXing, F = Z.BarcodeFormat, h = new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS, [F.QR_CODE, F.CODE_128, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_39, F.CODE_93, F.ITF]);
  h.set(Z.DecodeHintType.TRY_HARDER, true);
  zxJs = new Z.MultiFormatReader(); zxJs.setHints(h);
  return true;
}
function zxJsRead(W, H, rotate){
  const Z = window.ZXing;
  const d = camCx.getImageData(0, 0, W, H).data;
  let L = new Uint8ClampedArray(W * H);
  for(let i = 0, j = 0; j < L.length; i += 4, j++) L[j] = (d[i] * 77 + d[i+1] * 150 + d[i+2] * 29) >> 8;
  let w = W, h = H;
  if(rotate){
    const o = new Uint8ClampedArray(W * H);
    for(let y = 0; y < H; y++) for(let x = 0; x < W; x++) o[x * H + (H - 1 - y)] = L[y * W + x];
    L = o; w = H; h = W;
  }
  try{
    const r = zxJs.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(L, w, h))));
    return [{text:r.getText(), format:String(Z.BarcodeFormat[r.getBarcodeFormat()] || ''), cx:w/2, cy:h/2}];
  }catch(e){ return []; }
  finally{ try{ zxJs.reset(); }catch(e){} }
}
async function pickEngine(){
  if('BarcodeDetector' in window){
    try{
      const sup = await BarcodeDetector.getSupportedFormats();
      const f = NATIVE_FMT.filter(x => sup.indexOf(x) >= 0);
      if(f.indexOf('qr_code') >= 0 && f.indexOf('code_128') >= 0){
        camDetector = new BarcodeDetector({formats:f});
        prepWasm();                    // tải sẵn để làm lượt "khó" xen kẽ
        return 'native';
      }
    }catch(e){}
  }
  if(await prepWasm()){
    try{ await wasmRead(new ImageData(8, 8)); return 'wasm'; }catch(e){}
  }
  if(await setupZxJs()) return 'zxing';
  return null;
}

   "Hỏi SL": mỗi lần quét mở bảng nhập số lượng (như trước).
   "+1 liên tục": mỗi lần quét cộng 1 vào số đã đếm, không cần bấm lưu — giống súng bắn mã. */
let scanMode = 'ask';

/* ---------- Camera ---------- */
async function openCam(){
  const tries = [
    {facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:30}},
    {facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}},
    {facingMode:'environment'},
    true
  ];
  let err = null;
  camStream = null;
  for(const v of tries){
    try{ camStream = await navigator.mediaDevices.getUserMedia({audio:false, video:v}); break; }
    catch(e){
      err = e;
      if(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) break;   // bị từ chối quyền thì thử tiếp cũng vô ích
    }
  }
  if(!camStream) throw err || new Error('Không mở được camera');
  camTrack = camStream.getVideoTracks()[0];
  try{ await camTrack.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
  const tk = camTrack;
  tk.addEventListener('ended', () => { if(scanning && !camRestarting && tk === camTrack) restartCam('Camera bị ngắt — đã tự bật lại'); });
  const v = $('camVideo');
  v.srcObject = camStream;
  try{ await v.play(); }catch(e){}
  camExtras();
}
function closeCam(){
  if(camStream) camStream.getTracks().forEach(t => { try{ t.stop(); }catch(e){} });
  camStream = null; camTrack = null;
  const v = $('camVideo'); if(v) v.srcObject = null;
}
async function restartCam(msg){
  if(camRestarting || !scanning) return;
  camRestarting = true;
  try{
    closeCam();
    await openCam();
    if(msg) toast(msg, 'info', 2200);
  }catch(e){ toast('Mất camera: ' + (e && e.message || e), 'err'); }
  camRestarting = false; camFrozenN = 0;
}
/* Camera trên iPhone hay bị "đứng hình" sau khi chuyển app hoặc khoá màn hình:
   video không chạy nữa nhưng cũng không báo lỗi. Cứ 1,2 giây kiểm tra một lần,
   thấy hình đứng yên 3 lần liền thì tự mở lại camera. */
function startWatch(){
  clearInterval(camWatch);
  camFrozenN = 0; camLastT = -1;
  camWatch = setInterval(() => {
    if(!scanning || paused || camRestarting || document.visibilityState !== 'visible') return;
    const v = $('camVideo');
    const dead = !camTrack || camTrack.readyState === 'ended' || camTrack.muted;
    const ct = v ? v.currentTime : 0;
    if(ct === camLastT) camFrozenN++; else camFrozenN = 0;
    camLastT = ct;
    if(dead || camFrozenN >= 3) restartCam('Camera bị đứng — đã tự bật lại');
  }, 1200);
}
async function keepAwake(on){
  try{
    if(on && navigator.wakeLock && !camWake) camWake = await navigator.wakeLock.request('screen');
    if(!on && camWake){ await camWake.release(); camWake = null; }
  }catch(e){ camWake = null; }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible' || !scanning) return;
  if(!camTrack || camTrack.readyState === 'ended' || camTrack.muted) restartCam();
  else { const v = $('camVideo'); if(v) v.play().catch(() => {}); }
  camWake = null; keepAwake(true);
});
window.addEventListener('pageshow', e => { if(e.persisted && scanning) restartCam(); });

function camExtras(){
  const caps = (camTrack && camTrack.getCapabilities) ? camTrack.getCapabilities() : {};
  $('torchBtn').classList.toggle('hidden', !caps.torch);
  const r = $('zoomRange');
  if(caps.zoom && caps.zoom.max > caps.zoom.min){
    r.min = caps.zoom.min; r.max = Math.min(caps.zoom.max, 6); r.step = caps.zoom.step || 0.1;
    let z = null; try{ z = parseFloat(localStorage.getItem('ddv:zoom')); }catch(e){}
    if(!(z >= caps.zoom.min && z <= r.max)) z = caps.zoom.min;
    r.value = z; onZoom(z, true);
    $('scanZoom').style.display = 'flex';
  }else $('scanZoom').style.display = 'none';
  if(torch && caps.torch) camTrack.applyConstraints({advanced:[{torch:true}]}).catch(() => {});
}
function onZoom(v, silent){
  v = parseFloat(v);
  if(!silent){ try{ localStorage.setItem('ddv:zoom', String(v)); }catch(e){} }
  if(camTrack) camTrack.applyConstraints({advanced:[{zoom:v}]}).catch(() => {});

/* Chạm vào hình để lấy nét chỗ đó (Android hỗ trợ; iPhone tự lấy nét nên bỏ qua) */
async function tapFocus(ev){
  if(!camTrack || ev.target.closest('button,input,.sheet,.qcard')) return;
  const caps = camTrack.getCapabilities ? camTrack.getCapabilities() : {};
  const ring = $('focusRing');
  if(ring){
    ring.style.left = ev.clientX + 'px'; ring.style.top = ev.clientY + 'px';
    ring.classList.remove('on'); void ring.offsetWidth; ring.classList.add('on');
  }
  if(!caps.focusMode || caps.focusMode.indexOf('single-shot') < 0) return;
  const v = $('camVideo').getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (ev.clientX - v.left) / v.width));
  const y = Math.min(1, Math.max(0, (ev.clientY - v.top) / v.height));
  try{
    await camTrack.applyConstraints({advanced:[{focusMode:'single-shot', pointsOfInterest:[{x, y}]}]});
    setTimeout(() => { if(camTrack) camTrack.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(() => {}); }, 2000);
  }catch(e){}
}

/* ---------- Đọc khung hình ---------- */
/* Đổi vị trí khung ngắm trên màn hình sang toạ độ trong ảnh camera (video đang phủ kín
   màn hình kiểu object-fit:cover nên phần thừa hai bên bị cắt) */
function boxInVideo(){
  const v = $('camVideo'), box = $('scanBox');
  const vr = v.getBoundingClientRect(), br = box.getBoundingClientRect();
  const vw = v.videoWidth, vh = v.videoHeight;
  const s = Math.max(vr.width / vw, vr.height / vh);
  const ox = (vr.width - vw * s) / 2, oy = (vr.height - vh * s) / 2;
  // Khung vuông gọn cho QR; vùng đọc thật rộng thêm hai bên để mã vạch dài (1D) vượt khung vẫn đọc được
  const px = br.width * 0.28, py = br.height * 0.1;
  let x = (br.left - vr.left - ox - px) / s, y = (br.top - vr.top - oy - py) / s;
  let w = (br.width + px * 2) / s, h = (br.height + py * 2) / s;
  x = Math.max(0, x); y = Math.max(0, y);
  w = Math.min(vw - x, w); h = Math.min(vh - y, h);
  return {x, y, w, h};
}
function grab(full, maxW){
  const v = $('camVideo');
  const r = full ? {x:0, y:0, w:v.videoWidth, h:v.videoHeight} : boxInVideo();
  const sc = Math.min(1, maxW / r.w);
  const W = Math.max(1, Math.round(r.w * sc)), H = Math.max(1, Math.round(r.h * sc));
  if(camCv.width !== W || camCv.height !== H){ camCv.width = W; camCv.height = H; }
  camCx.drawImage(v, r.x, r.y, r.w, r.h, 0, 0, W, H);
  return {W, H};
}
async function decodeFrame(){
  const k = camFrame % 4;
  let W, H, list = [];
  if(k === 3 && camEngine !== 'zxing' && await (wasmReady || Promise.resolve(false))){
    // Ảnh hơi nhoè (camera iPhone đang lấy nét lại): thu nhỏ vùng khung trước khi đọc làm nét cạnh rõ hơn
    ({W, H} = grab(false, 640));
    list = await wasmRead(camCx.getImageData(0, 0, W, H), {tryDownscale:false, tryDenoise:true});
    return {list, W, H};
  }
  if(camEngine === 'native'){
    if(k === 2 && wasmReady){
      // lượt "khó": ZXing WASM với bộ lọc chống mờ, bắt mã mà bộ đọc của máy bỏ sót
      if(await wasmReady){
        ({W, H} = grab(false, 1100));
        list = await wasmRead(camCx.getImageData(0, 0, W, H), {binarizer:'GlobalHistogram', tryDenoise:true});
        return {list, W, H};
      }
    }
    ({W, H} = grab(k === 1, k === 1 ? 1280 : 1600));
    const res = await camDetector.detect(camCv);
    list = res.map(b => ({text:b.rawValue, format:b.format,
      cx:b.boundingBox.x + b.boundingBox.width / 2, cy:b.boundingBox.y + b.boundingBox.height / 2}));
    return {list, W, H};
  }
  if(camEngine === 'wasm'){
    if(k === 0){ ({W, H} = grab(false, 1280)); list = await wasmRead(camCx.getImageData(0, 0, W, H)); }
    else if(k === 1){ ({W, H} = grab(true, 1000)); list = await wasmRead(camCx.getImageData(0, 0, W, H), {tryRotate:true}); }
    else { ({W, H} = grab(false, 960)); list = await wasmRead(camCx.getImageData(0, 0, W, H), {binarizer:'GlobalHistogram', tryDenoise:true}); }
    return {list, W, H};
  }
  if(camEngine === 'zxing'){
    ({W, H} = grab(k === 1, k === 1 ? 900 : 1100));
    list = zxJsRead(W, H, false);
    return {list, W, H};
  }
  return {list:[], W:1, H:1};
}
async function camLoop(ts){
  if(!scanning) return;
  const v = $('camVideo');
  const gap = Math.max(camEngine === 'native' ? 40 : 45, camDecAvg * 1.15);
  if(!paused && !camBusy && camEngine && v && v.readyState >= 2 && v.videoWidth && ts - camLastTick >= gap){
    camBusy = true; camLastTick = ts; camFrame++;
    const t0 = performance.now();
    try{
      const r = await decodeFrame();
      onFrame(r.list, r.W, r.H);
    }catch(e){}
    camDecAvg = camDecAvg * 0.8 + (performance.now() - t0) * 0.2;
    camBusy = false;
    camRate++;
    if(ts - camRateT > 1000){ const t = $('engRate'); if(t) t.textContent = camRate + '/s'; camRate = 0; camRateT = ts; }
  }
  requestAnimationFrame(camLoop);
}
function onFrame(list, W, H){
  const box = $('scanBox');
  if(!list || !list.length){ if(box) box.classList.remove('seen'); return; }
  if(box) box.classList.add('seen');
  // Tem thường có cả QR lẫn mã vạch: ưu tiên mã ra được sản phẩm, rồi tới mã gần tâm khung
  list.sort((a, b) => Math.hypot(a.cx - W/2, a.cy - H/2) - Math.hypot(b.cx - W/2, b.cy - H/2));
  const pick = list.find(r => resolveCode(r.text).list.length) || list[0];
  acceptRead(pick.text, pick.format);
}
function acceptRead(text, fmt){
  const t = performance.now();
  text = String(text || '').trim();
  if(!text) return;
  if(!STRONG_FMT.test(normFmt(fmt)) && !(pendCode === text && t - pendAt < 1500)){ pendCode = text; pendAt = t; return; }
  pendCode = text; pendAt = t;
  // Mã còn nằm trong khung liên tục thì không tính là lần quét mới — phải đưa ra rồi đưa vào lại
  const still = seenCode === text && t - seenAt < 450;
  seenCode = text; seenAt = t;
  if(paused) return;
  // Chế độ +1 tự cộng không hỏi → mã phải rời khung rồi vào lại mới tính tiếp.
  // Chế độ hỏi số lượng có bảng xác nhận → mã cùng loại (các hộp giống hệt nhau đặt cạnh nhau)
  // vẫn nhận lại sau 2,5 giây dù chưa rời khung, khỏi phải lia ra lia vào.
  if(text === lastCode && (t - lastAt < 1300 || (still && (scanMode === 'plus' || t - lastAt < 2500)))) return;
  lastCode = text; lastAt = t;
  onScan(text);
}

/* Báo hiệu quét thành công — dùng đồng thời nhiều kênh vì mỗi hệ máy chặn một kiểu:
   - Rung: Android/Chrome chạy tốt kể cả khi máy im lặng. Safari trên iPhone
     KHÔNG cho web gọi rung, nên iPhone bù bằng nháy màn hình.
   - Nháy màn hình: luôn thấy được, kể cả im lặng lẫn ở nơi ồn.
   - Tiếng bíp: chỉ nghe khi máy bật chuông. */
function flashOK(bad){
  let f = document.getElementById('scanFlash');

    f = document.createElement('div');

    f.className = 'scanflash';
    (document.getElementById('scanview') || document.body).appendChild(f);
  }
